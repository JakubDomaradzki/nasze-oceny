<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasze oceny</title>
<style>
:root{
  --bg:#f3f3f5;--card:#fff;--text:#18181b;--muted:#6b6b74;--line:#e4e4e8;--soft:#f7f7f9;
  --accent:#2f9e44;--g:#4cb050;--y:#e0b62a;--r:#e0573a;--none:#b5b5bd;--focus:#2f9e44;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111113;--card:#1b1b1e;--text:#ececef;--muted:#9b9ba4;--line:#2b2b30;--soft:#202024;
  --accent:#55c35b;--none:#55555c;--shadow:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--soft);padding:8px 14px;white-space:nowrap}
button:hover:not(:disabled){filter:brightness(.97)}
button:disabled{opacity:.5;cursor:default}
.btn-p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-d{color:var(--r);border-color:var(--r);background:transparent}
.btn-d.armed{background:var(--r);color:#fff}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:600}

/* nav */
.nav{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:54px}
.brand{font-weight:800;letter-spacing:.3px;font-size:17px;white-space:nowrap}
.brand b{color:var(--accent)}
.links{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{padding:7px 11px;border-radius:7px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.links a.on{color:var(--text);background:var(--soft)}
.links a:hover{color:var(--text)}
.me{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.me a{font-weight:600}
.me button{padding:5px 10px;font-size:13px}
@media (max-width:720px){.nav-in{flex-wrap:wrap;height:auto;padding:8px 12px;gap:6px}.links{order:3;flex-basis:100%}.me{margin-left:auto}}

main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.2px}
h2{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.err{color:var(--r);font-size:14px;margin-top:8px}
.ok{color:var(--accent);font-size:14px;margin-top:8px}

/* score badge */
.score{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 7px;border-radius:7px;color:#fff;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.score.big{min-width:54px;height:38px;font-size:19px;border-radius:9px}
.score.sm{min-width:34px;height:24px;font-size:13px;border-radius:6px}

/* cover */
.cover{position:relative;display:inline-block;flex:none;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#9aa 0%,#667 100%)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover i{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:800;opacity:.85}
.cover.noimg i{display:flex}
.c48{width:48px;height:48px}.c48 i{font-size:18px}
.c64{width:64px;height:64px}.c64 i{font-size:24px}
.cfull{width:100%;aspect-ratio:1;border-radius:8px}.cfull i{font-size:42px}
.c260{width:260px;height:260px;border-radius:10px}.c260 i{font-size:80px}
@media (max-width:640px){.c260{width:100%;height:auto;aspect-ratio:1}}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:0 0 14px}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.filters select,.filters input{width:auto;min-width:130px;padding:6px 9px}
.filters input[type=search]{min-width:220px}

/* ranking rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:40px 64px 1fr auto 74px;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--soft)}
.rk{font-weight:800;font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.row.top1 .rk{color:#d4a20b}.row.top2 .rk{color:#9097a3}.row.top3 .rk{color:#b87333}
.meta{min-width:0;display:flex;flex-direction:column}
.meta b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--text);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--muted);font-size:12.5px}
.sc{display:flex;flex-direction:column;align-items:center;gap:2px}
.sc small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mine{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.mine b{color:var(--text)}
@media (max-width:640px){.row{grid-template-columns:28px 48px 1fr auto;gap:10px;padding:9px 10px}.row .mine{display:none}.row .cover{width:48px;height:48px}.rk{font-size:15px}}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .t{font-weight:700;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .a{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cw{position:relative}
.tile .cw .score{position:absolute;right:6px;bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tile:hover .t{text-decoration:underline}

/* years */
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ycard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.ycard:hover{border-color:var(--accent)}
.ycard .yy{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.ycard .yt{font-size:13px;min-width:0}
.ycard .yt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chip{padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{opacity:.7;font-weight:500}

/* album page */
.ahead{display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:start}
@media (max-width:640px){.ahead{grid-template-columns:1fr;gap:16px}}
.ainfo h1{font-size:30px;line-height:1.15}
.artist{font-size:19px;font-weight:600;margin:0 0 6px}
.facts{color:var(--muted);font-size:14px;margin-bottom:18px}
.avgbox{display:flex;align-items:center;gap:18px;padding:16px 18px;border-radius:14px;background:var(--soft);border:1px solid var(--line);margin-bottom:16px}
.avgnum{font-size:56px;font-weight:900;line-height:1;color:#fff;border-radius:12px;padding:12px 16px;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.avglbl{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:700}
.avgsub{font-size:15px;margin-top:4px}
.avgsub b{font-variant-numeric:tabular-nums}
.ranks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ranks a{font-size:12.5px;background:var(--card);border:1px solid var(--line);padding:3px 9px;border-radius:12px;font-weight:600}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:24px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.rlist .ri{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.rlist .ri:last-child{border-bottom:none}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.ri .nm{font-weight:700}
.ri .cm{font-size:14px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.ri .dt{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar>div{height:100%}
.form{display:grid;gap:10px}
.form label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:560px){.three{grid-template-columns:1fr 1fr}}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scorein{font-size:26px;font-weight:800;text-align:center;max-width:120px;padding:6px}

/* add */
.mbres{display:grid;gap:6px;margin-top:10px;max-height:420px;overflow:auto}
.mbitem{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;text-align:left;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);white-space:normal}
.mbitem:hover{border-color:var(--accent)}
.mbitem small{color:var(--muted)}
.preview{display:flex;gap:12px;align-items:center}

/* table */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--soft)}
.st-new{color:var(--accent);font-weight:600}.st-old{color:var(--muted)}.st-bad{color:var(--r);font-weight:600}

#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.toast.bad{background:var(--r)}

/* przełącznik albumy/single */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);align-self:end}
.seg button{border:none;border-radius:0;background:transparent;padding:7px 14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.av{overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.btn-on{border-color:var(--accent);color:var(--accent);font-weight:600}

/* strona główna */
.hello{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.hello h1{margin:0}
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.home{grid-template-columns:1fr}}
.hmain{display:grid;gap:18px;min-width:0}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.shead h2{margin:0}
.shead select{width:auto;padding:4px 8px}
.mrow{display:grid;grid-template-columns:28px 48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);border-radius:6px}
.mrow:hover{background:var(--soft)}
.mrow:last-child{border-bottom:none}
.mrow .rk{font-size:15px}
.mrow .r2{display:flex;align-items:center;gap:10px}
.mrow .grp{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.c40{width:40px;height:40px}.c40 i{font-size:15px}
.feed{position:sticky;top:70px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;padding:16px 0 6px}
.feed h2{padding:0 16px}
.feedl{overflow:auto;padding:0 16px;overscroll-behavior:contain}
@media (max-width:900px){.feed{position:static;max-height:540px}}
.fi{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:none}
.fi .who{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13.5px}
.fi .alb{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:13px;min-width:0}
.fi .alb div{min-width:0}
.fi .alb b,.fi .alb span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .alb span{color:var(--muted)}
.fi .cm{font-size:12.5px;color:var(--muted);margin-top:4px;font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fi time{font-size:11.5px;color:var(--muted)}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.fav{position:relative}
.favctl{position:absolute;top:5px;right:5px;display:flex;gap:3px}
.favctl button{padding:2px 7px;font-size:13px;background:rgba(0,0,0,.7);color:#fff;border:none}
.picker{position:relative;margin-bottom:12px}
.pres{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:320px;overflow:auto;margin-top:4px}
.pres button{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;width:100%;text-align:left;border:none;border-radius:0;border-bottom:1px solid var(--line);background:transparent;white-space:normal;padding:6px 10px}
.pres button:hover{background:var(--soft)}
.pres small{color:var(--muted)}
.lrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lrow .meta small{display:block}
.lrow button{padding:5px 10px;font-size:13px}
@media (max-width:560px){.lrow{grid-template-columns:48px minmax(0,1fr) auto}.lrow .sc{display:none}.lrow .okb{display:none}}

/* losowanie */
.rnd{display:grid;grid-template-columns:260px minmax(0,1fr);gap:26px;align-items:start;margin-top:18px}
@media (max-width:640px){.rnd{grid-template-columns:1fr}}
.dice{font-size:17px;padding:11px 26px}
.who-rated{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.who-rated a{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:3px 10px 3px 3px;font-size:13px}
.pool{font-size:14px;color:var(--muted);margin:4px 0 0}

/* login */
.login{max-width:360px;margin:9vh auto 0}
.login h1{text-align:center;margin-bottom:4px}
.login .sub{text-align:center}
</style>
</head>
<body>
<div id="top"></div>
<main id="app"><div class="loading">Ładowanie…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* KONFIGURACJA jest w osobnym pliku config.js (obok index.html) */
const CONFIG = Object.assign({
  SUPABASE_URL: 'https://tebavdikzkdejjrfynqs.supabase.co',
  SUPABASE_KEY: 'sb_publishable_rpuWtPaSEj_IGrCzBi-a9g_AISeAbL0',
  LOGIN_DOMAIN: 'oceny.app',
  SITE_NAME: 'Nasze oceny',
}, window.OCENY_CONFIG || {}); // dane z pliku config.js
/* ===================================================================== */

const TYPES = ['LP','EP','Mixtape','Kompilacja','Live','Singiel','Inne'];
const app = document.getElementById('app');
const top_ = document.getElementById('top');
let sb = null;
const S = {
  user:null, profiles:new Map(), albums:new Map(), ratings:[],
  byAlbum:new Map(), byUser:new Map(), loadedAt:0,
  favs:[], listen:[], missing:false,
  f:{min:2, type:'all', kind:'albums'}, af:{q:'', f:'all', sort:'added', limit:120, kind:'albums'},
  home:{year:new Date().getFullYear(), all:false, edit:false},
  rand:{src:'unrated', from:'', to:'', kind:'albums', min:75, last:null},
};

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => v == null ? '–' : (Math.round(v * 10) / 10).toString().replace('.', ',');
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';
const col = v => v == null ? 'var(--none)' : v >= 70 ? 'var(--g)' : v >= 50 ? 'var(--y)' : 'var(--r)';
const badge = (v, cls = '') => `<span class="score ${cls}" style="background:${col(v)}">${num(v)}</span>`;
function pl(n, one, few, many){ const a = Math.abs(n) % 100, b = a % 10;
  return n === 1 ? one : (b >= 2 && b <= 4 && !(a >= 12 && a <= 14)) ? few : many; }
const ocen = n => `${n} ${pl(n,'ocena','oceny','ocen')}`;
const fmtDate = d => d ? new Date(d).toLocaleDateString('pl-PL') : '';
function push(map, k, v){ let a = map.get(k); if(!a){ a = []; map.set(k, a); } a.push(v); }
function parseScore(s){ const v = parseFloat(String(s).trim().replace(',', '.'));
  return isFinite(v) && v >= 0 && v <= 100 ? Math.round(v * 10) / 10 : null; }
const typeGroup = t => t === 'LP' ? 'LP' : t === 'EP' ? 'EP' : 'Inne';
const norm = s => String(s || '').trim().toLowerCase();
const keyOf = (artist, title) => norm(artist) + '\u0001' + norm(title);
function coverHtml(a, cls = 'c64'){
  const u = safeUrl(a && a.cover_url), ini = esc(((a && a.title) || '?').trim().charAt(0).toUpperCase() || '?');
  return u ? `<span class="cover ${cls}"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg');this.remove()"><i>${ini}</i></span>`
           : `<span class="cover ${cls} noimg"><i>${ini}</i></span>`;
}
const AV_COLORS = ['#e0573a','#2f9e44','#3b7dd8','#9c4fd6','#d6872f','#1f9e98','#d64f8a','#6b7a2f','#5a63d6','#a0522d'];
function avColor(id){ let h = 0; for(const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
function pname(id){ const p = S.profiles.get(id); return p ? (p.display_name || p.username || '?') : '(usunięty)'; }
function avatar(id, size = 36){
  const p = S.profiles.get(id), u = safeUrl(p && p.avatar_url);
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px;background:${avColor(id)}`;
  return u ? `<span class="av" style="${st}"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>`
           : `<span class="av" style="${st}">${esc(pname(id).charAt(0).toUpperCase())}</span>`;
}
const isSingle = a => a.type === 'Singiel';
const kindOk = (a, kind) => kind === 'all' || (kind === 'singles' ? isSingle(a) : !isSingle(a));
function timeAgo(d){
  if(!d) return ''; const s = (Date.now() - new Date(d)) / 1000;
  if(s < 60) return 'przed chwilą';
  if(s < 3600){ const m = Math.floor(s / 60); return `${m} min temu`; }
  if(s < 86400){ const h = Math.floor(s / 3600); return `${h} godz. temu`; }
  const dd = Math.floor(s / 86400);
  if(dd === 1) return 'wczoraj'; if(dd < 7) return `${dd} dni temu`;
  return fmtDate(d);
}
function segHtml(id, cur, opts = [['albums','Albumy'],['singles','Single']]){
  return `<div class="seg" id="${id}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}
function bindSeg(id, fn){ const el = document.getElementById(id); if(el) el.querySelectorAll('button').forEach(b => b.onclick = () => fn(b.dataset.v)); }

/* ---------- data ---------- */
async function fetchAll(table){
  let out = [], from = 0; const step = 1000;
  for(;;){
    const { data, error } = await sb.from(table).select('*').range(from, from + step - 1);
    if(error) throw error;
    out = out.concat(data || []);
    if(!data || data.length < step) break;
    from += step;
  }
  return out;
}
async function loadData(){
  let missing = false;
  const opt = t => fetchAll(t).catch(e => { console.warn(t, e); missing = true; return []; });
  const [p, a, r, f, l] = await Promise.all([fetchAll('profiles'), fetchAll('albums'), fetchAll('ratings'), opt('favorites'), opt('listen_later')]);
  S.favs = f.map(x => ({...x, album_id:Number(x.album_id)}));
  S.listen = l.map(x => ({...x, album_id:Number(x.album_id)}));
  if(missing && !S.missing) toast('Ulubione i „do posłuchania” nie działają – uruchom update.sql w Supabase', true);
  S.missing = missing;
  S.profiles = new Map(p.map(x => [x.id, x]));
  S.albums = new Map(a.map(x => [Number(x.id), {...x, id:Number(x.id)}]));
  S.ratings = r.map(x => ({...x, album_id:Number(x.album_id), score:Number(x.score)}));
  reindex(); S.loadedAt = Date.now();
}
function reindex(){
  S.byAlbum = new Map(); S.byUser = new Map();
  for(const r of S.ratings){ push(S.byAlbum, r.album_id, r); push(S.byUser, r.user_id, r); }
}
function stats(id){
  const rs = S.byAlbum.get(id) || [];
  if(!rs.length) return {n:0, avg:null, rs};
  return {n:rs.length, avg:rs.reduce((s, r) => s + r.score, 0) / rs.length, rs};
}
const myRating = id => (S.byAlbum.get(id) || []).find(r => r.user_id === S.user.id) || null;
const me = () => S.profiles.get(S.user.id) || {id:S.user.id, display_name:(S.user.email || '').split('@')[0], is_admin:false};
function upsertLocalRating(row){
  row = {...row, album_id:Number(row.album_id), score:Number(row.score)};
  const i = S.ratings.findIndex(r => r.album_id === row.album_id && r.user_id === row.user_id);
  if(i >= 0) S.ratings[i] = row; else S.ratings.push(row);
  reindex();
}
function removeLocalRating(albumId, userId){
  S.ratings = S.ratings.filter(r => !(r.album_id === albumId && r.user_id === userId)); reindex();
}
function rankList({year = null, min = S.f.min, type = S.f.type, kind = S.f.kind} = {}){
  const out = [];
  for(const a of S.albums.values()){
    if(year != null && a.year !== year) continue;
    if(!kindOk(a, kind)) continue;
    if(kind === 'albums' && type !== 'all' && typeGroup(a.type) !== type) continue;
    const st = stats(a.id);
    if(st.n === 0 || st.n < min) continue;
    out.push({a, st});
  }
  return out.sort((x, y) => y.st.avg - x.st.avg || y.st.n - x.st.n || x.a.title.localeCompare(y.a.title, 'pl'));
}

/* ---------- MusicBrainz / Cover Art Archive ---------- */
function mbType(rg){
  const sec = (rg['secondary-types'] || []).map(s => s.toLowerCase());
  if(sec.includes('compilation')) return 'Kompilacja';
  if(sec.includes('live')) return 'Live';
  if(sec.includes('mixtape/street')) return 'Mixtape';
  const p = (rg['primary-type'] || '').toLowerCase();
  return p === 'ep' ? 'EP' : p === 'single' ? 'Singiel' : 'LP';
}
const mbArtist = rg => (rg['artist-credit'] || []).map(c => (c.name || (c.artist && c.artist.name) || '') + (c.joinphrase || '')).join('');
const mbCover = (id, size = 500) => `https://coverartarchive.org/release-group/${id}/front-${size}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
let mbNext = 0; // MusicBrainz pozwala na ok. 1 zapytanie na sekundę
async function mbSearch(query){
  const url = 'https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=12&query=' + encodeURIComponent(query);
  for(let attempt = 0; attempt < 5; attempt++){
    const wait = mbNext - Date.now(); mbNext = Math.max(Date.now(), mbNext) + 1100;
    if(wait > 0) await sleep(wait);
    let r;
    try { r = await fetch(url, {headers:{Accept:'application/json'}}); }
    catch(e){ await sleep(1500 * (attempt + 1)); continue; }
    if(r.status === 503 || r.status === 429 || r.status >= 500){ mbNext = Date.now() + 2000 * (attempt + 1); continue; }
    if(!r.ok) throw new Error('MusicBrainz nie odpowiada (' + r.status + '). Spróbuj za chwilę.');
    const j = await r.json();
    return (j['release-groups'] || []).map(rg => ({
      id:rg.id, title:rg.title, artist:mbArtist(rg), score:rg.score || 0,
      year:parseInt((rg['first-release-date'] || '').slice(0, 4)) || null, type:mbType(rg)
    }));
  }
  throw new Error('MusicBrainz jest przeciążony. Spróbuj za chwilę.');
}
const luc = s => String(s).replace(/([+\-!(){}\[\]^"~*?:\\\/]|&&|\|\|)/g, '\\$1');
function testImage(url, ms = 15000){
  return new Promise(res => { const i = new Image(); const t = setTimeout(() => { i.src = ''; res(false); }, ms);
    i.onload = () => { clearTimeout(t); res(i.naturalWidth > 10); }; i.onerror = () => { clearTimeout(t); res(false); };
    i.referrerPolicy = 'no-referrer'; i.src = url; });
}
const simp = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '');
const similar = (a, b) => { a = simp(a); b = simp(b); return !!a && !!b && (a === b || a.includes(b) || b.includes(a)); };
// JSONP – Deezer i Apple nie pozwalają na zwykłe zapytania z innej strony, ale obsługują ten sposób
let jsonpN = 0;
function jsonp(url, ms = 12000){
  return new Promise((res, rej) => {
    const cb = '__jp' + (++jsonpN) + '_' + Date.now(), sc = document.createElement('script');
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); rej(new Error('timeout')); }, ms);
    window[cb] = d => { done(); res(d); };
    sc.onerror = () => { done(); rej(new Error('błąd sieci')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(sc);
  });
}
const dzType = t => t === 'ep' ? 'EP' : t === 'single' ? 'Singiel' : t === 'compile' ? 'Kompilacja' : 'LP';
async function deezerSearch(q){
  const d = await jsonp('https://api.deezer.com/search/album?limit=12&output=jsonp&q=' + encodeURIComponent(q));
  return ((d && d.data) || []).filter(a => a.cover_xl || a.cover_big).map(a => ({
    src:'Deezer', title:a.title, artist:(a.artist && a.artist.name) || '', type:dzType(a.record_type), year:null,
    cover:a.cover_xl || a.cover_big, thumb:a.cover_medium || a.cover_xl }));
}
let itNext = 0; // Apple: ok. 20 zapytań na minutę
async function itunesSearch(q){
  const wait = itNext - Date.now(); itNext = Math.max(Date.now(), itNext) + 3200; if(wait > 0) await sleep(wait);
  const d = await jsonp('https://itunes.apple.com/search?media=music&entity=album&country=PL&limit=12&term=' + encodeURIComponent(q));
  return ((d && d.results) || []).filter(a => a.artworkUrl100).map(a => ({
    src:'Apple Music', title:String(a.collectionName || '').replace(/ - (EP|Single)$/i, ''), artist:a.artistName || '',
    type:/ - EP$/i.test(a.collectionName || '') ? 'EP' : / - Single$/i.test(a.collectionName || '') ? 'Singiel' : 'LP',
    year:parseInt(String(a.releaseDate || '').slice(0, 4)) || null,
    cover:a.artworkUrl100.replace(/\/\d+x\d+bb\./, '/600x600bb.'), thumb:a.artworkUrl100 }));
}
const cleanT = t => String(t || '').replace(/\s*[\(\[][^\)\]]*(deluxe|edition|remaster|version|expanded|bonus)[^\)\]]*[\)\]]/ig, '').replace(/ - (EP|Single)$/i, '');
const matches = (r, artist, title) => similar(cleanT(r.title), cleanT(title)) && similar(r.artist, artist);
// wynik: {status:'found', cover, ...} | {status:'none'} | {status:'retry'} (coś nie odpowiedziało – spróbuj ponownie)
async function mbFindCover(artist, title){
  let flaky = false;
  // 1. Deezer
  try {
    let r = (await deezerSearch(`artist:"${artist}" album:"${cleanT(title)}"`)).find(x => matches(x, artist, title));
    if(!r) r = (await deezerSearch(artist + ' ' + cleanT(title))).find(x => matches(x, artist, title));
    if(r) return {...r, status:'found'};
  } catch(e){ flaky = true; }
  // 2. MusicBrainz / Cover Art Archive
  let mbYear = null, mbId = null;
  try {
    let cands = (await mbSearch(`releasegroup:"${luc(title)}" AND artist:"${luc(artist)}"`)).filter(r => r.score >= 80);
    if(!cands.length) cands = (await mbSearch(luc(title) + ' ' + luc(artist))).filter(r => matches(r, artist, title));
    if(cands.length){ mbYear = cands[0].year; mbId = cands[0].id; }
    for(const r of cands.slice(0, 3)){
      for(let t = 0; t < 2; t++){
        if(await testImage(mbCover(r.id, 250))) return {...r, status:'found', cover:mbCover(r.id)};
        flaky = true;
      }
    }
  } catch(e){ flaky = true; }
  // 3. Apple Music
  try {
    const r = (await itunesSearch(artist + ' ' + cleanT(title))).find(x => matches(x, artist, title));
    if(r) return {...r, status:'found', year:r.year || mbYear, id:mbId};
  } catch(e){ flaky = true; }
  return {status:flaky ? 'retry' : 'none', year:mbYear, id:mbId};
}

/* ---------- covers upload ---------- */
function resizeImage(file, max = 700){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Nie udało się przetworzyć obrazka')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('To nie jest obrazek')); };
    img.src = url;
  });
}
function cropSquare(file, size = 320){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('Nie udało się przetworzyć zdjęcia')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('To nie jest obrazek')); };
    img.src = url;
  });
}
async function uploadCover(file){
  const blob = await resizeImage(file);
  const path = `${S.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { error } = await sb.storage.from('covers').upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(error) throw error;
  return sb.storage.from('covers').getPublicUrl(path).data.publicUrl;
}

function viewYears(arg){
  const years = new Map();
  for(const a of S.albums.values()) if(a.year && kindOk(a, S.f.kind)) years.set(a.year, (years.get(a.year) || 0) + 1);
  const ys = [...years.keys()].sort((a, b) => b - a);
  const y = arg ? parseInt(arg) : null;
  if(!y){
    const cards = ys.map(yr => {
      const l = rankList({year:yr}); const t = l[0];
      return `<a class="ycard" href="#/lata/${yr}">${t ? coverHtml(t.a) : '<span class="cover c64 noimg"><i>?</i></span>'}
        <div class="yt"><div class="yy">${yr}</div>

        <div class="muted small">${l.length} ${pl(l.length,'oceniony','ocenione','ocenionych')} / ${years.get(yr)}</div></div>
        ${t ? badge(t.st.avg, 'sm') : ''}</a>`;
    }).join('');

    ${filtersHtml()}${listHtml(list)}`;
  bindFilters();
}

          <div class="ranks">${pos >= 0 ? `<a href="#/ranking" id="rkLink">#${pos + 1} w rankingu ${kind === 'singles' ? 'singli' : 'ogólnym'}</a>` : ''}${ypos >= 0 ? `<a href="#/lata/${a.year}" id="rkYLink">#${ypos + 1} w roku ${a.year}</a>` : ''}</div>

    <div class="card"><h2>Oceny (${st.n})</h2>
      <div class="rlist">${rs.length ? rs.map(r => `<div class="ri"><a href="#/osoba/${r.user_id}">${avatar(r.user_id)}</a>
        <div><a class="nm" href="#/osoba/${r.user_id}">${esc(pname(r.user_id))}</a>
          ${r.comment ? `<div class="cm">${esc(r.comment)}</div>` : ''}
          <div class="bar"><div style="width:${r.score}%;background:${col(r.score)}"></div></div>
          <div class="dt">${fmtDate(r.updated_at || r.created_at)}</div></div>
        ${badge(r.score)}</div>`).join('') : '<div class="empty">Nikt jeszcze nie ocenił tego albumu.</div>'}</div>
      ${notRated.length ? `<p class="muted small" style="margin:12px 0 0">Jeszcze nie ocenili: ${notRated.map(esc).join(', ')}</p>` : ''}
    </div>
    <div class="card"><h2>${mine ? 'Twoja ocena' : 'Oceń album'}</h2>
      <form class="form" id="rf">
        <label>Ocena (0–100, może być z przecinkiem)<input class="scorein" id="rs" inputmode="decimal" value="${mine ? num(mine.score) : ''}" placeholder="np. 84"></label>
        <label>Komentarz (opcjonalnie)<textarea id="rc" maxlength="2000" placeholder="Ulubiony utwór, krótka opinia…">${esc(mine ? mine.comment || '' : '')}</textarea></label>
        <div class="btns"><button class="btn-p" id="rsave">${mine ? 'Zapisz zmiany' : 'Zapisz ocenę'}</button>${mine ? '<button type="button" class="btn-d" id="rdel">Usuń moją ocenę</button>' : ''}</div>
        <div class="err" id="rerr"></div>

    const b = document.getElementById('rsave'); b.disabled = true;

    if(error) return toast(errMsg(error), true);
    S.albums.delete(id); S.ratings = S.ratings.filter(r => r.album_id !== id); reindex();

function viewAlbums(){
  const f = S.af;
  const cnt = [...S.albums.values()].filter(a => kindOk(a, f.kind)).length;
  app.innerHTML = `<h1>${f.kind === 'singles' ? 'Single' : 'Wszystkie albumy'}</h1><p class="sub">${cnt} ${f.kind === 'singles' ? pl(cnt,'singiel','single','singli') : pl(cnt,'album','albumy','albumów')} w bazie</p>
    <div class="filters">
      ${segHtml('akind', f.kind)}
      <label>Szukaj<input type="search" id="aq" value="${esc(f.q)}" placeholder="wykonawca lub tytuł"></label>
      <label>Pokaż<select id="af">${[['all','Wszystkie'],['unrated-me','Nieocenione przeze mnie'],['unrated','Bez żadnej oceny'],['nocover','Bez okładki']].map(([v, l]) => `<option value="${v}" ${f.f === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label>Sortuj<select id="as">${[['added','Ostatnio dodane'],['artist','Wykonawca A–Z'],['year','Rok (najnowsze)'],['avg','Średnia']].map(([v, l]) => `<option value="${v}" ${f.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    </div><div id="agrid"></div>`;
  const draw = () => {
    const q = norm(f.q);
    let l = [...S.albums.values()].filter(a => {
      if(!kindOk(a, f.kind)) return false;
      if(q && !(norm(a.artist).includes(q) || norm(a.title).includes(q))) return false;
      if(f.f === 'unrated-me') return !myRating(a.id);
      if(f.f === 'unrated') return !stats(a.id).n;
      if(f.f === 'nocover') return !safeUrl(a.cover_url);
      return true;
    });
    const cmp = {
      added:(x, y) => (y.created_at || '').localeCompare(x.created_at || '') || y.id - x.id,
      artist:(x, y) => x.artist.localeCompare(y.artist, 'pl') || (x.year || 0) - (y.year || 0),
      year:(x, y) => (y.year || 0) - (x.year || 0) || x.artist.localeCompare(y.artist, 'pl'),
      avg:(x, y) => (stats(y.id).avg ?? -1) - (stats(x.id).avg ?? -1),
    }[f.sort];
    l.sort(cmp);
    const shown = l.slice(0, f.limit);
    document.getElementById('agrid').innerHTML = l.length ? `<div class="grid">${shown.map(a => { const st = stats(a.id), m = myRating(a.id);
      return `<a class="tile" href="#/album/${a.id}"><div class="cw">${coverHtml(a, 'cfull')}${st.n ? badge(st.avg, 'sm') : ''}</div>
        <div><div class="t">${esc(a.title)}</div><div class="a">${esc(a.artist)}${a.year ? ' · ' + a.year : ''}</div>
        <div class="a">${st.n ? ocen(st.n) : 'brak ocen'}${m ? ' · Ty: ' + num(m.score) : ''}</div></div></a>`; }).join('')}</div>
      ${l.length > shown.length ? `<div style="text-align:center;margin-top:18px"><button id="more">Pokaż więcej (${l.length - shown.length})</button></div>` : ''}`
      : `<div class="list"><div class="empty">Nic nie znaleziono. <a class="link" href="#/dodaj">Dodaj album</a></div></div>`;
    const m = document.getElementById('more'); if(m) m.onclick = () => { f.limit += 240; draw(); };
  };
  bindSeg('akind', v => { f.kind = v; f.limit = 120; render(); });
  document.getElementById('aq').oninput = e => { f.q = e.target.value; f.limit = 120; draw(); };
  document.getElementById('af').onchange = e => { f.f = e.target.value; f.limit = 120; draw(); };
  document.getElementById('as').onchange = e => { f.sort = e.target.value; draw(); };
  draw();
}

    <div class="mbres" id="mbres"></div>
  </div>
  <div class="card"><h2>${isNew ? '2. Sprawdź dane i zapisz' : 'Dane albumu'}</h2>

        <label>Rok<input id="fy" inputmode="numeric" value="${a.year ?? ''}" placeholder="np. 2024"></label>

      </div>
      <label>Okładka – link do obrazka (https://…)<input id="fc" value="${esc(a.cover_url || '')}" placeholder="wklej link albo wgraj plik poniżej"></label>
      <div class="preview"><span id="fcp">${coverHtml(a, 'c64')}</span>
        <label style="flex:1">albo wgraj plik z komputera / telefonu<input type="file" id="ff" accept="image/*"></label></div>
      ${isNew ? `<label>Twoja ocena (opcjonalnie, 0–100)<input id="fs" inputmode="decimal" placeholder="np. 84"></label>` : ''}
      <input type="hidden" id="fmb" value="${esc(a.mbid || '')}">
      <div class="btns"><button class="btn-p" id="fsave">${isNew ? 'Dodaj album' : 'Zapisz zmiany'}</button>${isNew ? '' : `<a href="#/album/${a.id}"><button type="button">Anuluj</button></a>`}</div>
      <div class="err" id="ferr"></div>

function bindAlbumForm(a, isNew){
  const $ = id => document.getElementById(id);
  const setPreview = () => { $('fcp').innerHTML = coverHtml({title:$('ft').value || '?', cover_url:$('fc').value.trim()}, 'c64'); };
  $('fc').oninput = setPreview; $('ft').oninput = setPreview;
  $('ff').onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    $('ferr').textContent = ''; $('fcp').innerHTML = '<span class="muted small">Wgrywanie…</span>';
    try { $('fc').value = await uploadCover(file); setPreview(); toast('Okładka wgrana'); }
    catch(err){ $('ferr').textContent = 'Nie udało się wgrać okładki: ' + errMsg(err); setPreview(); }
    e.target.value = '';
  };
  $('mbf').onsubmit = async e => {
    e.preventDefault(); const q = $('mbq').value.trim(); if(!q) return;
    $('mbst').textContent = 'Szukam…'; $('mbres').innerHTML = '';
    try {
      const [mb, dz, it] = await Promise.all([
        mbSearch(q).then(r => r.map(x => ({...x, src:'MusicBrainz', cover:null, thumb:mbCover(x.id, 250)}))).catch(() => []),
        deezerSearch(q).catch(() => []), itunesSearch(q).catch(() => [])]);
      // przeplataj źródła, żeby na górze były najlepsze wyniki z każdego
      const res = []; for(let i = 0; i < 12; i++) for(const l of [dz, mb, it]) if(l[i]) res.push(l[i]);
      $('mbst').textContent = res.length ? 'Kliknij właściwy album:' : 'Nic nie znaleziono – wpisz dane ręcznie.';
      $('mbres').innerHTML = res.map((r, i) => `<button type="button" class="mbitem" data-i="${i}">
        ${coverHtml({title:r.title, cover_url:r.thumb}, 'c48')}
        <span><b>${esc(r.title)}</b><br><span>${esc(r.artist)}</span><br><small>${r.year ?? ''}${r.year ? ' · ' : ''}${esc(r.type)} · ${esc(r.src)}</small></span></button>`).join('');
      $('mbres').querySelectorAll('.mbitem').forEach(b => b.onclick = async () => {
        const r = res[+b.dataset.i];
        $('fa').value = r.artist; $('ft').value = r.title; if(r.year) $('fy').value = r.year; $('fty').value = r.type;
        if(r.src === 'MusicBrainz') $('fmb').value = r.id;
        $('fc').value = ''; $('fcp').innerHTML = '<span class="muted small">Szukam okładki…</span>';
        const u = r.cover || mbCover(r.id);
        if(await testImage(u)){ $('fc').value = u; } else toast('Brak okładki w tym źródle – wybierz inny wynik, wgraj plik lub wklej link', true);
        setPreview();
        const dup = isNew && findAlbum(r.artist, r.title);
        $('ferr').innerHTML = dup ? `Ten album już jest: <a class="link" href="#/album/${dup.id}">przejdź do niego</a>` : '';
      });
    } catch(err){ $('mbst').textContent = err.message; }
  };
  $('af2').onsubmit = async e => {
    e.preventDefault();
    const artist = $('fa').value.trim(), title = $('ft').value.trim();
    const yr = $('fy').value.trim(), year = yr ? parseInt(yr) : null;
    const cover = $('fc').value.trim();
    if(!artist || !title) return $('ferr').textContent = 'Podaj wykonawcę i tytuł.';
    if(yr && !(year >= 1900 && year <= 2100)) return $('ferr').textContent = 'Rok musi być między 1900 a 2100.';
    if(cover && !safeUrl(cover)) return $('ferr').textContent = 'Link do okładki musi zaczynać się od https://';
    let score = null;
    if(isNew && $('fs').value.trim()){ score = parseScore($('fs').value); if(score == null) return $('ferr').textContent = 'Ocena musi być liczbą od 0 do 100.'; }
    const dup = findAlbum(artist, title);
    if(dup && (isNew || dup.id !== a.id)) return $('ferr').innerHTML = `Taki album już jest: <a class="link" href="#/album/${dup.id}">przejdź do niego</a>`;
    const row = {artist, title, year, type:$('fty').value, cover_url:cover || null, mbid:$('fmb').value || null};
    $('fsave').disabled = true;
    const q = isNew ? sb.from('albums').insert(row) : sb.from('albums').update(row).eq('id', a.id);
    const { data, error } = await q.select().single();
    if(error){ $('fsave').disabled = false; return $('ferr').textContent = errMsg(error); }
    const saved = {...data, id:Number(data.id)}; S.albums.set(saved.id, saved);
    if(score != null){
      const r = await sb.from('ratings').upsert({album_id:saved.id, user_id:S.user.id, score}, {onConflict:'album_id,user_id'}).select().single();
      if(r.error) toast('Album dodany, ale ocena nie: ' + errMsg(r.error), true); else upsertLocalRating(r.data);
    }
    toast(isNew ? 'Dodano album' : 'Zapisano zmiany');
    location.hash = '#/album/' + saved.id;
  };
}

function viewPerson(id){
  const p = S.profiles.get(id);
  if(!p){ app.innerHTML = '<div class="card">Nie ma takiej osoby.</div>'; return; }
  if(!S.pv || S.pv.id !== id) S.pv = {id, year:new Date().getFullYear(), all:false};
  const V = S.pv, name = p.display_name || p.username;
  const allR = (S.byUser.get(id) || []).filter(r => S.albums.has(r.album_id));
  const avg = allR.length ? allR.reduce((s, r) => s + r.score, 0) / allR.length : null;
  // jak bardzo ta osoba odbiega od średniej grupy

function randomPool(){
  const R = S.rand, uid = S.user.id, from = R.from ? +R.from : null, to = R.to ? +R.to : null;
  return [...S.albums.values()].filter(a => {
    if(!kindOk(a, R.kind)) return false;
    if(from != null && !(a.year && a.year >= from)) return false;
    if(to != null && !(a.year && a.year <= to)) return false;
    if(R.src === 'unrated') return !myRating(a.id);
    if(R.src === 'listen') return inListen(a.id);
    if(R.src === 'rec'){
      if(myRating(a.id)) return false;
      const o = (S.byAlbum.get(a.id) || []).filter(r => r.user_id !== uid);
      return o.length > 0 && o.reduce((s, r) => s + r.score, 0) / o.length >= R.min;
    }
    return true;
  });
}

/* ----- import ----- */
const TYPE_MAP = {lp:'LP', album:'LP', soundtrack:'Inne', other:'Inne', inne:'Inne', ep:'EP', mixtape:'Mixtape', compilation:'Kompilacja', kompilacja:'Kompilacja', live:'Live', single:'Singiel', singiel:'Singiel', reissue:'LP'};
function parseImport(text){
  const lines = text.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim());
  if(!lines.length) return [];
  // wykryj separator (tabulator, średnik, przecinek) poza cudzysłowami
  const count = (l, d) => { let n = 0, q = false; for(const ch of l){ if(ch === '"') q = !q; else if(!q && ch === d) n++; } return n; };
  const first = lines[0];
  const delim = count(first, '\t') ? '\t' : count(first, ';') >= count(first, ',') && count(first, ';') ? ';' : count(first, ',') ? ',' : ';';
  const split = l => { const out = []; let cur = '', q = false;
    for(let i = 0; i < l.length; i++){ const ch = l[i];
      if(q){ if(ch === '"'){ if(l[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
      else if(ch === '"') q = true; else if(ch === delim){ out.push(cur.trim()); cur = ''; } else cur += ch; }
    out.push(cur.trim()); return out; };
  let idx = null;
  const head = split(lines[0]).map(norm);
  const find = names => head.findIndex(h => names.includes(h));
  if(find(['artist','wykonawca','artysta']) >= 0 && find(['album','tytuł','tytul','title']) >= 0){
    idx = {artist:find(['artist','wykonawca','artysta']), title:find(['album','tytuł','tytul','title']), year:find(['year','rok']),
           type:find(['type','typ']), score:find(['rating','ocena','score'])};
    lines.shift();
  }
  return lines.map((l, n) => {
    const c = split(l);
    let artist, title, year = null, type = 'LP', score = null;
    if(idx){
      artist = c[idx.artist]; title = c[idx.title];
      if(idx.year >= 0) year = parseInt(c[idx.year]) || null;
      if(idx.type >= 0 && c[idx.type]) type = TYPE_MAP[norm(c[idx.type])] || 'Inne';
      if(idx.score >= 0) score = parseScore(c[idx.score]);
    } else {
      artist = c[0]; title = c[1];
      for(let i = 2; i < c.length; i++){
        const v = c[i];
        if(year == null && /^(19|20)\d\d$/.test(v)){ year = +v; continue; }
        if(TYPE_MAP[norm(v)]){ type = TYPE_MAP[norm(v)]; continue; }
        if(score == null && /^\d{1,3}([.,]\d)?$/.test(v) && parseScore(v) != null){ score = parseScore(v); }
      }
    }
    const ok = artist && title && score != null;
    const ex = ok ? findAlbum(artist, title) : null;
    return {n:n + 1, artist, title, year, type, score, ok, ex};
  });
}

    <button id="exp">Pobierz CSV</button>
  </div>`;
  document.getElementById('exp').onclick = () => {
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const lines = [['Wykonawca','Album','Rok','Typ','Osoba','Ocena','Komentarz','Średnia grupy'].map(q).join(';')];
    for(const a of [...S.albums.values()].sort((x, y) => x.artist.localeCompare(y.artist, 'pl'))){
      const st = stats(a.id);
      if(!st.n) lines.push([a.artist, a.title, a.year, a.type, '', '', '', ''].map(q).join(';'));
      for(const r of st.rs) lines.push([a.artist, a.title, a.year, a.type, pname(r.user_id), num(r.score), r.comment, num(st.avg)].map(q).join(';'));
    }
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
    link.download = 'oceny-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(link); link.click();
    setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 1000);
  };
  let parsed = [];
  document.getElementById('ifile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    document.getElementById('it').value = await f.text(); e.target.value = '';
    document.getElementById('ip').click();
  };
  document.getElementById('ip').onclick = () => {
    parsed = parseImport(document.getElementById('it').value);
    const ok = parsed.filter(r => r.ok), nw = ok.filter(r => !r.ex);
    const dupKeys = new Set(), uniqNew = nw.filter(r => { const k = keyOf(r.artist, r.title); if(dupKeys.has(k)) return false; dupKeys.add(k); return true; });
    document.getElementById('iprev').innerHTML = parsed.length ? `
      <p><b>${ok.length}</b> ${pl(ok.length,'ocena','oceny','ocen')} do zapisania · <b>${uniqNew.length}</b> ${pl(uniqNew.length,'nowy album','nowe albumy','nowych albumów')}${parsed.length - ok.length ? ` · <span class="st-bad">${parsed.length - ok.length} ${pl(parsed.length - ok.length,'wiersz','wiersze','wierszy')} z błędem (pominięte)</span>` : ''}</p>
      <div style="max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><thead><tr><th>#</th><th>Wykonawca</th><th>Tytuł</th><th>Rok</th><th>Typ</th><th class="n">Ocena</th><th>Status</th></tr></thead><tbody>
      ${parsed.map(r => `<tr><td class="muted">${r.n}</td><td>${esc(r.artist || '')}</td><td>${esc(r.title || '')}</td><td>${r.year ?? ''}</td><td>${esc(r.type)}</td><td class="n">${r.score != null ? num(r.score) : ''}</td>
        <td>${!r.ok ? '<span class="st-bad">brak danych / oceny</span>' : r.ex ? '<span class="st-old">album jest w bazie</span>' : '<span class="st-new">nowy album</span>'}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="btns" style="margin-top:12px"><button class="btn-p" id="igo" ${ok.length ? '' : 'disabled'}>Importuj ${ok.length} ${pl(ok.length,'ocenę','oceny','ocen')}</button><span class="small" id="ist"></span></div>` : '<p class="err">Nic nie rozpoznano.</p>';
    const go = document.getElementById('igo');
    if(go) go.onclick = () => runImport(ok, go);
  };
  let stop = false;
  document.getElementById('cv').onclick = async () => {
    const b = document.getElementById('cv'), sbtn = document.getElementById('cvs'), st = document.getElementById('cvst');
    b.disabled = true; sbtn.style.display = ''; stop = false;
    let todo = [...S.albums.values()].filter(a => !safeUrl(a.cover_url));
    const total = todo.length, notFound = [];
    let found = 0, done = 0;
    for(let pass = 1; pass <= 3 && todo.length && !stop; pass++){
      const retry = []; let i = 0;
      const worker = async () => {
        while(!stop && i < todo.length){
          const a = todo[i++];
          try {
            const r = await mbFindCover(a.artist, a.title);
            if(r.status === 'found'){
              const upd = {cover_url:r.cover}; if(!a.mbid && r.id) upd.mbid = r.id; if(!a.year && r.year) upd.year = r.year;
              const { data, error } = await sb.from('albums').update(upd).eq('id', a.id).select().single();
              if(!error){ S.albums.set(a.id, {...data, id:Number(data.id)}); found++; }
            } else if(r.status === 'retry') retry.push(a); else notFound.push(a);
          } catch(e){ console.warn(e); retry.push(a); }
          if(pass === 1) done++;
          st.textContent = (pass === 1 ? `Sprawdzono ${done}/${total}` : `Przejście ${pass}: ponawiam ${i}/${todo.length}`) + ` · znaleziono ${found}`;
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      todo = retry;
      if(todo.length && pass < 3 && !stop){ st.textContent = `Ponawiam ${todo.length} ${pl(todo.length,'album','albumy','albumów')}, których okładki nie zdążyły się wczytać…`; await sleep(3000); }
    }
    const missing = notFound.length + todo.length;
    st.innerHTML = `<b>${stop ? 'Zatrzymano' : 'Gotowe'}:</b> znaleziono ${found} ${pl(found,'okładkę','okładki','okładek')}.` +
      (missing ? ` Bez okładki: ${missing}. Te albumy uzupełnij ręcznie (Albumy → filtr „Bez okładki” → album → Edytuj → wgraj plik lub wklej link).` : '');
    b.disabled = false; sbtn.style.display = 'none';
  };
  document.getElementById('cvs').onclick = () => { stop = true; };
}
async function runImport(rows, btn){
  const st = document.getElementById('ist'), overwrite = document.getElementById('iov').checked;
  btn.disabled = true;
  try {
    st.textContent = 'Odświeżam dane…'; await loadData();
    // 1. nowe albumy
    const need = new Map();
    for(const r of rows){ const k = keyOf(r.artist, r.title); if(!findAlbum(r.artist, r.title) && !need.has(k)) need.set(k, {artist:r.artist, title:r.title, year:r.year, type:r.type}); }
    const toAdd = [...need.values()];
    for(let i = 0; i < toAdd.length; i += 100){
      st.textContent = `Dodaję albumy ${Math.min(i + 100, toAdd.length)}/${toAdd.length}…`;
      const chunk = toAdd.slice(i, i + 100);
      const { data, error } = await sb.from('albums').insert(chunk).select();
      if(!error){ data.forEach(d => S.albums.set(Number(d.id), {...d, id:Number(d.id)})); continue; }
      for(const one of chunk){ // ktoś mógł dodać w międzyczasie – po jednym
        const r = await sb.from('albums').insert(one).select().single();
        if(!r.error) S.albums.set(Number(r.data.id), {...r.data, id:Number(r.data.id)});
      }
      await loadData();
    }
    // 2. oceny
    const ratings = new Map();
    for(const r of rows){ const a = findAlbum(r.artist, r.title); if(!a) continue;
      if(!overwrite && myRating(a.id)) continue;
      ratings.set(a.id, {album_id:a.id, user_id:S.user.id, score:r.score}); }
    const list = [...ratings.values()];
    let saved = 0;
    for(let i = 0; i < list.length; i += 200){
      st.textContent = `Zapisuję oceny ${Math.min(i + 200, list.length)}/${list.length}…`;
      const { data, error } = await sb.from('ratings').upsert(list.slice(i, i + 200), {onConflict:'album_id,user_id'}).select();
      if(error) throw error;
      saved += data.length;
    }
    await loadData();
    st.innerHTML = `<span class="ok">Gotowe: ${toAdd.length} ${pl(toAdd.length,'nowy album','nowe albumy','nowych albumów')}, ${saved} ${pl(saved,'zapisana ocena','zapisane oceny','zapisanych ocen')}.</span>`;
    toast('Import zakończony');
  } catch(e){ st.innerHTML = `<span class="err">Błąd: ${esc(errMsg(e))}</span>`; btn.disabled = false; }
}

function viewAccount(){
  const p = me();
  app.innerHTML = `<h1>Twoje konto</h1><p class="sub">Zalogowano jako ${esc(S.user.email)}</p>
  <div class="card" style="margin-bottom:18px"><h2>Avatar</h2>
    <div class="btns" style="gap:18px"><span id="avp">${avatar(S.user.id, 96)}</span>
      <div class="form"><label>Wgraj zdjęcie (zostanie przycięte do kwadratu)<input type="file" id="avf" accept="image/*"></label>
      ${safeUrl(p.avatar_url) ? '<div><button class="btn-d" id="avdel">Usuń avatar</button></div>' : ''}<div id="avm"></div></div></div></div>
  <div class="cols" style="margin-top:0">
    <div class="card"><h2>Nazwa widoczna dla innych</h2>
      <form class="form" id="nf"><input id="nn" maxlength="40" required value="${esc(p.display_name || '')}">
      <div class="btns"><button class="btn-p">Zapisz</button></div><div id="nm"></div></form></div>
    <div class="card"><h2>Zmiana hasła</h2>
      <form class="form" id="pf"><label>Nowe hasło<input type="password" id="p1" minlength="6" autocomplete="new-password" required></label>
      <label>Powtórz hasło<input type="password" id="p2" minlength="6" autocomplete="new-password" required></label>
      <div class="btns"><button class="btn-p">Zmień hasło</button></div><div id="pm"></div></form></div>
  </div>`;
  document.getElementById('nf').onsubmit = async e => {
    e.preventDefault(); const v = document.getElementById('nn').value.trim(), m = document.getElementById('nm'); if(!v) return;
    const { error } = await sb.from('profiles').update({display_name:v}).eq('id', S.user.id);
    if(error){ m.className = 'err'; m.textContent = errMsg(error); return; }
    const pr = S.profiles.get(S.user.id); if(pr) pr.display_name = v;
    m.className = 'ok'; m.textContent = 'Zapisano.'; renderNav(null);
  };
  const setAvatar = async url => {
    const m = document.getElementById('avm');
    const { error } = await sb.from('profiles').update({avatar_url:url}).eq('id', S.user.id);
    if(error){ m.className = 'err'; m.textContent = /avatar_url/.test(error.message || '') ? 'Najpierw uruchom update.sql w Supabase.' : errMsg(error); return; }
    const pr = S.profiles.get(S.user.id); if(pr) pr.avatar_url = url;
    toast(url ? 'Avatar zapisany' : 'Avatar usunięty'); render();
  };
  document.getElementById('avf').onchange = async e => {
    const file = e.target.files[0]; if(!file) return; const m = document.getElementById('avm');
    m.className = 'muted small'; m.textContent = 'Wgrywanie…';
    try {
      const blob = await cropSquare(file, 320);
      const path = `avatars/${S.user.id}/${Date.now()}.jpg`;
      const { error } = await sb.storage.from('covers').upload(path, blob, {contentType:'image/jpeg', upsert:false});
      if(error) throw error;
      await setAvatar(sb.storage.from('covers').getPublicUrl(path).data.publicUrl);
    } catch(err){ m.className = 'err'; m.textContent = 'Nie udało się wgrać: ' + errMsg(err); }
  };
  const ad = document.getElementById('avdel'); if(ad) ad.onclick = () => setAvatar(null);
  document.getElementById('pf').onsubmit = async e => {
    e.preventDefault(); const a = document.getElementById('p1').value, b = document.getElementById('p2').value, m = document.getElementById('pm');
    if(a !== b){ m.className = 'err'; m.textContent = 'Hasła się różnią.'; return; }
    const { error } = await sb.auth.updateUser({password:a});
    if(error){ m.className = 'err'; m.textContent = errMsg(error); return; }
    m.className = 'ok'; m.textContent = 'Hasło zmienione.'; e.target.reset();
  };
}

/* ---------- start ---------- */
async function init(){
  if(!window.supabase || CONFIG.SUPABASE_URL.includes('TWOJ-PROJEKT')){
    app.innerHTML = `<div class="card login"><h1>Prawie gotowe</h1><p>Brakuje pliku <code>config.js</code> obok <code>index.html</code> albo nie ma w nim adresu i klucza Supabase.</p></div>`;
    return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ S.user = session.user; app.innerHTML = '<div class="loading">Ładowanie ocen…</div>'; await safeLoad(); }
  render();
  sb.auth.onAuthStateChange((ev, session) => { if(ev === 'SIGNED_OUT' && S.user){ S.user = null; render(); } });
  window.addEventListener('hashchange', render);
  // po powrocie do karty odśwież dane (tylko na stronach bez formularzy)
  document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState !== 'visible' || !S.user || Date.now() - S.loadedAt < 120000) return;
    const p = route().page; await safeLoad();
    if(['start','ranking','lata','osoby','osoba'].includes(p) && route().page === p) render();
  });
}
init();
