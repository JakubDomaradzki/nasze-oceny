<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nasze oceny</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#eceef2" id="tc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oceny">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('oceny_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
function syncThemeColor(){var d=document.documentElement.dataset.theme,dark=d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches,m=document.getElementById('tc');if(m)m.content=dark?'#0f1114':'#eceef2';}
syncThemeColor();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncThemeColor);}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --bg:#eceef2;--card:#ffffff;--text:#16181d;--muted:#666c78;--line:#dde0e6;--soft:#f4f5f8;--raise:#ffffff;
  --accent:#1f8a3b;--accent-ink:#ffffff;--accent-soft:rgba(31,138,59,.1);
  --g:#3fa64d;--y:#dcae1d;--r:#df5235;--none:#b3b7c0;--focus:#1f8a3b;
  --shadow:0 1px 0 rgba(22,24,29,.04),0 6px 20px -8px rgba(22,24,29,.12);
  --navbg:rgba(255,255,255,.78);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0f1114;--card:#181b20;--text:#e9ebef;--muted:#9097a3;--line:#2a2f37;--soft:#1f2329;--raise:#22262d;
  --accent:#3fbf60;--accent-ink:#0b1a0f;--accent-soft:rgba(63,191,96,.14);--none:#4a4f58;--focus:#3fbf60;
  --shadow:0 1px 0 rgba(0,0,0,.3);--navbg:rgba(15,17,20,.78);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --bg:#0f1114;--card:#181b20;--text:#e9ebef;--muted:#9097a3;--line:#2a2f37;--soft:#1f2329;--raise:#22262d;
  --accent:#3fbf60;--accent-ink:#0b1a0f;--accent-soft:rgba(63,191,96,.14);--none:#4a4f58;--focus:#3fbf60;
  --shadow:0 1px 0 rgba(0,0,0,.3);--navbg:rgba(15,17,20,.78);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);font-optical-sizing:auto;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--line),var(--text) 18%)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--raise);padding:8px 14px;white-space:nowrap;font-weight:600;transition:background-color .15s,border-color .15s,transform .1s,color .15s}
button:hover:not(:disabled){border-color:color-mix(in srgb,var(--line),var(--text) 25%)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn-p:hover:not(:disabled){border-color:var(--accent);filter:brightness(1.06)}
.btn-d{color:var(--r);border-color:color-mix(in srgb,var(--r),transparent 50%);background:transparent}
.btn-d.armed{background:var(--r);border-color:var(--r);color:#fff}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:600}

/* nav */
.nav{position:sticky;top:0;z-index:10;background:var(--navbg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:58px}
.brand{font-weight:800;letter-spacing:-.3px;font-size:19px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand img{width:26px;height:26px;border-radius:7px}
.brand b{color:var(--accent)}
.links{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{padding:7px 10px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;transition:color .15s,background-color .15s}
.links a.on{color:var(--text);background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.links a:hover{color:var(--text)}
.me{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.me a{font-weight:600}
.me button{padding:6px 10px;font-size:13px}
.me .ico{width:34px;height:32px;padding:0;text-align:center;font-size:15px;line-height:1}
.ico-l{display:inline-flex;align-items:center;justify-content:center;width:34px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--muted);transition:color .15s,border-color .15s}
.bell{position:relative}
.bell .nb{position:absolute;top:-6px;right:-7px;margin:0;box-shadow:0 0 0 2px var(--card)}
.ico-b{width:36px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ico-b:hover{color:var(--text)}
.ico-l:hover,.ico-l.on{color:var(--text);border-color:color-mix(in srgb,var(--line),var(--text) 25%)}
/* iPhone powiększa stronę przy polach z czcionką < 16 px - na dotykowych ekranach zawsze min. 16 px */
@media (hover:none) and (pointer:coarse){input,select,textarea{font-size:max(16px,1em)}}

/* dolny pasek zakładek na telefonie */
.tabbar,.sheet-bg{display:none}
@media (max-width:720px){
  .nav-in{height:54px;padding:0 14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .nav .links,.nav .me .hide-m{display:none}
  .me{margin-left:auto}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);
    -webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 3px;border:none;background:none;border-radius:10px;
    color:var(--muted);font-size:11px;font-weight:600;position:relative;-webkit-tap-highlight-color:transparent}
  .tabbar svg{width:24px;height:24px}
  .tabbar .on{color:var(--accent)}
  .tabbar .nb{position:absolute;top:0;left:calc(50% + 6px);margin:0}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom))!important}
  .sheet-bg{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .sheet-bg.open .sheet{transform:none}
  .sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .sheet-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .sheet-g a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;background:var(--soft);font-size:13px;font-weight:600}
  .sheet-g a.on{background:var(--accent-soft);color:var(--accent)}
  .sheet-g svg{width:24px;height:24px}
  .sheet-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px;font-weight:600}
}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{transition:none}}

main{max-width:1100px;margin:0 auto;padding:26px 16px 64px}
h1{font-size:32px;line-height:1.1;margin:0 0 6px;letter-spacing:-.8px;font-weight:800}
h2{font-size:17px;letter-spacing:-.2px;color:var(--text);margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.err{color:var(--r);font-size:14px;margin-top:8px}
.ok{color:var(--accent);font-size:14px;margin-top:8px}

/* score badge */
.score{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 7px;border-radius:8px;color:#fff;font-weight:800;letter-spacing:-.3px;text-shadow:0 1px 1px rgba(0,0,0,.12);font-variant-numeric:tabular-nums;font-size:15px}
.score.big{min-width:54px;height:38px;font-size:19px;border-radius:9px}
.score.sm{min-width:34px;height:24px;font-size:13px;border-radius:6px}

/* cover */
.cover{position:relative;display:inline-block;flex:none;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#8f96a3 0%,#4d535e 100%);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 0 0 1px rgba(0,0,0,.06)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover i{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:800;opacity:.85}
.cover.noimg i{display:flex}
.c48{width:48px;height:48px}.c48 i{font-size:18px}
.c64{width:64px;height:64px}.c64 i{font-size:24px}
.cfull{width:100%;aspect-ratio:1;border-radius:8px}.cfull i{font-size:42px}
.c260{width:260px;height:260px;border-radius:10px}.c260 i{font-size:80px}
@media (max-width:640px){.c260{width:100%;height:auto;aspect-ratio:1}}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:0 0 14px}
.filters label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:600}
.filters select,.filters input{width:auto;min-width:130px;padding:6px 9px}
.filters input[type=search]{min-width:220px}
.filters input[type=checkbox]{min-width:0;width:16px;height:16px}
.bulkbar{position:sticky;bottom:0;background:var(--card);padding:12px 0 4px;margin-top:6px;border-top:1px solid var(--line)}

/* ranking rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:40px 64px 1fr auto 74px;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--soft)}
.rk{font-weight:800;font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.row.top1 .rk{color:#d4a20b}.row.top2 .rk{color:#9097a3}.row.top3 .rk{color:#b87333}
.meta{min-width:0;display:flex;flex-direction:column}
.meta b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--text);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--muted);font-size:12.5px}
.sc{display:flex;flex-direction:column;align-items:center;gap:2px}
.sc small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mine{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.mine b{color:var(--text)}
@media (max-width:640px){.row{grid-template-columns:28px 48px 1fr auto;gap:10px;padding:9px 10px}.row .mine{display:none}.row .cover{width:48px;height:48px}.rk{font-size:15px}}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .t{font-weight:700;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .a{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cw{position:relative}
.tile .cw .score{position:absolute;right:6px;bottom:6px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tile:hover .t{text-decoration:underline}

/* years */
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ycard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;transition:border-color .15s;padding:12px;box-shadow:var(--shadow)}
.ycard:hover{border-color:var(--accent)}
.ycard .yy{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.ycard .yt{font-size:13px;min-width:0}
.ycard .yt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;transition:border-color .15s,background-color .15s;font-variant-numeric:tabular-nums}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip:hover:not(.on){border-color:color-mix(in srgb,var(--line),var(--text) 30%)}
.chip small{opacity:.7;font-weight:500}

/* album page */
.ahead{display:grid;grid-template-columns:384px 1fr;gap:28px;align-items:start}
@media (max-width:640px){.ahead{grid-template-columns:1fr}}
.sleeve{position:relative;width:260px;height:260px}
.sleeve .cover{position:relative;z-index:1;box-shadow:0 2px 4px rgba(0,0,0,.18),0 18px 40px -16px rgba(0,0,0,.45)}
.disc{position:absolute;top:6px;left:6px;width:248px;height:248px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,#0c0d0f 0 3.2%,var(--lbl) 3.3% 17%,#16171a 17.5% 19%,transparent 19.2%),
    repeating-radial-gradient(circle,#1b1c20 0 1px,#111215 1.4px 3px),#111215;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07);animation:discout 1.1s .25s cubic-bezier(.2,.75,.25,1) forwards}
.disc::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 210deg,transparent 0 20%,rgba(255,255,255,.09) 25%,transparent 32% 70%,rgba(255,255,255,.06) 76%,transparent 82%)}
@keyframes discout{to{transform:translateX(118px) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){.disc{animation:none;transform:translateX(118px)}}
@media (max-width:640px){.avgnum{font-size:44px;letter-spacing:-1.5px;min-width:0!important;padding:12px 16px!important}.avgbox{gap:14px;padding:14px}.ainfo h1{font-size:32px}
.sleeve{width:100%;height:auto}.sleeve .cover{width:100%!important;height:auto!important;aspect-ratio:1}.disc{display:none}}
@media (max-width:640px){.ahead{grid-template-columns:1fr;gap:16px}}
.ainfo h1{font-size:40px;line-height:1.05;letter-spacing:-1.2px}
.artist{font-size:19px;font-weight:600;margin:0 0 6px}
.facts{color:var(--muted);font-size:14px;margin-bottom:18px}
.avgbox{display:flex;align-items:center;gap:18px;padding:16px 18px;border-radius:14px;background:var(--soft);border:1px solid var(--line);margin-bottom:16px}
.avgnum{flex:none;white-space:nowrap;font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1;color:#fff;border-radius:12px;padding:12px 16px;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.avglbl{font-size:14px;color:var(--muted);font-weight:600}
.avgsub{font-size:15px;margin-top:4px}
.avgsub b{font-variant-numeric:tabular-nums}
.ranks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ranks a{white-space:nowrap;font-size:12.5px;background:var(--card);border:1px solid var(--line);padding:3px 9px;border-radius:12px;font-weight:600}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:24px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
@media (min-width:641px) and (max-width:900px){.ahead{grid-template-columns:260px 1fr}.disc{display:none}}
.rlist .ri{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.rlist .ri:last-child{border-bottom:none}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.ri .nm{font-weight:700}
.ri .cm{font-size:14px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.ri .dt{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar>div{height:100%}
.form{display:grid;gap:10px}
.form label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:560px){.three{grid-template-columns:1fr 1fr}}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scorein{font-size:26px;font-weight:800;text-align:center;max-width:120px;padding:6px}

/* add */
.mbres{display:grid;gap:6px;margin-top:10px;max-height:420px;overflow:auto}
.mbitem{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;text-align:left;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);white-space:normal}
.mbitem:hover{border-color:var(--accent)}
.mbitem small{color:var(--muted)}
.preview{display:flex;gap:12px;align-items:center}

/* table */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--soft)}
.st-new{color:var(--accent);font-weight:600}.st-old{color:var(--muted)}.st-bad{color:var(--r);font-weight:600}

#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg)!important;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.toast.bad{background:var(--r)}

/* przełącznik albumy/single */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);align-self:end}
.seg button{border:none;border-radius:0;background:transparent;padding:7px 14px;font-weight:600;color:var(--muted)}
.seg{padding:3px;gap:2px;border-radius:12px;background:var(--soft)}
.seg button{border-radius:9px!important;padding:6px 14px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.av{overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.btn-on{border-color:var(--accent);color:var(--accent);font-weight:600}

/* strona główna */
.hello{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.hello h1{margin:0}
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:900px){.home{grid-template-columns:1fr}}
.hmain{display:grid;gap:18px;min-width:0}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.shead h2{margin:0}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => v == null ? '-' : (Math.round(v * 10) / 10).toString().replace('.', ',');
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';
const col = v => v == null ? 'var(--none)' : v >= 70 ? 'var(--g)' : v >= 50 ? 'var(--y)' : 'var(--r)';
// średnie i oceny pokazujemy w pełnych liczbach (70,5 → 71); kolor według zaokrąglonej wartości
const avgN = v => v == null ? '-' : String(Math.round(v));
const badge = (v, cls = '') => `<span class="score ${cls}" style="background:${col(v == null ? v : Math.round(v))}">${avgN(v)}</span>`;
function pl(n, one, few, many){ const a = Math.abs(n) % 100, b = a % 10;
  return n === 1 ? one : (b >= 2 && b <= 4 && !(a >= 12 && a <= 14)) ? few : many; }
const ocen = n => `${n} ${pl(n,'ocena','oceny','ocen')}`;
const fmtDate = d => d ? new Date(d).toLocaleDateString('pl-PL') : '';

const typeGroup = t => t === 'LP' ? 'LP' : t === 'EP' ? 'EP' : 'Inne';
const norm = s => String(s || '').trim().toLowerCase();
const keyOf = (artist, title) => norm(artist) + '\u0001' + norm(title);
function coverHtml(a, cls = 'c64'){

}
const AV_COLORS = ['#e0573a','#2f9e44','#3b7dd8','#9c4fd6','#d6872f','#1f9e98','#d64f8a','#6b7a2f','#5a63d6','#a0522d'];
function avColor(id){ let h = 0; for(const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
function pname(id){ const p = S.profiles.get(id); return p ? (p.display_name || p.username || '?') : '(usunięty)'; }

}
const isSingle = a => a.type === 'Singiel';

function timeAgo(d){
  if(!d) return ''; const s = (Date.now() - new Date(d)) / 1000;
  if(s < 60) return 'przed chwilą';
  if(s < 3600){ const m = Math.floor(s / 60); return `${m} min temu`; }
  if(s < 86400){ const h = Math.floor(s / 3600); return `${h} godz. temu`; }
  const dd = Math.floor(s / 86400);
  if(dd === 1) return 'wczoraj'; if(dd < 7) return `${dd} dni temu`;
  return fmtDate(d);
}

function armButton(btn, label, fn){

    if(!btn.classList.contains('armed')){ btn.classList.add('armed'); const old = btn.textContent; btn.textContent = label;
      setTimeout(() => { if(btn.isConnected){ btn.classList.remove('armed'); btn.textContent = old; } }, 4000); return; }
    btn.disabled = true; try{ await fn(); } finally { if(btn.isConnected) btn.disabled = false; }
  });
}

/* ---------- data ---------- */
async function fetchAll(table){
  let out = [], from = 0; const step = 1000;
  for(;;){
    const { data, error } = await sb.from(table).select('*').range(from, from + step - 1);
    if(error) throw error;
    out = out.concat(data || []);
    if(!data || data.length < step) break;
    from += step;
  }
  return out;
}
async function loadData(){
  let missing = false;
  const opt = t => fetchAll(t).catch(e => { console.warn(t, e); missing = true; return []; });
  const [p, a, r, f, l, w] = await Promise.all([fetchAll('profiles'), fetchAll('albums'), fetchAll('ratings'), opt('favorites'), opt('listen_later'),
    fetchAll('weekly_album').catch(e => { console.warn(e); S.noWeekly = true; return []; })]);
  S.weekly = w.map(x => ({...x, album_id:Number(x.album_id)}));
  S.favs = f.map(x => ({...x, album_id:Number(x.album_id)}));
  S.listen = l.map(x => ({...x, album_id:Number(x.album_id)}));
  if(missing && !S.missing) toast('Ulubione i „do posłuchania” nie działają - uruchom update.sql w Supabase', true);
  S.missing = missing;
  S.profiles = new Map(p.map(x => [x.id, x]));
  S.albums = new Map(a.map(x => [Number(x.id), {...x, id:Number(x.id)}]));
  S.ratings = r.map(x => ({...x, album_id:Number(x.album_id), score:Number(x.score)}));
  reindex(); S.loadedAt = Date.now(); S.allTr = null;
  // tracklisty: zostaw tylko album otwarty na ekranie (jego oceny piosenek odświeżą się osobno)
  const open = route().page === 'album' ? Number(route().arg) : null;
  for(const k of Object.keys(S.tr)) if(Number(k) !== open) delete S.tr[k];
}
function reindex(){
  S.byAlbum = new Map(); S.byUser = new Map();
  for(const r of S.ratings){ push(S.byAlbum, r.album_id, r); push(S.byUser, r.user_id, r); }
}
function stats(id){
  const rs = S.byAlbum.get(id) || [];
  if(!rs.length) return {n:0, avg:null, rs};
  return {n:rs.length, avg:rs.reduce((s, r) => s + r.score, 0) / rs.length, rs};
}
const myRating = id => (S.byAlbum.get(id) || []).find(r => r.user_id === S.user.id) || null;
const me = () => S.profiles.get(S.user.id) || {id:S.user.id, display_name:(S.user.email || '').split('@')[0], is_admin:false};
function upsertLocalRating(row){
  row = {...row, album_id:Number(row.album_id), score:Number(row.score)};
  const i = S.ratings.findIndex(r => r.album_id === row.album_id && r.user_id === row.user_id);
  if(i >= 0) S.ratings[i] = row; else S.ratings.push(row);
  reindex();
}
function removeLocalRating(albumId, userId){
  S.ratings = S.ratings.filter(r => !(r.album_id === albumId && r.user_id === userId)); reindex();
}
function rankList({year = null, min = S.f.min, type = S.f.type, kind = S.f.kind} = {}){
  const out = [];
  for(const a of S.albums.values()){
    if(year != null && a.year !== year) continue;
    if(!kindOk(a, kind)) continue;
    if(hiddenAlbum(a.id)) continue;
    if(kind === 'albums' && type !== 'all' && typeGroup(a.type) !== type) continue;
    const st = stats(a.id);
    if(st.n === 0 || st.n < min) continue;
    out.push({a, st});
  }
  return out.sort((x, y) => y.st.avg - x.st.avg || y.st.n - x.st.n || x.a.title.localeCompare(y.a.title, 'pl'));
}
/* ---------- album tygodnia ---------- */
function weekStart(d = new Date()){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
}
const curWeekly = () => S.weekly.find(w => w.week_start === weekStart() && S.albums.has(w.album_id)) || null;
function aotwRevealed(w){
  if(!w || w.week_start !== weekStart() || new Date().getDay() === 0) return true;
  const raters = new Set((S.byAlbum.get(w.album_id) || []).map(r => r.user_id));
  return S.profiles.size > 0 && [...S.profiles.keys()].every(id => raters.has(id));
}
// oceny albumu tygodnia są ukryte do niedzieli (albo aż wszyscy ocenią) - poza własną
function hiddenAlbum(id){ const w = curWeekly(); return !!w && w.album_id === id && !aotwRevealed(w); }
const isHidden = r => r.user_id !== S.user.id && hiddenAlbum(r.album_id);
const visRatings = () => S.ratings.filter(r => S.albums.has(r.album_id) && !isHidden(r));
function visStats(id){
  const rs = (S.byAlbum.get(id) || []).filter(r => !isHidden(r));
  return rs.length ? {n:rs.length, avg:rs.reduce((s, r) => s + r.score, 0) / rs.length, rs} : {n:0, avg:null, rs};

const lockBadge = (cls = 'sm') => `<span class="score ${cls} lock" title="Ukryte do niedzieli">🔒</span>`;
async function setWeekly(albumId){
  const ws = weekStart(), cur = S.weekly.find(w => w.week_start === ws);
  const q = cur ? sb.from('weekly_album').update({album_id:albumId}).eq('week_start', ws)
                : sb.from('weekly_album').insert({week_start:ws, album_id:albumId, picked_by:S.user.id});

/* ---------- nowe od ostatniej wizyty ---------- */
function initSeen(){

const tsOf = r => Date.parse(r.updated_at || r.created_at || 0) || 0;
const newCount = () => S.seenStart ? 0 : S.ratings.filter(r => r.user_id !== S.user.id && tsOf(r) > S.prevSeen).length;
/* ---------- zgodność gustu ---------- */
function compat(u1, u2){
  const m = new Map((S.byUser.get(u1) || []).filter(r => !isHidden(r)).map(r => [r.album_id, r.score]));
  const pairs = [];
  for(const r of S.byUser.get(u2) || []) if(m.has(r.album_id) && S.albums.has(r.album_id) && !isHidden(r)) pairs.push({id:r.album_id, a:m.get(r.album_id), b:r.score});
  if(pairs.length < 3) return {n:pairs.length, pct:null, pairs};
  const mad = pairs.reduce((s, p) => s + Math.abs(p.a - p.b), 0) / pairs.length;
  return {n:pairs.length, pct:Math.max(0, Math.min(100, Math.round(100 - mad * 3))), mad, pairs};
}
const pctCol = p => p == null ? 'var(--none)' : p >= 70 ? 'var(--g)' : p >= 50 ? 'var(--y)' : 'var(--r)'; // te same progi co oceny
const pctBadge = (c, cls = 'sm') => `<span class="score ${cls}" style="background:${pctCol(c.pct)}" title="${c.n} wspólnych albumów">${c.pct == null ? '-' : c.pct + '%'}</span>`;
const sd = a => { if(a.length < 2) return 0; const m = a.reduce((s, x) => s + x, 0) / a.length; return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / a.length); };
/* ---------- wykonawcy ---------- */
const artistParts = a => String(a || '').split(/\s*(?:,|&| x | feat\.? | ft\.? | with )\s*/i).map(x => x.trim()).filter(Boolean);
const artistAlbums = name => { const k = simp(name); return [...S.albums.values()].filter(a => simp(a.artist) === k || artistParts(a.artist).some(p => simp(p) === k)); };
const artistHref = name => '#/wykonawca/' + encodeURIComponent(name);
function artistLinks(artist){
  const parts = artistParts(artist);
  if(parts.length < 2) return `<a class="alink" href="${artistHref(artist)}">${esc(artist)}</a>`;
  let html = esc(artist);
  for(const p of [...parts].sort((x, y) => y.length - x.length)) html = html.replace(esc(p), `\u0000${parts.indexOf(p)}\u0000`);
  return html.replace(/\u0000(\d+)\u0000/g, (_, i) => `<a class="alink" href="${artistHref(parts[+i])}">${esc(parts[+i])}</a>`);
}

function listenLinks(a){

}

/* ulubione i do posłuchania */
const myFavs = () => S.favs.filter(f => f.user_id === S.user.id && S.albums.has(f.album_id)).sort((a, b) => a.position - b.position);
const favsOf = uid => S.favs.filter(f => f.user_id === uid && S.albums.has(f.album_id)).sort((a, b) => a.position - b.position);
const isFav = id => S.favs.some(f => f.user_id === S.user.id && f.album_id === id);
const myListen = () => S.listen.filter(l => l.user_id === S.user.id && S.albums.has(l.album_id)).sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
const inListen = id => S.listen.some(l => l.user_id === S.user.id && l.album_id === id);
async function addFav(id){
  if(isFav(id)) return true;
  const pos = Math.max(0, ...myFavs().map(f => f.position)) + 1;
  const { data, error } = await sb.from('favorites').insert({user_id:S.user.id, album_id:id, position:pos}).select().single();
  if(error){ toast(errMsg(error), true); return false; }
  S.favs.push({...data, album_id:Number(data.album_id)}); return true;
}
async function removeFav(id){
  const { error } = await sb.from('favorites').delete().eq('user_id', S.user.id).eq('album_id', id);
  if(error){ toast(errMsg(error), true); return false; }
  S.favs = S.favs.filter(f => !(f.user_id === S.user.id && f.album_id === id)); return true;
}
async function moveFav(id, dir){
  const l = myFavs(), i = l.findIndex(f => f.album_id === id), j = i + dir;
  if(i < 0 || j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  const rows = l.map((f, k) => ({user_id:S.user.id, album_id:f.album_id, position:k + 1}));
  rows.forEach(r => { const f = S.favs.find(x => x.user_id === r.user_id && x.album_id === r.album_id); if(f) f.position = r.position; });
  const { error } = await sb.from('favorites').upsert(rows, {onConflict:'user_id,album_id'});
  if(error) toast(errMsg(error), true);
}
async function addListen(id){
  if(inListen(id)) return true;
  const { data, error } = await sb.from('listen_later').insert({user_id:S.user.id, album_id:id}).select().single();
  if(error){ toast(errMsg(error), true); return false; }
  S.listen.push({...data, album_id:Number(data.album_id)}); return true;
}
async function removeListen(id){
  const { error } = await sb.from('listen_later').delete().eq('user_id', S.user.id).eq('album_id', id);
  if(error){ toast(errMsg(error), true); return false; }
  S.listen = S.listen.filter(l => !(l.user_id === S.user.id && l.album_id === id)); return true;
}

function pickerHtml(id, ph){ return `<div class="picker"><input type="search" id="${id}" placeholder="${esc(ph)}" autocomplete="off"><div class="pres" id="${id}-r" hidden></div></div>`; }

/* ---------- MusicBrainz / Cover Art Archive ---------- */
function mbType(rg){
  const sec = (rg['secondary-types'] || []).map(s => s.toLowerCase());
  if(sec.includes('compilation')) return 'Kompilacja';
  if(sec.includes('live')) return 'Live';
  if(sec.includes('mixtape/street')) return 'Mixtape';
  const p = (rg['primary-type'] || '').toLowerCase();
  return p === 'ep' ? 'EP' : p === 'single' ? 'Singiel' : 'LP';
}
const mbArtist = rg => (rg['artist-credit'] || []).map(c => (c.name || (c.artist && c.artist.name) || '') + (c.joinphrase || '')).join('');
const mbCover = (id, size = 500) => `https://coverartarchive.org/release-group/${id}/front-${size}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
let mbNext = 0; // MusicBrainz pozwala na ok. 1 zapytanie na sekundę
async function mbSearch(query){
  const url = 'https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=12&query=' + encodeURIComponent(query);
  for(let attempt = 0; attempt < 5; attempt++){
    const wait = mbNext - Date.now(); mbNext = Math.max(Date.now(), mbNext) + 1100;
    if(wait > 0) await sleep(wait);
    let r;
    try { r = await fetch(url, {headers:{Accept:'application/json'}}); }
    catch(e){ await sleep(1500 * (attempt + 1)); continue; }
    if(r.status === 503 || r.status === 429 || r.status >= 500){ mbNext = Date.now() + 2000 * (attempt + 1); continue; }
    if(!r.ok) throw new Error('MusicBrainz nie odpowiada (' + r.status + '). Spróbuj za chwilę.');
    const j = await r.json();
    return (j['release-groups'] || []).map(rg => ({
      id:rg.id, title:rg.title, artist:mbArtist(rg), score:rg.score || 0,
      year:parseInt((rg['first-release-date'] || '').slice(0, 4)) || null, type:mbType(rg)
    }));
  }
  throw new Error('MusicBrainz jest przeciążony. Spróbuj za chwilę.');
}
async function mbGet(path){
  for(let attempt = 0; attempt < 5; attempt++){
    const wait = mbNext - Date.now(); mbNext = Math.max(Date.now(), mbNext) + 1100;
    if(wait > 0) await sleep(wait);
    let r; try { r = await fetch('https://musicbrainz.org/ws/2/' + path, {headers:{Accept:'application/json'}}); } catch(e){ await sleep(1500 * (attempt + 1)); continue; }
    if(r.status === 503 || r.status === 429 || r.status >= 500){ mbNext = Date.now() + 2000 * (attempt + 1); continue; }
    if(!r.ok) throw new Error('MusicBrainz ' + r.status);
    return r.json();
  }
  throw new Error('MusicBrainz jest przeciążony');
}
const luc = s => String(s).replace(/([+\-!(){}\[\]^"~*?:\\\/]|&&|\|\|)/g, '\\$1');
function testImage(url, ms = 15000){
  return new Promise(res => { const i = new Image(); const t = setTimeout(() => { i.src = ''; res(false); }, ms);
    i.onload = () => { clearTimeout(t); res(i.naturalWidth > 10); }; i.onerror = () => { clearTimeout(t); res(false); };
    i.referrerPolicy = 'no-referrer'; i.src = url; });
}
const simp = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '');
const similar = (a, b) => { const x = simp(a), y = simp(b);
  if(!x || !y) return norm(a).replace(/\s+/g, '') === norm(b).replace(/\s+/g, '') && !!norm(a); // np. tytuł „???”
  return x === y || x.includes(y) || y.includes(x); };
// JSONP - Deezer i Apple nie pozwalają na zwykłe zapytania z innej strony, ale obsługują ten sposób
let jsonpN = 0;
function jsonp(url, ms = 12000){
  return new Promise((res, rej) => {
    const cb = '__jp' + (++jsonpN) + '_' + Date.now(), sc = document.createElement('script');
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); rej(new Error('timeout')); }, ms);
    window[cb] = d => { done(); res(d); };
    sc.onerror = () => { done(); rej(new Error('błąd sieci')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(sc);
  });
}
const dzType = t => t === 'ep' ? 'EP' : t === 'single' ? 'Singiel' : t === 'compile' ? 'Kompilacja' : 'LP';
async function deezerSearch(q){
  const d = await jsonp('https://api.deezer.com/search/album?limit=12&output=jsonp&q=' + encodeURIComponent(q));
  return ((d && d.data) || []).filter(a => a.cover_xl || a.cover_big).map(a => ({
    src:'Deezer', dzId:a.id, nb:a.nb_tracks || 0, title:a.title, artist:(a.artist && a.artist.name) || '', type:dzType(a.record_type), year:null,
    cover:a.cover_xl || a.cover_big, thumb:a.cover_medium || a.cover_xl }));
}
// rok wydania - wyszukiwarka Deezera go nie podaje, trzeba dopytać o szczegóły albumu
async function deezerYear(r){
  if(!r || r.year || !r.dzId) return r;
  try { const d = await jsonp('https://api.deezer.com/album/' + r.dzId + '?output=jsonp', 8000);
    r.year = parseInt(String((d && d.release_date) || '').slice(0, 4)) || null; } catch(e){}
  return r;
}
let itNext = 0; // Apple: ok. 20 zapytań na minutę
async function itunesSearch(q){
  const wait = itNext - Date.now(); itNext = Math.max(Date.now(), itNext) + 3200; if(wait > 0) await sleep(wait);
  const d = await jsonp('https://itunes.apple.com/search?media=music&entity=album&country=PL&limit=12&term=' + encodeURIComponent(q));
  return ((d && d.results) || []).filter(a => a.artworkUrl100).map(a => ({
    src:'Apple Music', itId:a.collectionId, nb:a.trackCount || 0, title:String(a.collectionName || '').replace(/ - (EP|Single)$/i, ''), artist:a.artistName || '',
    type:/ - EP$/i.test(a.collectionName || '') ? 'EP' : / - Single$/i.test(a.collectionName || '') ? 'Singiel' : 'LP',
    year:parseInt(String(a.releaseDate || '').slice(0, 4)) || null,
    cover:a.artworkUrl100.replace(/\/\d+x\d+bb\./, '/600x600bb.'), thumb:a.artworkUrl100 }));
}
const cleanT = t => String(t || '').replace(/\s*[\(\[][^\)\]]*(deluxe|edition|remaster|version|expanded|bonus)[^\)\]]*[\)\]]/ig, '').replace(/ - (EP|Single)$/i, '');
const matches = (r, artist, title) => similar(cleanT(r.title), cleanT(title)) && similar(r.artist, artist);
// wynik: {status:'found', cover, ...} | {status:'none'} | {status:'retry'} (coś nie odpowiedziało - spróbuj ponownie)
async function mbFindCover(artist, title){
  let flaky = false;
  // 1. Deezer
  try {
    let r = (await deezerSearch(`artist:"${artist}" album:"${cleanT(title)}"`)).find(x => matches(x, artist, title));
    if(!r) r = (await deezerSearch(artist + ' ' + cleanT(title))).find(x => matches(x, artist, title));
    if(r){ await deezerYear(r); return {...r, status:'found'}; }
  } catch(e){ flaky = true; }
  // 2. MusicBrainz / Cover Art Archive
  let mbYear = null, mbId = null;
  try {
    let cands = (await mbSearch(`releasegroup:"${luc(title)}" AND artist:"${luc(artist)}"`)).filter(r => r.score >= 80);
    if(!cands.length) cands = (await mbSearch(luc(title) + ' ' + luc(artist))).filter(r => matches(r, artist, title));
    if(cands.length){ mbYear = cands[0].year; mbId = cands[0].id; }
    for(const r of cands.slice(0, 3)){
      for(let t = 0; t < 2; t++){
        if(await testImage(mbCover(r.id, 250))) return {...r, status:'found', cover:mbCover(r.id)};
        flaky = true;
      }
    }
  } catch(e){ flaky = true; }
  // 3. Apple Music
  try {
    const r = (await itunesSearch(artist + ' ' + cleanT(title))).find(x => matches(x, artist, title));
    if(r) return {...r, status:'found', year:r.year || mbYear, id:mbId};
  } catch(e){ flaky = true; }
  return {status:flaky ? 'retry' : 'none', year:mbYear, id:mbId};
}

/* ---------- covers upload ---------- */
function resizeImage(file, max = 700){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Nie udało się przetworzyć obrazka')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('To nie jest obrazek')); };
    img.src = url;
  });
}
function cropSquare(file, size = 320){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('Nie udało się przetworzyć zdjęcia')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('To nie jest obrazek')); };
    img.src = url;
  });
}
async function uploadCover(file){
  const blob = await resizeImage(file);
  const path = `${S.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { error } = await sb.storage.from('covers').upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(error) throw error;
  return sb.storage.from('covers').getPublicUrl(path).data.publicUrl;
}

        ${t ? badge(t.st.avg, 'sm') : ''}</a>`;
    }).join('');
    app.innerHTML = `<h1>Rankingi roczne</h1><p class="sub">Najwyżej ${S.f.kind === 'singles' ? 'oceniony singiel' : 'oceniony album'} każdego roku. Kliknij rok, żeby zobaczyć pełny ranking.</p>
      ${filtersHtml()}<div class="years">${cards || '<div class="empty">Brak albumów z rokiem.</div>'}</div>`;

  }
  const list = rankList({year:y});
  app.innerHTML = `<h1>Najlepsze ${S.f.kind === 'singles' ? 'single' : 'albumy'} ${y}</h1><p class="sub">${list.length} ${S.f.kind === 'singles' ? pl(list.length,'oceniony singiel','ocenione single','ocenionych singli') : pl(list.length,'oceniony album','ocenione albumy','ocenionych albumów')}</p>

    ${filtersHtml()}${listHtml(list)}`;
  bindFilters();
}

function viewAlbums(){
  const f = S.af;
  const cnt = [...S.albums.values()].filter(a => kindOk(a, f.kind)).length;
  app.innerHTML = `<h1>${f.kind === 'singles' ? 'Single' : 'Wszystkie albumy'}</h1><p class="sub">${cnt} ${f.kind === 'singles' ? pl(cnt,'singiel','single','singli') : pl(cnt,'album','albumy','albumów')} w bazie</p>
    <div class="filters">
      ${segHtml('akind', f.kind)}
      <label>Szukaj<input type="search" id="aq" value="${esc(f.q)}" placeholder="wykonawca lub tytuł"></label>
      <label>Pokaż<select id="af">${[['all','Wszystkie'],['unrated-me','Nieocenione przeze mnie'],['unrated','Bez żadnej oceny'],['nocover','Bez okładki']].map(([v, l]) => `<option value="${v}" ${f.f === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label>Sortuj<select id="as">${[['added','Ostatnio dodane'],['artist','Wykonawca A-Z'],['year','Rok (najnowsze)'],['avg','Średnia']].map(([v, l]) => `<option value="${v}" ${f.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    </div><div id="agrid"></div>`;
  const draw = () => {
    const q = norm(f.q);
    let l = [...S.albums.values()].filter(a => {
      if(!kindOk(a, f.kind)) return false;
      if(q && !(norm(a.artist).includes(q) || norm(a.title).includes(q))) return false;
      if(f.f === 'unrated-me') return !myRating(a.id);
      if(f.f === 'unrated') return !stats(a.id).n;
      if(f.f === 'nocover') return !safeUrl(a.cover_url);
      return true;
    });
    const cmp = {
      added:(x, y) => (y.created_at || '').localeCompare(x.created_at || '') || y.id - x.id,
      artist:(x, y) => x.artist.localeCompare(y.artist, 'pl') || (x.year || 0) - (y.year || 0),
      year:(x, y) => (y.year || 0) - (x.year || 0) || x.artist.localeCompare(y.artist, 'pl'),
      avg:(x, y) => (stats(y.id).avg ?? -1) - (stats(x.id).avg ?? -1),
    }[f.sort];
    l.sort(cmp);
    const shown = l.slice(0, f.limit);
    document.getElementById('agrid').innerHTML = l.length ? `<div class="grid">${shown.map(a => { const st = stats(a.id), m = myRating(a.id);
      return `<a class="tile" href="#/album/${a.id}"><div class="cw">${coverHtml(a, 'cfull')}${st.n ? badge(st.avg, 'sm') : ''}</div>
        <div><div class="t">${esc(a.title)}</div><div class="a">${esc(a.artist)}${a.year ? ' · ' + a.year : ''}</div>
        <div class="a">${st.n ? ocen(st.n) : 'brak ocen'}${m ? ' · Ty: ' + num(m.score) : ''}</div></div></a>`; }).join('')}</div>
      ${l.length > shown.length ? `<div style="text-align:center;margin-top:18px"><button id="more">Pokaż więcej (${l.length - shown.length})</button></div>` : ''}`
      : `<div class="list"><div class="empty">Nic nie znaleziono. <a class="link" href="#/dodaj">Dodaj album</a></div></div>`;
    const m = document.getElementById('more'); if(m) m.onclick = () => { f.limit += 240; draw(); };
  };
  bindSeg('akind', v => { f.kind = v; f.limit = 120; render(); });
  document.getElementById('aq').oninput = e => { f.q = e.target.value; f.limit = 120; draw(); };
  document.getElementById('af').onchange = e => { f.f = e.target.value; f.limit = 120; draw(); };
  document.getElementById('as').onchange = e => { f.sort = e.target.value; draw(); };
  draw();
}

function bindAlbumForm(a, isNew){
  const $ = id => document.getElementById(id);
  const setPreview = () => { $('fcp').innerHTML = coverHtml({title:$('ft').value || '?', cover_url:$('fc').value.trim()}, 'c64'); };
  $('fc').oninput = setPreview; $('ft').oninput = setPreview;
  $('ff').onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    $('ferr').textContent = ''; $('fcp').innerHTML = '<span class="muted small">Wgrywanie…</span>';
    try { $('fc').value = await uploadCover(file); setPreview(); toast('Okładka wgrana'); }
    catch(err){ $('ferr').textContent = 'Nie udało się wgrać okładki: ' + errMsg(err); setPreview(); }
    e.target.value = '';
  };
  $('mbf').onsubmit = async e => {
    e.preventDefault(); const q = $('mbq').value.trim(); if(!q) return;
    $('mbst').textContent = 'Szukam…'; $('mbres').innerHTML = '';
    try {
      const [mb, dz, it] = await Promise.all([
        mbSearch(q).then(r => r.map(x => ({...x, src:'MusicBrainz', cover:null, thumb:mbCover(x.id, 250)}))).catch(() => []),
        deezerSearch(q).then(l => Promise.all(l.map(deezerYear))).catch(() => []), itunesSearch(q).catch(() => [])]);
      // przeplataj źródła, żeby na górze były najlepsze wyniki z każdego
      const res = []; for(let i = 0; i < 12; i++) for(const l of [dz, mb, it]) if(l[i]) res.push(l[i]);
      $('mbst').textContent = res.length ? 'Kliknij właściwy album:' : 'Nic nie znaleziono - wpisz dane ręcznie.';
      $('mbres').innerHTML = res.map((r, i) => `<button type="button" class="mbitem" data-i="${i}">
        ${coverHtml({title:r.title, cover_url:r.thumb}, 'c48')}
        <span><b>${esc(r.title)}</b><br><span>${esc(r.artist)}</span><br><small>${r.year ?? ''}${r.year ? ' · ' : ''}${esc(r.type)} · ${esc(r.src)}</small></span></button>`).join('');
      $('mbres').querySelectorAll('.mbitem').forEach(b => b.onclick = async () => {
        const r = res[+b.dataset.i];
        $('fa').value = r.artist; $('ft').value = r.title; if(r.year) $('fy').value = r.year; $('fty').value = r.type;
        if(r.src === 'MusicBrainz') $('fmb').value = r.id;
        $('fc').value = ''; $('fcp').innerHTML = '<span class="muted small">Szukam okładki…</span>';
        const u = r.cover || mbCover(r.id);
        if(await testImage(u)){ $('fc').value = u; } else toast('Brak okładki w tym źródle - wybierz inny wynik, wgraj plik lub wklej link', true);
        setPreview();
        const dup = isNew && findAlbum(r.artist, r.title);
        $('ferr').innerHTML = dup ? `Ten album już jest: <a class="link" href="#/album/${dup.id}">przejdź do niego</a>` : '';
      });
    } catch(err){ $('mbst').textContent = err.message; }
  };
  $('af2').onsubmit = async e => {
    e.preventDefault();
    const artist = $('fa').value.trim(), title = $('ft').value.trim();
    const yr = $('fy').value.trim(), year = yr ? parseInt(yr) : null;
    const cover = $('fc').value.trim();
    if(!artist || !title) return $('ferr').textContent = 'Podaj wykonawcę i tytuł.';
    if(yr && !(year >= 1900 && year <= 2100)) return $('ferr').textContent = 'Rok musi być między 1900 a 2100.';
    if(cover && !safeUrl(cover)) return $('ferr').textContent = 'Link do okładki musi zaczynać się od https://';
    let score = null;
    if(isNew && $('fs').value.trim()){ score = parseScore($('fs').value); if(score == null) return $('ferr').textContent = 'Ocena musi być liczbą od 0 do 100.'; }
    const dup = findAlbum(artist, title);
    if(dup && (isNew || dup.id !== a.id)) return $('ferr').innerHTML = `Taki album już jest: <a class="link" href="#/album/${dup.id}">przejdź do niego</a>`;
    const row = {artist, title, year, type:$('fty').value, cover_url:cover || null, mbid:$('fmb').value || null};
    $('fsave').disabled = true;
    const q = isNew ? sb.from('albums').insert(row) : sb.from('albums').update(row).eq('id', a.id);
    const { data, error } = await q.select().single();
    if(error){ $('fsave').disabled = false; return $('ferr').textContent = errMsg(error); }
    const saved = {...data, id:Number(data.id)}; S.albums.set(saved.id, saved);
    if(score != null){
      const r = await sb.from('ratings').upsert({album_id:saved.id, user_id:S.user.id, score}, {onConflict:'album_id,user_id'}).select().single();
      if(r.error) toast('Album dodany, ale ocena nie: ' + errMsg(r.error), true); else upsertLocalRating(r.data);
    }
    toast(isNew ? 'Dodano album' : 'Zapisano zmiany');
    location.hash = '#/album/' + saved.id;
  };
}

// ta sama płyta w kilku wersjach (Deluxe, Remaster…) - zostaw najstarszą
function dedupeEditions(list){
  const m = new Map();
  for(const a of list){ const k = simp(a.artist) + '|' + simp(cleanT(a.title));
    const o = m.get(k); if(!o || (a.year && (!o.year || a.year < o.year)) || (a.year === o.year && a.title.length < o.title.length)) m.set(k, a); }
  return [...m.values()];
}
function bulkHtml(items, opts){
  const vis = items.filter(it => opts.show[it.type] !== false);
  const sel = vis.filter(it => it.checked && !it.exists).length;
  return `<div class="filters" style="margin:12px 0">
      ${[['Singiel','Pokaż single'],['Kompilacja','Pokaż kompilacje']].map(([t, l]) => `<label style="flex-direction:row;align-items:center;gap:6px;font-size:13.5px;color:var(--text)"><input type="checkbox" data-show="${t}" ${opts.show[t] ? 'checked' : ''} style="width:auto"> ${l}</label>`).join('')}
      <button type="button" id="bAll">Zaznacz wszystkie</button><button type="button" id="bNone">Odznacz</button></div>
    <div class="list">${vis.length ? vis.map(it => `<label class="row" style="grid-template-columns:28px 48px minmax(0,1fr) auto;cursor:${it.exists ? 'default' : 'pointer'}">
      <input type="checkbox" data-i="${items.indexOf(it)}" ${it.exists ? 'disabled checked' : it.checked ? 'checked' : ''} style="width:18px;height:18px">
      ${coverHtml({title:it.title, cover_url:it.thumb}, 'c48')}
      <span class="meta"><b>${esc(it.title)}</b><span>${esc(it.artist)}</span><small>${it.year || ''}${it.year ? ' · ' : ''}${esc(it.type)}${it.genre ? ' · ' + esc(it.genre) : ''}</small></span>
      <span class="small ${it.exists ? 'st-old' : it.added ? 'st-new' : 'muted'}">${it.exists ? (it.added ? 'dodano ✓' : 'już w bazie') : ''}</span></label>`).join('')
      : '<div class="empty">Brak pozycji.</div>'}</div>
    <div class="btns bulkbar"><button class="btn-p" id="bAdd" ${sel ? '' : 'disabled'}>Dodaj zaznaczone (${sel})</button><span class="small" id="bSt"></span></div>`;
}
function bindBulk(box, items, opts, rerender){
  box.querySelectorAll('[data-show]').forEach(c => c.onchange = () => { opts.show[c.dataset.show] = c.checked; rerender(); });
  box.querySelectorAll('input[data-i]').forEach(c => c.onchange = () => { items[+c.dataset.i].checked = c.checked; const sel = items.filter(it => opts.show[it.type] !== false && it.checked && !it.exists).length;
    const b = document.getElementById('bAdd'); b.disabled = !sel; b.textContent = `Dodaj zaznaczone (${sel})`; });
  document.getElementById('bAll').onclick = () => { items.forEach(it => { if(opts.show[it.type] !== false) it.checked = true; }); rerender(); };
  document.getElementById('bNone').onclick = () => { items.forEach(it => it.checked = false); rerender(); };
  document.getElementById('bAdd').onclick = async () => {
    const b = document.getElementById('bAdd'), st = document.getElementById('bSt'); b.disabled = true;
    const todo = items.filter(it => opts.show[it.type] !== false && it.checked && !it.exists && !findAlbum(it.artist, it.title));
    try {
      for(let i = 0; i < todo.length; i++){ if(!todo[i].year){ st.textContent = `Sprawdzam lata wydania ${i + 1}/${todo.length}…`; await deezerYear(todo[i]); await sleep(130); } }
      let added = 0;
      for(let i = 0; i < todo.length; i += 50){
        st.textContent = `Dodaję ${Math.min(i + 50, todo.length)}/${todo.length}…`;
        const rows = todo.slice(i, i + 50).map(it => ({artist:it.artist, title:it.title, year:it.year, type:it.type, cover_url:safeUrl(it.cover) || null}));
        let { data, error } = await sb.from('albums').insert(rows).select();
        if(error){ data = []; for(const r of rows){ const x = await sb.from('albums').insert(r).select().single(); if(!x.error) data.push(x.data); } }
        data.forEach(d => S.albums.set(Number(d.id), {...d, id:Number(d.id)})); added += data.length;
      }
      items.forEach(it => { if(findAlbum(it.artist, it.title)){ if(!it.exists) it.added = true; it.exists = true; } });
      toast(`Dodano ${added} ${pl(added,'album','albumy','albumów')}`); rerender();
    } catch(e){ st.innerHTML = `<span class="err">${esc(errMsg(e))}</span>`; b.disabled = false; }
  };
}

    catch(err){ D.artists = null; st.textContent = 'Deezer nie odpowiada - spróbuj za chwilę.'; }
    drawArtists();
  };

  if(D.auto){ D.auto = false; document.getElementById('dsf').requestSubmit(); }

const US_GENRES = [[14,'Pop'],[17,'Dance'],[7,'Elektronika'],[15,'R&B/Soul'],[20,'Alternatywa'],[10,'Singer/Songwriter'],[51,'K-Pop'],[18,'Hip-Hop/Rap']];
async function appleTop(genre){
  const r = await fetch(`https://itunes.apple.com/us/rss/topalbums/limit=100/genre=${genre}/json`);
  if(!r.ok) throw new Error('Apple ' + r.status);
  const j = await r.json(), e = (j.feed && j.feed.entry) || [];
  return (Array.isArray(e) ? e : [e]).map(x => {
    const raw = (x['im:name'] && x['im:name'].label) || '', imgs = x['im:image'] || [];
    const img = (imgs[imgs.length - 1] && imgs[imgs.length - 1].label) || '';
    return {title:raw.replace(/ - (EP|Single)$/i, ''), artist:(x['im:artist'] && x['im:artist'].label) || '',
      type:/ - EP$/i.test(raw) ? 'EP' : / - Single$/i.test(raw) ? 'Singiel' : 'LP',
      year:parseInt(String((x['im:releaseDate'] && x['im:releaseDate'].label) || '').slice(0, 4)) || null,
      cover:img.replace(/\/\d+x\d+bb\./, '/600x600bb.'), thumb:img,
      genre:(x.category && x.category.attributes && x.category.attributes.label) || ''};
  });
}
function viewChart(tabs){
  const C = S.chart || (S.chart = {genres:new Set([14]), items:null, key:'', show:{Singiel:false, Kompilacja:false}});
  app.innerHTML = `<h1>Popularne teraz (USA)</h1><p class="sub">Top albumy z amerykańskiej listy Apple Music. Wybierz gatunki i zaznacz albumy, które warto mieć w bazie.</p>${tabs}
    <div class="card"><div class="chips" id="chg" style="margin-bottom:6px">${US_GENRES.map(([g, l]) => `<button type="button" class="chip ${C.genres.has(g) ? 'on' : ''}" data-g="${g}">${l}</button>`).join('')}</div>
    <div class="muted small" id="chst"></div><div id="chl"></div></div>`;
  document.querySelectorAll('#chg [data-g]').forEach(b => b.onclick = () => {
    const g = +b.dataset.g; if(C.genres.has(g)){ if(C.genres.size > 1) C.genres.delete(g); } else C.genres.add(g); render(); });
  const draw = () => { const box = document.getElementById('chl'); if(box && C.items){ box.innerHTML = bulkHtml(C.items, C); bindBulk(box, C.items, C, draw); } };
  const key = [...C.genres].sort().join(',');
  if(C.items && C.key === key) return draw();
  const st = document.getElementById('chst'); st.textContent = 'Pobieram listę…';
  Promise.all([...C.genres].map(g => appleTop(g).catch(() => null))).then(lists => {
    const ok = lists.filter(Boolean);
    if(!ok.length){ const s2 = document.getElementById('chst'); if(s2) s2.textContent = 'Apple nie odpowiada - spróbuj za chwilę.'; return; }
    // przeplataj listy gatunków według miejsca w rankingu, bez powtórek
    const seen = new Set(), out = [];
    for(let i = 0; i < 100; i++) for(const l of ok){ const it = l[i]; if(!it) continue;
      const k = simp(it.artist) + '|' + simp(cleanT(it.title)); if(seen.has(k)) continue; seen.add(k); out.push(it); }
    out.forEach(it => { it.exists = !!findAlbum(it.artist, it.title); it.checked = false; });
    C.items = out; C.key = key;
    const s2 = document.getElementById('chst'); if(s2){ s2.textContent = `${out.length} ${pl(out.length,'album','albumy','albumów')}`; draw(); }
  });
}

function histHtml(R, sel, who){
  const buckets = [[100,100,'100'],[90,99.9,'90 - 99'],[80,89.9,'80 - 89'],[70,79.9,'70 - 79'],[60,69.9,'60 - 69'],[50,59.9,'50 - 59'],[40,49.9,'40 - 49'],[30,39.9,'30 - 39'],[20,29.9,'20 - 29'],[10,19.9,'10 - 19'],[0,9.9,'0 - 9']]
    .map(([lo, hi, l]) => ({l, lo, hi, mid:(lo + Math.min(hi, 99)) / 2, n:R.filter(r => r.score >= lo && r.score <= hi).length}));
  const bmax = Math.max(1, ...buckets.map(b => b.n)), selB = buckets.find(b => b.l === sel && b.n) || null;
  const inB = selB ? R.filter(r => r.score >= selB.lo && r.score <= selB.hi).sort((p, q) => q.score - p.score || S.albums.get(p.album_id).title.localeCompare(S.albums.get(q.album_id).title, 'pl')) : [];
  return `<div class="hist">${buckets.map(b => `<button type="button" class="hrow ${selB === b ? 'on' : ''}" data-b="${b.l}" ${b.n ? '' : 'disabled'} aria-expanded="${selB === b}"><span class="lb">${b.l}</span><span class="ct">${b.n || ''}</span>
      ${b.n ? `<span class="br" style="width:${b.n / bmax * 100}%;background:${col(b.mid)}"></span>` : '<span class="br z"></span>'}</button>`).join('')}</div>
    ${selB ? `<div class="hlist"><div class="shead" style="margin:14px 0 6px"><h2 style="font-size:15px;margin:0">${selB.l}: ${ocen(inB.length)}</h2><button type="button" class="link small" data-hclose>Zwiń</button></div>
      <div class="hscroll">${inB.map(r => { const a = S.albums.get(r.album_id);
        return `<a class="hitem" href="#/album/${a.id}">${coverHtml(a, 'c40')}<span class="meta"><b>${esc(a.title)}</b><span>${esc(a.artist)}${a.year ? ' · ' + a.year : ''}</span></span>
          <span class="r2">${who === 'all' ? `<span title="${esc(pname(r.user_id))}">${avatar(r.user_id, 24)}</span>` : ''}${badge(r.score, 'sm')}</span></a>`; }).join('')}</div></div>`
    : (R.length ? '<p class="note">Kliknij pasek, żeby zobaczyć albumy z danego przedziału.</p>' : '')}`;
}

const fmtDur = t => t ? `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}` : '';
const autoSkip = t => ({...t, skip:/\b(intro|interlude|skit|prelude|interludium)\b/i.test(t.title) || (t.duration != null && t.duration > 0 && t.duration < 60)});
async function loadTracks(id, force){
  const T = S.tr[id] || (S.tr[id] = {});
  if(T.state === 'ok' && !force) return T;
  const [x, y] = await Promise.all([sb.from('tracks').select('*').eq('album_id', id).order('position'), sb.from('track_ratings').select('*').eq('album_id', id)]);
  const e = x.error || y.error;
  if(e){ T.state = /tracks|track_ratings|relation|schema cache/i.test(e.message || '') ? 'missing' : 'error'; T.err = e; return T; }
  T.tracks = (x.data || []).map(t => ({...t, position:Number(t.position)})).sort((p, q) => p.position - q.position);
  T.ratings = (y.data || []).map(r => ({...r, position:Number(r.position), score:r.score == null ? null : Number(r.score)}));
  T.state = 'ok'; return T;
}
async function fetchTracklist(a){
  const wantSingle = a.type === 'Singiel', shortOk = wantSingle || ['EP','Mixtape','Inne'].includes(a.type);
  try { // 1. Deezer - wśród pasujących wybierz album/EP (nie singiel o tej samej nazwie), najlepiej z największą liczbą utworów
    const rank = x => x.type === 'Singiel' ? (wantSingle ? 3 : 0) : x.type === 'LP' ? 2 : 1;
    const exact = x => simp(x.title) === simp(a.title) ? 1 : 0; // podstawowa wersja przed Deluxe
    const pick = l => l.filter(x => matches(x, a.artist, a.title)).sort((p, q) => rank(q) - rank(p) || exact(q) - exact(p) || q.nb - p.nb)[0];
    let r = pick(await deezerSearch(`artist:"${a.artist}" album:"${cleanT(a.title)}"`));
    if(!r || (!wantSingle && r.type === 'Singiel')){ const r2 = pick(await deezerSearch(a.artist + ' ' + cleanT(a.title))); if(r2 && (!r || rank(r2) > rank(r))) r = r2; }
    if(r && r.dzId && (shortOk || r.type !== 'Singiel' || r.nb >= 4)){
      const d = await jsonp('https://api.deezer.com/album/' + r.dzId + '/tracks?limit=300&output=jsonp');
      const t = ((d && d.data) || []).sort((p, q) => ((p.disk_number || 1) - (q.disk_number || 1)) || ((p.track_position || 0) - (q.track_position || 0)));
      // 1-2 utwory przy albumie to prawie na pewno singiel - wtedy spróbuj MusicBrainz
      if(t.length && (shortOk || t.length > 2)) return {src:'Deezer', tracks:t.map(x => ({title:x.title_short || x.title, duration:x.duration || null}))};
    }
  } catch(e){ console.warn(e); }
  try { // 2. MusicBrainz
    let rg = a.mbid;
    if(!rg){ const res = (await mbSearch(`releasegroup:"${luc(a.title)}" AND artist:"${luc(a.artist)}"`)).filter(r => r.score >= 85); rg = res[0] && res[0].id; }
    if(rg){
      const j = await mbGet(`release?release-group=${rg}&inc=recordings&fmt=json&limit=15`);
      const rels = (j.releases || []).filter(r => r.media && r.media.some(m => (m.tracks || []).length))
        .sort((p, q) => (p.status === 'Official' ? 0 : 1) - (q.status === 'Official' ? 0 : 1) || (p.date || '9999').localeCompare(q.date || '9999'));
      const rel = wantSingle ? rels[0] : (rels.find(r => r.media.reduce((n, m) => n + (m.tracks || []).length, 0) > 2) || rels[0]);
      if(rel) return {src:'MusicBrainz', tracks:rel.media.flatMap(m => m.tracks || []).map(x => ({title:x.title, duration:x.length ? Math.round(x.length / 1000) : null}))};
    }
  } catch(e){ console.warn(e); }
  try { // 3. Apple Music
    const l = (await itunesSearch(a.artist + ' ' + cleanT(a.title))).filter(x => matches(x, a.artist, a.title) && x.itId)
      .sort((p, q) => (simp(q.title) === simp(a.title)) - (simp(p.title) === simp(a.title)) || q.nb - p.nb);
    const r = l.find(x => shortOk || x.nb > 2);
    if(r){
      const d = await jsonp('https://itunes.apple.com/lookup?entity=song&country=PL&limit=300&id=' + r.itId);
      const t = ((d && d.results) || []).filter(x => x.wrapperType === 'track').sort((p, q) => (p.discNumber || 1) - (q.discNumber || 1) || (p.trackNumber || 0) - (q.trackNumber || 0));
      if(t.length) return {src:'Apple Music', tracks:t.map(x => ({title:x.trackName, duration:x.trackTimeMillis ? Math.round(x.trackTimeMillis / 1000) : null}))};
    }
  } catch(e){ console.warn(e); }
  return null;
}
// zapisz tracklistę, zachowując oceny utworów na tych samych pozycjach
async function saveTracklist(id, list){
  const T = S.tr[id] || {tracks:[]}, old = new Map((T.tracks || []).map(t => [t.position, t]));
  const rows = list.map((t, i) => ({album_id:id, position:i + 1, title:String(t.title).trim().slice(0, 300), duration:t.duration || null, skip:!!t.skip}));
  const changed = rows.filter(r => { const o = old.get(r.position); return !o || o.title !== r.title || !!o.skip !== r.skip || (o.duration || null) !== r.duration; });
  if(changed.length){ const { error } = await sb.from('tracks').upsert(changed, {onConflict:'album_id,position'}); if(error) return error; }
  if(old.size > rows.length){ const { error } = await sb.from('tracks').delete().eq('album_id', id).gt('position', rows.length); if(error) return error; }
  return null;
}
async function initTracks(a){
  const body = () => document.getElementById('trkBody');
  const here = () => route().page === 'album' && Number(route().arg) === a.id && body();
  const T = await loadTracks(a.id);
  if(!here()) return;
  if(T.state === 'missing'){ body().innerHTML = '<div class="muted small">Żeby oceniać piosenki, uruchom <b>update3.sql</b> w Supabase.</div>'; return; }
  if(T.state === 'error'){ body().innerHTML = `<div class="err">Nie udało się wczytać utworów: ${esc(errMsg(T.err))}</div>`; return; }
  if(!T.tracks.length && !T.tried){
    T.tried = true; body().innerHTML = '<div class="muted small">Szukam tracklisty w Deezerze, MusicBrainz i Apple Music…</div>';
    const r = await fetchTracklist(a);
    if(r){ const err = await saveTracklist(a.id, r.tracks.map(autoSkip)); if(!err){ T.src = r.src; await loadTracks(a.id, true); } else console.warn(err); }
    if(!here()) return;
  }
  drawTracks(a);
}
function trackStats(a){
  const T = S.tr[a.id], hid = hiddenAlbum(a.id), uid = S.user.id;
  const by = new Map(T.tracks.map(t => [t.position, {n:0, sum:0, fav:0, mine:null, myFav:false, others:0, list:[]}]));
  for(const r of T.ratings){ const o = by.get(r.position); if(!o) continue;
    if(r.user_id === uid){ o.mine = r.score; o.myFav = r.fav; } else if(r.score != null) o.others++;
    if(hid) continue;
    if(r.score != null){ o.n++; o.sum += r.score; } if(r.fav) o.fav++; if(r.score != null || r.fav) o.list.push(r); }
  let best = null;
  for(const t of T.tracks){ const o = by.get(t.position); if(!t.skip && o.n >= 2 && (!best || o.sum / o.n > best.avg)) best = {pos:t.position, avg:o.sum / o.n}; }
  return {by, best, hid};
}
function mapB(x, c = 80){
  const A = [[0,0],[50,40],[60,50],[c-12,c-20],[c-6,c-12],[c-2,c-6],[c,c-3],[c+2,c+1],[c+4,c+6],[c+6,c+9],[c+8,c+11],[95,97],[100,100]];
  for(let i = 0; i < A.length - 1; i++) if(x <= A[i + 1][0]){ const [x0, y0] = A[i], [x1, y1] = A[i + 1]; return y0 + (x - x0) * (y1 - y0) / (x1 - x0); }
  return 100;
}
/* ----- kalkulator oceny (suwaki) ----- */
const CALC_DEF = {bonus:0.3, kara:0.15, frac:25, center:80, stretch:100, mode:'B'};
function calcCfg(){ if(!S.calc){ let v = {}; try { v = JSON.parse(localStorage.getItem('oceny_calc') || '{}') || {}; } catch(e){} S.calc = Object.assign({}, CALC_DEF, v); } return S.calc; }
function calcSave(){ try { localStorage.setItem('oceny_calc', JSON.stringify(S.calc)); } catch(e){} }
function calcAnchors(c, mode){
  if(mode === 'A') return [[0,0],[60,55],[c-12,c-16],[c-6,c-9],[c-2,c-4],[c,c],[c+2,c+4],[c+4,c+7],[c+6,c+9],[c+8,c+11],[95,97],[100,100]];
  return [[0,0],[50,40],[60,50],[c-12,c-20],[c-6,c-12],[c-2,c-6],[c,c-3],[c+2,c+1],[c+4,c+6],[c+6,c+9],[c+8,c+11],[95,97],[100,100]];
}
function calcMap(x){
  const C = calcCfg(), A = calcAnchors(C.center, C.mode); let y = 100;
  for(let i = 0; i < A.length - 1; i++) if(x <= A[i + 1][0]){ const [x0, y0] = A[i], [x1, y1] = A[i + 1]; y = y0 + (x - x0) * (y1 - y0) / (x1 - x0); break; }
  return x + (C.stretch / 100) * (y - x);
}
function calcCompute(vals){
  const C = calcCfg(), n = vals.length; if(!n) return null;
  const sorted = [...vals].sort((p, q) => q - p), k = Math.min(n, Math.max(2, Math.ceil(n * C.frac / 100)));
  const avg = l => l.reduce((s2, v) => s2 + v, 0) / l.length;
  const Sm = avg(vals), T = avg(sorted.slice(0, k)), D = avg(sorted.slice(n - k));
  const W = Math.max(0, Math.min(100, Sm + C.bonus * (T - Sm) - C.kara * (Sm - D)));
  return {n, k, S:Sm, T, D, W, F:calcMap(W), topThr:sorted[k - 1], botThr:sorted[n - k]};
}
// ręczne wpisywanie: spacje/enter; przecinek przed jedną cyfrą = ułamek; „x” = pomiń; wszystkie ≤ 10 → skala 0-10 (×10)
function calcParse(txt){
  const t = String(txt || '').replace(/(\d),(\d)(?!\d)/g, '$1.$2'), out = [];
  for(const tok of t.split(/[\s,;]+/)){ if(!tok) continue;
    const m = tok.match(/^(\d{1,3}(?:\.\d+)?)(x)?$/i);
    if(!m || parseFloat(m[1]) > 100){ out.push({bad:tok}); continue; }
    out.push({v:parseFloat(m[1]), orig:m[1], skip:!!m[2]}); }
  const ok = out.filter(o => o.v != null); out.ten = ok.length > 0 && ok.every(o => o.v <= 10);
  if(out.ten) ok.forEach(o => o.v = o.v * 10);
  return out;
}
function calcChart(res){
  const W = 320, H = 200, L = 28, R = 8, T = 8, B = 22, x0 = 50, x1 = 100, y0 = 40, y1 = 100;
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (y1 - y) / (y1 - y0) * (H - T - B);
  let g = '';
  for(let v = 50; v <= 100; v += 10) g += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${T}" y2="${H - B}" stroke="var(--line)"/><text x="${sx(v)}" y="${H - 7}" text-anchor="middle">${v}</text>`;
  for(let v = 40; v <= 100; v += 10) g += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${sy(v) + 3}" text-anchor="end">${v}</text>`;
  g += `<line x1="${sx(50)}" y1="${sy(50)}" x2="${sx(100)}" y2="${sy(100)}" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".6"/>`;
  let pth = ''; for(let x = 50; x <= 100; x += 0.5){ const y = Math.max(y0, calcMap(x)); pth += (pth ? 'L' : 'M') + sx(x).toFixed(1) + ' ' + sy(y).toFixed(1); }
  g += `<path d="${pth}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  if(res && res.W >= 50) g += `<circle cx="${sx(res.W)}" cy="${sy(Math.max(y0, res.F))}" r="5" fill="var(--card)" stroke="var(--text)" stroke-width="2"/>`;
  g += `<text x="${W - R}" y="${T + 10}" text-anchor="end">wynik → ocena</text>`;
  return `<svg class="cchart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Wykres przelicznika skali">${g}</svg>`;
}
function calcData(a){
  const T = S.tr[a.id];
  const trVals = T && T.state === 'ok' ? T.tracks.filter(t => !t.skip).map(t => { const r = T.ratings.find(x => x.user_id === S.user.id && x.position === t.position); return r && r.score != null ? r.score : null; }).filter(v => v != null) : [];
  const src = S.calcSrc || (trVals.length ? 'tracks' : 'manual');
  S.calcText = S.calcText || {};
  if(src === 'tracks') return {src, vals:trVals, res:calcCompute(trVals), chips:'',
    note:trVals.length ? `Twoje oceny ${trVals.length} ${pl(trVals.length,'piosenki','piosenek','piosenek')} z tego albumu (bez pomijanych). Zmieniają się na bieżąco, gdy oceniasz utwory.` : 'Nie oceniłeś jeszcze piosenek z tego albumu - oceń je w sekcji „Utwory” albo przełącz na „Wpisz ręcznie”.'};
  const parsed = calcParse(S.calcText[a.id] || '');
  const vals = parsed.filter(o => o.v != null && !o.skip).map(o => o.v), res = calcCompute(vals);
  const idx = []; parsed.forEach((o, i) => { if(o.v != null && !o.skip) idx.push(i); });
  const order = [...idx].sort((p, q) => parsed[q].v - parsed[p].v), k = res ? res.k : 0;
  const top = new Set(order.slice(0, k)), bot = new Set(order.slice(order.length - k));
  const chips = parsed.length ? `<div class="cchips">${parsed.map((o, i) => o.bad != null ? `<span class="cchip bad" title="Nie rozpoznano">${esc(o.bad)}</span>`
    : `<span class="cchip ${o.skip ? 'skip' : top.has(i) ? 'top' : bot.has(i) ? 'bot' : ''}">${esc(o.orig.replace('.', ','))}</span>`).join('')}</div>` : '';
  return {src, vals, res, chips, note:parsed.ten ? 'Wykryto skalę 0-10 - oceny liczone ×10.' : ''};
}

}

async function saveTrackScore(a, pos, inp){

  catch(e){ console.error(e); toast('Nie udało się zapisać oceny piosenki - sprawdź internet i spróbuj jeszcze raz', true); }
}
async function saveTrackScore_(a, pos, inp){
  const T = await trackData(a), uid = S.user.id, raw = inp.value.trim();
  if(!T || T.state !== 'ok') throw new Error('brak tracklisty');
  const cur = T.ratings.find(r => r.user_id === uid && r.position === pos);
  let score = null;
  if(raw){ score = parseScore(raw); if(score == null){ toast('Ocena piosenki: liczba od 0 do 100', true); inp.value = cur && cur.score != null ? num(cur.score) : ''; return; } }
  let error;
  if(score == null && !(cur && cur.fav)){
    if(!cur) return;
    ({ error } = await sb.from('track_ratings').delete().eq('user_id', uid).eq('album_id', a.id).eq('position', pos));
    if(!error) T.ratings = T.ratings.filter(r => r !== cur);
  } else {
    const row = {user_id:uid, album_id:a.id, position:pos, score, fav:!!(cur && cur.fav)};
    let data; ({ data, error } = await sb.from('track_ratings').upsert(row, {onConflict:'user_id,album_id,position'}).select().single());
    if(!error){ const nr = {...data, position:Number(data.position), score:data.score == null ? null : Number(data.score)}; T.ratings = T.ratings.filter(r => r !== cur).concat(nr); }
  }
  if(error) return toast(errMsg(error), true);
  if(score != null) inp.value = num(score);
  inp.classList.add('saved'); setTimeout(() => inp.classList.remove('saved'), 700);
  refreshTrackRow(a, pos);
}
async function toggleFavTrack(a, pos){
  try { return await toggleFavTrack_(a, pos); }
  catch(e){ console.error(e); toast('Nie udało się zapisać - sprawdź internet i spróbuj jeszcze raz', true); }
}
async function toggleFavTrack_(a, pos){
  const T = await trackData(a), uid = S.user.id; if(!T || T.state !== 'ok') throw new Error('brak tracklisty');
  const mine = T.ratings.filter(r => r.user_id === uid);
  const cur = mine.find(r => r.position === pos), on = !(cur && cur.fav);
  const rows = [];
  if(on) for(const r of mine) if(r.fav && r.position !== pos) rows.push({user_id:uid, album_id:a.id, position:r.position, score:r.score, fav:false});
  rows.push({user_id:uid, album_id:a.id, position:pos, score:cur ? cur.score : null, fav:on});
  const { data, error } = await sb.from('track_ratings').upsert(rows, {onConflict:'user_id,album_id,position'}).select();
  if(error) return toast(errMsg(error), true);
  for(const d of data){ const nr = {...d, position:Number(d.position), score:d.score == null ? null : Number(d.score)};
    T.ratings = T.ratings.filter(r => !(r.user_id === uid && r.position === nr.position)).concat(nr); }
  // wiersz tylko z gwiazdką (bez oceny) po odznaczeniu - usuń
  if(!on && cur && cur.score == null){ await sb.from('track_ratings').delete().eq('user_id', uid).eq('album_id', a.id).eq('position', pos);
    T.ratings = T.ratings.filter(r => !(r.user_id === uid && r.position === pos)); }
  refreshTrackRow(a, pos);
  if(on) toast('Ulubiony utwór: ' + (T.tracks.find(t => t.position === pos) || {}).title);
}

/* ----- losowanie ----- */
function randomPool(){
  const R = S.rand, uid = S.user.id, from = R.from ? +R.from : null, to = R.to ? +R.to : null;
  return [...S.albums.values()].filter(a => {
    if(!kindOk(a, R.kind)) return false;
    if(from != null && !(a.year && a.year >= from)) return false;
    if(to != null && !(a.year && a.year <= to)) return false;
    if(R.src === 'unrated') return !myRating(a.id);
    if(R.src === 'listen') return inListen(a.id);
    if(R.src === 'rec'){
      if(myRating(a.id)) return false;
      const o = (S.byAlbum.get(a.id) || []).filter(r => r.user_id !== uid && !isHidden(r));
      return o.length > 0 && o.reduce((s, r) => s + r.score, 0) / o.length >= R.min;
    }
    return true;
  });
}

/* ----- import ----- */
const TYPE_MAP = {lp:'LP', album:'LP', soundtrack:'Inne', other:'Inne', inne:'Inne', ep:'EP', mixtape:'Mixtape', compilation:'Kompilacja', kompilacja:'Kompilacja', live:'Live', single:'Singiel', singiel:'Singiel', reissue:'LP'};
function parseImport(text){
  const lines = text.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim());
  if(!lines.length) return [];
  // wykryj separator (tabulator, średnik, przecinek) poza cudzysłowami
  const count = (l, d) => { let n = 0, q = false; for(const ch of l){ if(ch === '"') q = !q; else if(!q && ch === d) n++; } return n; };
  const first = lines[0];
  const delim = count(first, '\t') ? '\t' : count(first, ';') >= count(first, ',') && count(first, ';') ? ';' : count(first, ',') ? ',' : ';';
  const split = l => { const out = []; let cur = '', q = false;
    for(let i = 0; i < l.length; i++){ const ch = l[i];
      if(q){ if(ch === '"'){ if(l[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
      else if(ch === '"') q = true; else if(ch === delim){ out.push(cur.trim()); cur = ''; } else cur += ch; }
    out.push(cur.trim()); return out; };
  let idx = null;
  const head = split(lines[0]).map(norm);
  const find = names => head.findIndex(h => names.includes(h));
  if(find(['artist','wykonawca','artysta']) >= 0 && find(['album','tytuł','tytul','title']) >= 0){
    idx = {artist:find(['artist','wykonawca','artysta']), title:find(['album','tytuł','tytul','title']), year:find(['year','rok']),
           type:find(['type','typ']), score:find(['rating','ocena','score'])};
    lines.shift();
  }
  return lines.map((l, n) => {
    const c = split(l);
    let artist, title, year = null, type = 'LP', score = null;
    if(idx){
      artist = c[idx.artist]; title = c[idx.title];
      if(idx.year >= 0) year = parseInt(c[idx.year]) || null;
      if(idx.type >= 0 && c[idx.type]) type = TYPE_MAP[norm(c[idx.type])] || 'Inne';
      if(idx.score >= 0) score = parseScore(c[idx.score]);
    } else {
      artist = c[0]; title = c[1];
      for(let i = 2; i < c.length; i++){
        const v = c[i];
        if(year == null && /^(19|20)\d\d$/.test(v)){ year = +v; continue; }
        if(TYPE_MAP[norm(v)]){ type = TYPE_MAP[norm(v)]; continue; }
        if(score == null && /^\d{1,3}([.,]\d)?$/.test(v) && parseScore(v) != null){ score = parseScore(v); }
      }
    }
    const ok = artist && title && score != null;
    const ex = ok ? findAlbum(artist, title) : null;
    return {n:n + 1, artist, title, year, type, score, ok, ex};
  });
}

        await sleep(250);

    sp.style.display = 'none'; go.disabled = !tlTodo().length; drawTlList(true);
  };
  document.getElementById('tlStop').onclick = () => { tlStop = true; };
}
async function runImport(rows, btn){
  const st = document.getElementById('ist'), overwrite = document.getElementById('iov').checked;
  btn.disabled = true;
  try {
    st.textContent = 'Odświeżam dane…'; await loadData();
    // 1. nowe albumy
    const need = new Map();
    for(const r of rows){ const k = keyOf(r.artist, r.title); if(!findAlbum(r.artist, r.title) && !need.has(k)) need.set(k, {artist:r.artist, title:r.title, year:r.year, type:r.type}); }
    const toAdd = [...need.values()];
    for(let i = 0; i < toAdd.length; i += 100){
      st.textContent = `Dodaję albumy ${Math.min(i + 100, toAdd.length)}/${toAdd.length}…`;
      const chunk = toAdd.slice(i, i + 100);
      const { data, error } = await sb.from('albums').insert(chunk).select();
      if(!error){ data.forEach(d => S.albums.set(Number(d.id), {...d, id:Number(d.id)})); continue; }
      for(const one of chunk){ // ktoś mógł dodać w międzyczasie - po jednym
        const r = await sb.from('albums').insert(one).select().single();
        if(!r.error) S.albums.set(Number(r.data.id), {...r.data, id:Number(r.data.id)});
      }
      await loadData();
    }
    // 2. oceny
    const ratings = new Map();
    for(const r of rows){ const a = findAlbum(r.artist, r.title); if(!a) continue;
      if(!overwrite && myRating(a.id)) continue;
      ratings.set(a.id, {album_id:a.id, user_id:S.user.id, score:r.score}); }
    const list = [...ratings.values()];
    let saved = 0;
    for(let i = 0; i < list.length; i += 200){
      st.textContent = `Zapisuję oceny ${Math.min(i + 200, list.length)}/${list.length}…`;
      const { data, error } = await sb.from('ratings').upsert(list.slice(i, i + 200), {onConflict:'album_id,user_id'}).select();
      if(error) throw error;
      saved += data.length;
    }
    await loadData();
    st.innerHTML = `<span class="ok">Gotowe: ${toAdd.length} ${pl(toAdd.length,'nowy album','nowe albumy','nowych albumów')}, ${saved} ${pl(saved,'zapisana ocena','zapisane oceny','zapisanych ocen')}.</span>`;
    toast('Import zakończony');
  } catch(e){ st.innerHTML = `<span class="err">Błąd: ${esc(errMsg(e))}</span>`; btn.disabled = false; }
}

async function init(){
  if(!window.supabase || CONFIG.SUPABASE_URL.includes('TWOJ-PROJEKT')){
    app.innerHTML = `<div class="card login"><h1>Prawie gotowe</h1><p>Brakuje pliku <code>config.js</code> obok <code>index.html</code> albo nie ma w nim adresu i klucza Supabase.</p></div>`;
    return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
    auth:{persistSession:true, autoRefreshToken:true, lock:async (name, timeout, fn) => fn()}  // bez blokady przeglądarki - nie zawiesza zapytań po powrocie do karty
  });
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ S.user = session.user; app.innerHTML = '<div class="loading">Ładowanie ocen…</div>'; await safeLoad(); initSeen(); }
  render();
  sb.auth.onAuthStateChange((ev, session) => { if(ev === 'SIGNED_OUT' && S.user){ S.user = null; render(); } });
  window.addEventListener('hashchange', render);
  // po powrocie do karty odśwież dane (tylko na stronach bez formularzy)
  document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState !== 'visible' || !S.user || Date.now() - S.loadedAt < 120000) return;
    const p = route().page; await safeLoad();
    if(['start','aktywnosc','ranking','lata','osoby','osoba','statystyki','wykonawca'].includes(p) && route().page === p) render();
    if(p === 'album' && route().page === 'album'){ const a = S.albums.get(Number(route().arg));
      if(a && S.tr[a.id] && S.tr[a.id].state === 'ok' && !S.tr[a.id].edit){ await loadTracks(a.id, true); refreshTrackRow(a, 0); } }
  });
}
