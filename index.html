<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nasze oceny</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#eceef2" id="tc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oceny">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('oceny_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
function syncThemeColor(){var d=document.documentElement.dataset.theme,dark=d?d==='dark':matchMedia('(prefers-color-scheme: dark)').matches,m=document.getElementById('tc');if(m)m.content=dark?'#0f1114':'#eceef2';}
syncThemeColor();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncThemeColor);}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --bg:#eceef2;--card:#ffffff;--text:#16181d;--muted:#666c78;--line:#dde0e6;--soft:#f4f5f8;--raise:#ffffff;
  --accent:#1f8a3b;--accent-ink:#ffffff;--accent-soft:rgba(31,138,59,.1);
  --g:#3fa64d;--y:#dcae1d;--r:#df5235;--none:#b3b7c0;--focus:#1f8a3b;
  --gt:#22813a;--yt:#9a7300;--rt:#c23a1d;--yk:#2e2300;
  --shadow:0 1px 0 rgba(22,24,29,.04),0 6px 20px -8px rgba(22,24,29,.12);
  --navbg:rgba(255,255,255,.78);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0f1114;--card:#181b20;--text:#e9ebef;--muted:#9097a3;--line:#2a2f37;--soft:#1f2329;--raise:#22262d;
  --accent:#3fbf60;--accent-ink:#0b1a0f;--accent-soft:rgba(63,191,96,.14);--none:#4a4f58;--focus:#3fbf60;
  --shadow:0 1px 0 rgba(0,0,0,.3);--navbg:rgba(15,17,20,.78);
  --gt:#4cc35e;--yt:#e8bb2a;--rt:#f0674a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --bg:#0f1114;--card:#181b20;--text:#e9ebef;--muted:#9097a3;--line:#2a2f37;--soft:#1f2329;--raise:#22262d;
  --accent:#3fbf60;--accent-ink:#0b1a0f;--accent-soft:rgba(63,191,96,.14);--none:#4a4f58;--focus:#3fbf60;
  --shadow:0 1px 0 rgba(0,0,0,.3);--navbg:rgba(15,17,20,.78);
  --gt:#4cc35e;--yt:#e8bb2a;--rt:#f0674a;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);font-optical-sizing:auto;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:color-mix(in srgb,var(--line),var(--text) 18%)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--accent-soft)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--raise);padding:8px 14px;white-space:nowrap;font-weight:600;transition:background-color .15s,border-color .15s,transform .1s,color .15s}
button:hover:not(:disabled){border-color:color-mix(in srgb,var(--line),var(--text) 25%)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn-p:hover:not(:disabled){border-color:var(--accent);filter:brightness(1.06)}
.btn-d{color:var(--r);border-color:color-mix(in srgb,var(--r),transparent 50%);background:transparent}
.btn-d.armed{background:var(--r);border-color:var(--r);color:#fff}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:600}

/* nav */
.nav{position:sticky;top:0;z-index:10;background:var(--navbg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:58px}
.brand{font-weight:800;letter-spacing:-.3px;font-size:19px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand img{width:26px;height:26px;border-radius:7px}
.brand b{color:var(--accent)}
.links{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{padding:7px 8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;transition:color .15s,background-color .15s}
@media (max-width:1300px){.links a{padding:7px 7px;font-size:13.5px}.nav-in{gap:10px}}
@media (max-width:1120px){.links a{padding:6px 5px;font-size:13px}.me .hide-m{display:none}}
@media (min-width:721px) and (max-width:960px){.brand span{display:none}.links a{padding:6px 4px;font-size:12.5px}.nav-in{gap:8px}}
.links a.on{color:var(--text);background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.links a:hover{color:var(--text)}
.me{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.meav{display:flex;align-items:center;gap:8px;padding:2px 2px 2px 10px;border-radius:999px;border:1px solid transparent;transition:border-color .15s,background-color .15s}
.meav:hover,.meav.on{border-color:var(--line);background:var(--raise)}
.meav .nm{max-width:110px;overflow:hidden;text-overflow:ellipsis}
.sbox{position:relative;display:flex;align-items:center;gap:6px;width:230px;height:34px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--muted);transition:border-color .15s,box-shadow .15s}
.sbox:focus-within{border-color:color-mix(in srgb,var(--line),var(--g) 60%);box-shadow:0 0 0 3px color-mix(in srgb,var(--g),transparent 82%)}
.sbox svg{flex:none}
.sbox input{border:none;background:none;padding:0;height:100%;font-size:13.5px;min-width:0;flex:1;box-shadow:none;color:var(--text);outline:none}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox kbd{font:600 11px/1 inherit;border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--muted)}
.sbox:focus-within kbd{display:none}
.sres{position:absolute;top:calc(100% + 8px);right:0;width:420px;max-height:min(70vh,560px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.25);padding:6px;z-index:60;white-space:normal;overscroll-behavior:contain}
.sgrp+.sgrp{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.sgrp .sh{font-size:12px;font-weight:700;color:var(--muted);padding:6px 8px 4px}
a.sit{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;color:var(--text);font-weight:500}
a.sit:hover,a.sit.act{background:var(--soft)}
a.sit .st{display:flex;flex-direction:column;min-width:0;flex:1}
a.sit .st b,a.sit .st small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.sit .st b{font-size:14px}
a.sit .st small{color:var(--muted);font-size:12.5px}
a.sit mark{background:color-mix(in srgb,var(--g),transparent 75%);color:inherit;border-radius:3px;padding:0 1px}
.sic{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--soft);color:var(--muted)}
.sempty{padding:18px 12px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.me .sbtn{display:none;cursor:pointer;padding:0}.sbtn svg{flex:none}
.sov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-start;padding:env(safe-area-inset-top) 0 0}
.sov-in{background:var(--bg);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:0 0 16px 16px;box-shadow:0 16px 40px rgba(0,0,0,.3)}
.sov-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sov-h .sbox{flex:1;width:auto;height:42px}
.sov-h .sbox input{font-size:16px}
.sov-r{overflow:auto;padding:6px 8px calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain}
html.noscroll{overflow:hidden}
@media (max-width:1180px){.nav-in>.me>.sbox{display:none}.me .sbtn{display:inline-flex}}
@media (max-width:720px){.sov{background:none}.sov-in{height:100%;border-radius:0;width:100%}.meav{padding-left:8px}.meav .nm{max-width:80px}.me{gap:6px}}
@media (max-width:380px){.meav .nm{display:none}}
.me a{font-weight:600}
.me button{padding:6px 10px;font-size:13px}
.me .ico{width:34px;height:32px;padding:0;text-align:center;font-size:15px;line-height:1}
.ico-l{display:inline-flex;align-items:center;justify-content:center;width:34px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--muted);transition:color .15s,border-color .15s}
.bell{position:relative}
.bell .nb{position:absolute;top:-6px;right:-7px;margin:0;box-shadow:0 0 0 2px var(--card)}
.ico-b{width:36px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ico-b:hover{color:var(--text)}
.ico-l:hover,.ico-l.on{color:var(--text);border-color:color-mix(in srgb,var(--line),var(--text) 25%)}
/* iPhone powiększa stronę przy polach z czcionką < 16 px - na dotykowych ekranach zawsze min. 16 px */
@media (hover:none) and (pointer:coarse){input,select,textarea{font-size:max(16px,1em)}}

/* dolny pasek zakładek na telefonie */
.tabbar,.sheet-bg{display:none}
@media (max-width:720px){
  .nav-in{height:54px;padding:0 14px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  .nav .links,.nav .me .hide-m{display:none}
  .me{margin-left:auto}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom))!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);
    -webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 3px;border:none;background:none;border-radius:10px;
    color:var(--muted);font-size:11px;font-weight:600;position:relative;-webkit-tap-highlight-color:transparent}
  .tabbar svg{width:24px;height:24px}
  .tabbar .on{color:var(--accent)}
  .tabbar .nb{position:absolute;top:0;left:calc(50% + 6px);margin:0}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom))!important}
  .sheet-bg{display:block;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .sheet-bg.open .sheet{transform:none}
  .sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
  .sheet-g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .sheet-g a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:14px;background:var(--soft);font-size:13px;font-weight:600}
  .sheet-g a.on{background:var(--accent-soft);color:var(--accent)}
  .sheet-g svg{width:24px;height:24px}
  .sheet-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px;font-weight:600}
}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{transition:none}}

main{max-width:1400px;margin:0 auto;padding:26px 24px 64px}
main.narrow{max-width:1140px}
@media (max-width:640px){main{padding:22px 16px 64px}}
h1{font-size:32px;line-height:1.1;margin:0 0 6px;letter-spacing:-.8px;font-weight:800}
h2{font-size:17px;letter-spacing:-.2px;color:var(--text);margin:0 0 12px;font-weight:700}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.err{color:var(--r);font-size:14px;margin-top:8px}
.ok{color:var(--accent);font-size:14px;margin-top:8px}

/* score badge */
.score{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 7px;border-radius:8px;color:#fff;font-weight:800;letter-spacing:-.3px;text-shadow:0 1px 1px rgba(0,0,0,.12);font-variant-numeric:tabular-nums;font-size:15px}
.score.big{min-width:54px;height:38px;font-size:19px;border-radius:9px}
.score.sm{min-width:34px;height:24px;font-size:13px;border-radius:6px}

/* cover */
.cover{position:relative;display:inline-block;flex:none;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,#8f96a3 0%,#4d535e 100%);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 0 0 1px rgba(0,0,0,.06)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover i{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:800;opacity:.85}
.cover.noimg i{display:flex}
.c48{width:48px;height:48px}.c48 i{font-size:18px}
.c64{width:64px;height:64px}.c64 i{font-size:24px}
.cfull{width:100%;aspect-ratio:1;border-radius:8px}.cfull i{font-size:42px}
.c260{width:260px;height:260px;border-radius:10px}.c260 i{font-size:80px}
@media (max-width:640px){.c260{width:100%;height:auto;aspect-ratio:1}}

/* filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:0 0 14px}
.filters label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-weight:600}
.filters select,.filters input{width:auto;min-width:130px;padding:6px 9px}
.filters input[type=search]{min-width:220px}
.filters input[type=checkbox]{min-width:0;width:16px;height:16px}
.bulkbar{position:sticky;bottom:0;background:var(--card);padding:12px 0 4px;margin-top:6px;border-top:1px solid var(--line)}

/* ranking rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:40px 64px 1fr auto;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--soft)}
.rk{font-weight:800;font-size:18px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.row.top1 .rk{color:#d4a20b}.row.top2 .rk{color:#9097a3}.row.top3 .rk{color:#b87333}
.meta{min-width:0;display:flex;flex-direction:column}
.meta b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--text);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--muted);font-size:12.5px}
.mrow .meta small{font-size:10px;line-height:1.2;margin-top:1px;opacity:.75;font-weight:500}
.sc{display:flex;flex-direction:column;align-items:center;gap:2px}
.sc small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.row .sc{gap:5px;width:84px}
.mypill{display:inline-flex;align-items:center;justify-content:center;gap:3px;height:18px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.mypill svg{flex:none}
.rk{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.mv{display:block;font-size:10px;font-weight:800;letter-spacing:-.2px;margin-top:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mv.up{color:var(--gt)}.mv.dn{color:var(--rt)}
.mv.new{color:var(--accent);font-size:8.5px;text-transform:uppercase;letter-spacing:.2px}
.scm{display:inline-flex;flex-direction:column;align-items:center;gap:5px;width:84px;flex:none}
@media (max-width:560px){.mrow .r2:has(.scm) .grp{display:none}.mrow .scm{width:80px}.mrow .scm .mypill{padding:0 5px}}
.mypill.no{font-weight:600;color:var(--muted);background:none}
.mine{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.mine b{color:var(--text)}
@media (max-width:640px){.row{grid-template-columns:28px 48px 1fr auto;gap:10px;padding:9px 10px}.row .mine{display:none}.row .cover{width:48px;height:48px}.rk{font-size:15px}}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:18px}
@media (max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .t{font-weight:700;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .a{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cw{position:relative}
.tile .cw{line-height:0;margin-bottom:3px}.tile .cw .cover{display:block}
.tile .cw .score{position:absolute;right:0;bottom:0;border-radius:10px 0 8px 0;box-shadow:none;padding:6px 10px 5px 11px;font-size:14px;line-height:1.2;min-width:42px;height:auto}
.tile:hover .t{text-decoration:underline}

/* years */
.years{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ycard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;transition:border-color .15s;padding:12px;box-shadow:var(--shadow)}
.ycard:hover{border-color:var(--accent)}
.ycard .yy{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.ycard .yt{font-size:13px;min-width:0}
.ycard .yt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;transition:border-color .15s,background-color .15s;font-variant-numeric:tabular-nums}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip:hover:not(.on){border-color:color-mix(in srgb,var(--line),var(--text) 30%)}
.chip small{opacity:.7;font-weight:500}

/* album page */
.ahead{display:grid;grid-template-columns:384px 1fr;gap:28px;align-items:start}
@media (max-width:640px){.ahead{grid-template-columns:1fr}}
.sleeve{position:relative;width:260px;height:260px}
.sleeve .cover{position:relative;z-index:1;box-shadow:0 2px 4px rgba(0,0,0,.18),0 18px 40px -16px rgba(0,0,0,.45)}
.disc{position:absolute;top:6px;left:6px;width:248px;height:248px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,#0c0d0f 0 3.2%,var(--lbl) 3.3% 17%,#16171a 17.5% 19%,transparent 19.2%),
    repeating-radial-gradient(circle,#1b1c20 0 1px,#111215 1.4px 3px),#111215;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07);animation:discout 1.1s .25s cubic-bezier(.2,.75,.25,1) forwards}

/* moja ocena - wyraźniej, kiedy już oceniłem */

.rate .mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.rate .mhead h2{margin:0 0 2px}
.rate.rated .mhead .score.big{font-size:30px;min-width:76px;height:56px;padding:0 14px;border-radius:14px}
@media (max-width:820px){.cols .rate{order:-1}}
@keyframes pop{50%{transform:scale(1.3)}}
.listen{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.lk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.lk i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lk .pl{width:18px;height:18px;flex:none}
.lk{padding:5px 12px 5px 6px}
.lk:hover{border-color:var(--text)}
.alink{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.alink:hover{text-decoration-color:currentColor}

/* statystyki */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.tile2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.tile2 .v{font-size:30px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile2 .l{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
@media (max-width:400px){.tile2{padding:13px 12px}.tile2 .l{font-size:12px;letter-spacing:-.1px}}
.tile2 .s{font-size:13px;margin-top:4px;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.sgrid{grid-template-columns:1fr}}
.hist{display:grid;grid-template-columns:62px 40px 1fr;gap:6px 10px;align-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.hist .lb{font-weight:700;text-align:right}
.hist .ct{color:var(--muted);text-align:right}
.hist .br{height:14px;border-radius:3px;min-width:2px}
.hist .br.z{background:var(--line);width:2px}
.hist{grid-template-columns:1fr;gap:2px}
.hrow{display:grid;grid-template-columns:62px 40px 1fr;gap:10px;align-items:center;width:100%;padding:4px 6px;margin:0 -6px;border:none;border-radius:8px;background:none;font:inherit;font-size:13.5px;font-weight:400;text-align:left;color:inherit;cursor:pointer;transition:background-color .15s}
.hrow:hover:not(:disabled),.hrow.on{background:var(--soft)}
.hrow.on .lb{color:var(--accent)}
.hrow:disabled{cursor:default;opacity:1}
.hrow:active:not(:disabled){transform:none}
.hscroll{max-height:420px;overflow:auto;margin:0 -4px;padding:0 4px}
.hitem{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);border-radius:6px}
.hitem:last-child{border-bottom:none}
.hitem:hover{background:var(--soft)}
.hitem .r2{display:flex;align-items:center;gap:8px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vbars i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.vbars b{font-size:11px;color:var(--muted);margin-bottom:3px;font-variant-numeric:tabular-nums}
.vbars small{font-size:11px;color:var(--muted);margin-top:5px}
.srow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.srow:last-child{border-bottom:none}
.srow .n{color:var(--muted);font-weight:700;text-align:right}
.srow small{color:var(--muted)}
.dec{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.dec .br{height:12px;border-radius:3px;background:var(--accent);opacity:.75}
.heat{overflow:auto}
.heat table{border-collapse:separate;border-spacing:4px;width:auto}
.heat th,.heat td{border:none;padding:0;text-align:center}
.heat td a{display:flex;align-items:center;justify-content:center;width:52px;height:38px;border-radius:8px;color:#fff;font-weight:800;font-size:13.5px}
.heat td.mine a{outline:2px solid var(--text);outline-offset:1px}
.heat .self{width:52px;height:38px;border-radius:8px;background:var(--soft)}
.heat th.rh{text-align:right;padding-right:6px;white-space:nowrap;font-size:13.5px;color:var(--text);text-transform:none;letter-spacing:0}
.crow{display:grid;grid-template-columns:48px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:none}
.crow .d{font-size:13px;color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.vs{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.vs .p{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}
.bigpct{font-size:46px;font-weight:800;letter-spacing:-1.5px;color:#fff;border-radius:12px;padding:6px 16px;font-variant-numeric:tabular-nums}
.who-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.who-pick a{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600}
.who-pick a.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.who-pick a.all{padding:5px 12px}
.hero{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.hero{grid-template-columns:110px minmax(0,1fr);gap:14px}}
.hero .cover{width:100%;height:auto;aspect-ratio:1}
.hero .k{font-size:14px;color:var(--accent);font-weight:700}
.hero h2{font-size:26px;color:var(--text);letter-spacing:0;text-transform:none;margin:4px 0}
.p1{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.p1 .who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:6px}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

/* grafika do udostępnienia */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(460px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:14px}
.modal .pv{overflow:auto;border-radius:12px;background:var(--soft);min-height:120px;display:flex;align-items:flex-start;justify-content:center}
.modal .pv img{width:100%;display:block;border-radius:12px}
.modal .btns{justify-content:center}

/* profil */
.phead{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.phead h1{margin:0}
.pname{display:flex;align-items:center;gap:6px}
.pname .gear{margin-top:0}
.pname .gear svg{width:22px;height:22px}
.lfml b{font-weight:700;color:var(--text)}
.lfm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px;font-size:13.5px}
.lfml{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted)}
.lfml:hover{color:var(--text)}
.lfmnow{display:inline;min-width:0;line-height:1.5}
.lfmnow .eq{margin-right:6px;vertical-align:-1px}
.lfmnow a{color:inherit}
.lfmnow.live{color:var(--gt);font-weight:600}
.lfmnow.live b{color:var(--text)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{width:3px;background:var(--g);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:9px}}
.pnow{color:var(--gt)!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap!important}
.pnow:empty{display:none}
.lfm:has(> [data-listen]:empty){display:none}
.lsnalb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:-4px 0 10px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);font-size:13.5px;color:var(--gt)}
.lsnhome h2{display:flex;align-items:center;gap:8px}
.lsnhome .eq{height:14px}
.lsnrow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;color:inherit;border-bottom:1px solid var(--line)}
.lsnrow:last-child{border-bottom:none;padding-bottom:0}
.lsnrow:hover .lsnt>b{text-decoration:underline}
.lsnt{min-width:0;display:flex;flex-direction:column;gap:1px}
.lsnt>b,.lsnt>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsnt>span{color:var(--muted);font-size:13.5px}
.lsnt small{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);margin-top:3px}
.lsnt small b{color:var(--text);font-weight:600}
.lsnalb a{display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.pstats{margin-left:auto;display:flex;gap:30px;text-align:right}
.pstats .v{font-size:46px;font-weight:800;letter-spacing:-1.6px;line-height:1;font-variant-numeric:tabular-nums}
.pstats .l{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.pstats>a{color:inherit;border-radius:12px;padding:4px 8px;margin:-4px -8px;transition:background-color .15s}
.pstats>a:hover{background:var(--soft)}
.pstats>a:hover .l{color:var(--text)}
@media (max-width:640px){.pstats{margin-left:0;width:100%;justify-content:flex-start;text-align:left;gap:26px}.pstats .v{font-size:38px}}
.hmain>*,.side>*,.prow>*,.home>*{min-width:0}
.hx{max-width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:132px;gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.hx .tile{scroll-snap-align:start}
@media (max-width:640px){.hx{grid-auto-columns:116px}}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start;margin-top:18px}
@media (max-width:900px){.prow{grid-template-columns:1fr}}

/* tracklista */
.trk{margin-top:18px}
.trh,.trw{display:grid;grid-template-columns:28px minmax(0,1fr) 72px 36px 78px;column-gap:22px;align-items:center}
.trh{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 0 6px;border-bottom:1px solid var(--line)}
.trh span:nth-child(n+3){text-align:center}
.trw{padding:7px 0;border-bottom:1px solid var(--line)}
.trw:last-of-type{border-bottom:none}
.trw .no{color:var(--muted);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.trw .tt{min-width:0}
.trw .tt b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trw .tt small{color:var(--muted);font-size:12px}
.trw.skip .tt b{color:var(--muted);font-weight:500}
.trw.best .tt b::after{content:' 👑';font-size:13px}
.trw .ga{display:flex;flex-direction:column;align-items:center;gap:1px}
.trw .ga small{font-size:11px;color:var(--muted);white-space:nowrap}
.star{border:none;background:none;padding:2px;font-size:20px;line-height:1;color:var(--line);border-radius:6px}
.star.on{color:#f5b301}
.star:hover{color:#f5b301;border:none}
:root{--tin-bg:#ffffff;--tin-bd:#cfd3da;--tin-tx:#16181d;--tin-ph:#9aa0aa;--tin-g:#2b8f3a;--tin-y:#b88a00;--tin-r:#cf4426}
:root[data-theme=dark]{--tin-bg:#2c3038;--tin-bd:#3b4049;--tin-tx:#e9ebef;--tin-ph:#727884;--tin-g:#4cc05c;--tin-y:#e6b92a;--tin-r:#f06a4d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--tin-bg:#2c3038;--tin-bd:#3b4049;--tin-tx:#e9ebef;--tin-ph:#727884;--tin-g:#4cc05c;--tin-y:#e6b92a;--tin-r:#f06a4d}}
.tin{text-align:center;font-weight:800;font-size:16px;padding:6px 4px;font-variant-numeric:tabular-nums;background:var(--tin-bg)!important;border-color:var(--tin-bd);color:var(--tin-tx)}
.tin.sg{color:var(--tin-g)}.tin.sy{color:var(--tin-y)}.tin.sr{color:var(--tin-r)}
.tin::placeholder{color:var(--tin-ph)}
.tin.saved{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gab,.rbtn{border:none;background:none;padding:0;border-radius:8px;line-height:0;cursor:pointer}
/* średnia grupy w trackliście: sama kolorowa liczba */
.gab.gnum{font-weight:800;font-size:18px;letter-spacing:-.4px;line-height:1.15;padding:1px 6px;margin-bottom:1px;font-variant-numeric:tabular-nums;font-family:inherit}
.gab.gnum:hover{background:var(--soft)}
.trw .ga small{margin-top:1px}
/* Twoja ocena: kolorowy pasek z lewej */
.tin{border-left-width:4px!important}
.tin.sg{border-left-color:var(--g)!important}.tin.sy{border-left-color:var(--y)!important}.tin.sr{border-left-color:var(--r)!important}
.gab:hover .score,.rbtn:hover .score{filter:brightness(1.1);box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--text),transparent 70%)}
.rbtn.on .score{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--text)}
.mvpop{min-width:0;max-width:260px;padding:10px 12px}
.mvpop .mvt{font-weight:800;font-size:14px}.mvpop .mvt.up{color:var(--gt)}.mvpop .mvt.dn{color:var(--rt)}.mvpop .mvt.new{color:var(--accent)}
.mvpop .mvw{font-size:12.5px;color:var(--muted);margin-top:3px}
.mv[data-tip]{cursor:pointer;padding:3px 4px;margin:0 -4px -3px;border-radius:5px}
.mv[data-tip]:hover{background:var(--soft)}
.tpop{position:fixed;z-index:70;min-width:220px;max-width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:8px}
.tpop .tph{font-weight:700;font-size:13.5px;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpop a{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;font-size:14px}
.tpop a:hover{background:var(--soft)}
.tpop.wide{width:min(340px,calc(100vw - 16px));max-width:none}
.tpop .tph a.link{display:inline!important;grid-template-columns:none}
.fi .tpb{cursor:pointer;line-height:0;border-radius:7px}
.fi .tpb:hover .score{filter:brightness(1.1);box-shadow:0 0 0 2px var(--card,#fff)}
.ps-tiles{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.ps-tiles .s a{color:inherit;font-weight:600}
.ps-tiles .s a:hover{text-decoration:underline}
.ps-grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.ps-grid2>*{min-width:0;margin:0!important}
.ps>.card{margin-top:18px}
.ps-leg{display:flex;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.ps-leg span{display:inline-flex;align-items:center;gap:6px}
.ps-leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.ps-leg i.gr{background:none;border:2px solid var(--none)}
.ps-cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;height:190px;align-items:end;padding-top:6px}
.ps-cols.t{height:150px}
.ps-col{display:flex;flex-direction:column;align-items:stretch;height:100%;min-width:0;cursor:default}
.ps-col:hover .ps-bars{background:var(--soft)}
.ps-bars{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-radius:5px;border-bottom:1px solid var(--line)}
.ps-bars span{display:block;width:40%;max-width:52px;border-radius:4px 4px 0 0;min-height:0}
.ps-cols.t .ps-bars span{width:70%;max-width:34px}
.ps-bars span.gr{background:none;border:2px solid var(--none);border-bottom:none;box-sizing:border-box}
.ps-col small{font-size:11px;color:var(--muted);text-align:center;height:16px;line-height:16px;margin-top:4px;white-space:nowrap;align-self:center}
.ps-two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.ps-two>div{min-width:0}
.ps-sub{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.ps-xl{display:grid;grid-template-columns:repeat(12,1fr);margin-top:4px}
.ps-xl small{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
.ps-line{position:relative;height:150px;border-bottom:1px solid var(--line);margin:0 26px 0 0}
.ps-line svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ps-line .dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--card)}
.ps-yl{position:absolute;right:-26px;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.ps-gl{position:absolute;left:2px;transform:translateY(-120%);font-size:11px;color:var(--muted)}
.ps-row{display:grid;grid-template-columns:minmax(90px,30%) minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:7px 6px;border-radius:9px;color:inherit}
a.ps-row[href]:hover{background:var(--soft)}
.ps-row .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.ps-row .nm small{color:var(--muted);font-weight:500;margin-left:4px}
.ps-row .bar{position:relative;height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.ps-row .bar>span{display:block;height:100%;background:var(--accent);border-radius:4px;opacity:.85}
.ps-row .ps-n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.ps-pct{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.ps-pct small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.ps-orow{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:9px;color:inherit}
.ps-orow+.ps-orow{border-top:1px solid var(--line)}
.ps-orow:hover{background:var(--soft)}
.ps-orow .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.ps-orow .meta b,.ps-orow .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-orow .meta b{font-size:14px}.ps-orow .meta span{font-size:13px;color:var(--muted)}
.ps-o{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;margin-left:auto}
.ps-o small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.ps-d{font-weight:800;font-size:14px;min-width:42px;text-align:center;padding:4px 6px;border-radius:8px}
.ps-d.up{color:var(--g);background:color-mix(in srgb,var(--g) 15%,transparent)}
.ps-d.dn{color:var(--r);background:color-mix(in srgb,var(--r) 15%,transparent)}
.ps-seg{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.ps-seg span{display:block;min-width:4px}
@media (max-width:760px){.ps-grid2,.ps-two{grid-template-columns:1fr}.ps-cols{height:160px}}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.pgrid>*{min-width:0}
.pside{display:flex;flex-direction:column;gap:18px}
.pside .card{margin:0}
.pside h2{font-size:16px;margin:0 0 10px}
.pnums{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.pnums div{display:flex;flex-direction:column}
.pnums b{font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.1;font-variant-numeric:tabular-nums}
.pnums span{font-size:12.5px;color:var(--muted)}
.psr{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:9px;color:inherit}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* KONFIGURACJA jest w osobnym pliku config.js (obok index.html) */
const CONFIG = Object.assign({
  SUPABASE_URL: 'https://tebavdikzkdejjrfynqs.supabase.co',
  SUPABASE_KEY: 'sb_publishable_rpuWtPaSEj_IGrCzBi-a9g_AISeAbL0',
  LOGIN_DOMAIN: 'oceny.app',
  SITE_NAME: 'Nasze oceny',
  LASTFM_KEY: '',   // klucz API Last.fm (last.fm/api/account/create) - bez niego na profilach jest tylko link, bez „teraz słucha”
}, window.OCENY_CONFIG || {}); // dane z pliku config.js
/* ===================================================================== */

const TYPES = ['LP','EP','Mixtape','Kompilacja','Live','Singiel','Inne'];
const app = document.getElementById('app');
const top_ = document.getElementById('top');
let sb = null;
const S = {
  user:null, profiles:new Map(), albums:new Map(), ratings:[],
  byAlbum:new Map(), byUser:new Map(), loadedAt:0,
  favs:[], listen:[], weekly:[], missing:false, prevSeen:0, actPrev:null,
  st:{who:'all', kind:'albums', year:new Date().getFullYear()},
  f:{min:2, type:'all', kind:'albums'}, af:{q:'', f:'all', sort:'added', limit:120, kind:'albums'},
  home:{year:new Date().getFullYear(), all:false, edit:false},
  rand:{src:'unrated', from:'', to:'', kind:'albums', min:75, last:null},
};

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => v == null ? '-' : (Math.round(v * 10) / 10).toString().replace('.', ',');
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';
const col = v => v == null ? 'var(--none)' : v >= 70 ? 'var(--g)' : v >= 50 ? 'var(--y)' : 'var(--r)';
// kolor TEKSTU oceny - w jasnym motywie ciemniejszy, żeby był czytelny na białym
const colT = v => v == null ? 'var(--muted)' : v >= 70 ? 'var(--gt)' : v >= 50 ? 'var(--yt)' : 'var(--rt)';
// średnie i oceny pokazujemy w pełnych liczbach (70,5 → 71); kolor według zaokrąglonej wartości
const avgN = v => v == null ? '-' : String(Math.round(v));
const badge = (v, cls = '') => { const c = col(v == null ? v : Math.round(v)); return `<span class="score ${cls}${c === 'var(--y)' ? ' yl' : ''}" style="background:${c}">${avgN(v)}</span>`; };
function pl(n, one, few, many){ const a = Math.abs(n) % 100, b = a % 10;
  return n === 1 ? one : (b >= 2 && b <= 4 && !(a >= 12 && a <= 14)) ? few : many; }
const ocen = n => `${n} ${pl(n,'ocena','oceny','ocen')}`;
const fmtDate = d => d ? new Date(d).toLocaleDateString('pl-PL') : '';
function push(map, k, v){ let a = map.get(k); if(!a){ a = []; map.set(k, a); } a.push(v); }
function parseScore(s){ const v = parseFloat(String(s).trim().replace(',', '.'));
  return isFinite(v) && v >= 0 && v <= 100 ? Math.round(v) : null; } // oceny zawsze w pełnych liczbach: 64,8 → 65
const typeGroup = t => t === 'LP' ? 'LP' : t === 'EP' ? 'EP' : 'Inne';
const norm = s => String(s || '').trim().toLowerCase();
const keyOf = (artist, title) => norm(artist) + '\u0001' + norm(title);
function coverHtml(a, cls = 'c64'){
  const u = safeUrl(a && a.cover_url), ini = esc(((a && a.title) || '?').trim().charAt(0).toUpperCase() || '?');
  return u ? `<span class="cover ${cls}"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg');this.remove()"><i>${ini}</i></span>`
           : `<span class="cover ${cls} noimg"><i>${ini}</i></span>`;
}
const AV_COLORS = ['#e0573a','#2f9e44','#3b7dd8','#9c4fd6','#d6872f','#1f9e98','#d64f8a','#6b7a2f','#5a63d6','#a0522d'];
function avColor(id){ let h = 0; for(const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
function pname(id){ const p = S.profiles.get(id); return p ? (p.display_name || p.username || '?') : '(usunięty)'; }
// zielona kropka = ktoś ma teraz otwartą stronę (przy małych avatarach się nie mieści, więc jej nie ma)
const onDot = size => { const d = Math.max(8, Math.round(size * .3)); return `<i class="ondot" style="width:${d}px;height:${d}px" title="online"></i>`; };
function avatar(id, size = 36){
  const p = S.profiles.get(id), u = safeUrl(p && p.avatar_url);
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px;background:${avColor(id)}`;
  const dot = size >= 22 && isOnline(id) ? onDot(size) : '';
  return u ? `<span class="av" data-av="${esc(id)}" data-s="${size}" style="${st}"><img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer">${dot}</span>`
           : `<span class="av" data-av="${esc(id)}" data-s="${size}" style="${st}">${esc(pname(id).charAt(0).toUpperCase())}${dot}</span>`;
}
// co 2 minuty dociągnij, kto jest online, i popraw kropki na ekranie (bez przerysowywania strony)
/* ---------- „teraz słucha” = ktoś właśnie ocenia piosenki z albumu ---------- */
const LISTEN_MS = 20 * 60 * 1000; // ostatnia oceniona piosenka max 20 min temu
S.listening = new Map();
async function refreshListening(){
  if(!S.user) return;
  const since = new Date(Date.now() - LISTEN_MS).toISOString();
  const [{ data, error }, rr] = await Promise.all([sb.from('track_ratings').select('user_id,album_id,position,updated_at').gt('updated_at', since),
    sb.from('ratings').select('user_id,album_id,updated_at').gt('updated_at', since)]);
  if(error || !data) return;
  S.freshRated = (rr && rr.data || []).map(r => ({user_id:r.user_id, album_id:Number(r.album_id), t:Date.parse(r.updated_at) || 0}));
  const m = new Map();
  for(const r of data){ const t = Date.parse(r.updated_at) || 0, o = m.get(r.user_id);
    if(!o || t > o.at) m.set(r.user_id, {album_id:Number(r.album_id), at:t}); }
  for(const [u, o] of m) o.n = data.filter(r => r.user_id === u && Number(r.album_id) === o.album_id).length;
  S.listening = m; fillListening(true);
}
// kto oceni cały album, przestaje „słuchać” (ocena albumu nowsza niż ostatnia oceniona piosenka)
const ratedAfter = (uid, o) => (S.freshRated || []).some(r => r.user_id === uid && r.album_id === o.album_id && r.t >= o.at)
  || (S.byAlbum.get(o.album_id) || []).some(r => r.user_id === uid && tsOf(r) >= o.at);
const listenOf = uid => { const o = S.listening.get(uid); return o && Date.now() - o.at < LISTEN_MS && S.albums.has(o.album_id) && !ratedAfter(uid, o) ? o : null; };
// wypełnia miejsca oznaczone data-listen (profil, Osoby) i data-listen-album (strona albumu)
function fillListening(again){
  document.querySelectorAll('[data-listen]').forEach(el => { const o = listenOf(el.dataset.listen);
    if(!o){ if(again && el.dataset.lsn){ el.innerHTML = ''; delete el.dataset.lsn; el.classList.remove('lfmnow', 'live'); } return; }
    const a = S.albums.get(o.album_id); el.dataset.lsn = '1';
    if(el.dataset.mode === 'mini'){ el.textContent = '🎧 ' + a.title + ' - ' + a.artist; return; }
    el.classList.add('lfmnow', 'live');
    el.innerHTML = `<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>${el.dataset.listen === S.user.id ? 'Teraz słuchasz' : 'Teraz słucha'}: <a href="#/album/${a.id}"><b>${esc(a.title)}</b> <span class="muted">- ${esc(a.artist)}</span></a>`; });
  // karta na stronie głównej (nad aktywnością) - tylko gdy ktoś czegoś słucha
  const now = [...S.listening.keys()].map(u => ({u, o:listenOf(u)})).filter(x => x.o).sort((x, y) => y.o.at - x.o.at);
  document.querySelectorAll('[data-listen-home]').forEach(el => {
    el.innerHTML = now.length ? `<section class="card lsnhome"><div class="shead"><h2><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>Teraz słuchają</h2></div>
      ${[...now.reduce((m, x) => { const g = m.get(x.o.album_id) || []; g.push(x); return m.set(x.o.album_id, g); }, new Map()).values()].map(g => { const a = S.albums.get(g[0].o.album_id), at = g[0].o.at;
        return `<a class="lsnrow" href="#/album/${a.id}">${coverHtml(a, 'c48')}<span class="lsnt"><b>${esc(a.title)}</b><span>${esc(a.artist)}</span>
          <small>${g.map(({u}) => `${avatar(u, 20)}<b>${u === S.user.id ? 'Ty' : esc(pname(u))}</b>`).join('')}</small></span></a>`; }).join('')}</section>` : ''; });

/* ---------- MusicBrainz / Cover Art Archive ---------- */
function mbType(rg){
  const sec = (rg['secondary-types'] || []).map(s => s.toLowerCase());
  if(sec.includes('compilation')) return 'Kompilacja';
  if(sec.includes('live')) return 'Live';
  if(sec.includes('mixtape/street')) return 'Mixtape';
  const p = (rg['primary-type'] || '').toLowerCase();
  return p === 'ep' ? 'EP' : p === 'single' ? 'Singiel' : 'LP';
}
const mbArtist = rg => (rg['artist-credit'] || []).map(c => (c.name || (c.artist && c.artist.name) || '') + (c.joinphrase || '')).join('');
const mbCover = (id, size = 500) => `https://coverartarchive.org/release-group/${id}/front-${size}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
let mbNext = 0; // MusicBrainz pozwala na ok. 1 zapytanie na sekundę
async function mbSearch(query){
  const url = 'https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=12&query=' + encodeURIComponent(query);
  for(let attempt = 0; attempt < 5; attempt++){
    const wait = mbNext - Date.now(); mbNext = Math.max(Date.now(), mbNext) + 1100;
    if(wait > 0) await sleep(wait);
    let r;
    try { r = await fetch(url, {headers:{Accept:'application/json'}}); }
    catch(e){ await sleep(1500 * (attempt + 1)); continue; }
    if(r.status === 503 || r.status === 429 || r.status >= 500){ mbNext = Date.now() + 2000 * (attempt + 1); continue; }
    if(!r.ok) throw new Error('MusicBrainz nie odpowiada (' + r.status + '). Spróbuj za chwilę.');
    const j = await r.json();
    return (j['release-groups'] || []).map(rg => ({
      id:rg.id, title:rg.title, artist:mbArtist(rg), score:rg.score || 0,
      year:parseInt((rg['first-release-date'] || '').slice(0, 4)) || null, type:mbType(rg)
    }));
  }
  throw new Error('MusicBrainz jest przeciążony. Spróbuj za chwilę.');
}
async function mbGet(path){
  for(let attempt = 0; attempt < 5; attempt++){
    const wait = mbNext - Date.now(); mbNext = Math.max(Date.now(), mbNext) + 1100;
    if(wait > 0) await sleep(wait);
    let r; try { r = await fetch('https://musicbrainz.org/ws/2/' + path, {headers:{Accept:'application/json'}}); } catch(e){ await sleep(1500 * (attempt + 1)); continue; }
    if(r.status === 503 || r.status === 429 || r.status >= 500){ mbNext = Date.now() + 2000 * (attempt + 1); continue; }
    if(!r.ok) throw new Error('MusicBrainz ' + r.status);
    return r.json();
  }
  throw new Error('MusicBrainz jest przeciążony');
}
const luc = s => String(s).replace(/([+\-!(){}\[\]^"~*?:\\\/]|&&|\|\|)/g, '\\$1');
function testImage(url, ms = 15000){
  return new Promise(res => { const i = new Image(); const t = setTimeout(() => { i.src = ''; res(false); }, ms);
    i.onload = () => { clearTimeout(t); res(i.naturalWidth > 10); }; i.onerror = () => { clearTimeout(t); res(false); };
    i.referrerPolicy = 'no-referrer'; i.src = url; });
}
const simp = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '');
const similar = (a, b) => { const x = simp(a), y = simp(b);
  if(!x || !y) return norm(a).replace(/\s+/g, '') === norm(b).replace(/\s+/g, '') && !!norm(a); // np. tytuł „???”
  return x === y || x.includes(y) || y.includes(x); };
// JSONP - Deezer i Apple nie pozwalają na zwykłe zapytania z innej strony, ale obsługują ten sposób
let jsonpN = 0;
function jsonp(url, ms = 12000){
  return new Promise((res, rej) => {
    const cb = '__jp' + (++jsonpN) + '_' + Date.now(), sc = document.createElement('script');
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); rej(new Error('timeout')); }, ms);
    window[cb] = d => { done(); res(d); };
    sc.onerror = () => { done(); rej(new Error('błąd sieci')); };
    sc.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(sc);
  });
}
const dzType = t => t === 'ep' ? 'EP' : t === 'single' ? 'Singiel' : t === 'compile' ? 'Kompilacja' : 'LP';
async function deezerSearch(q){
  const d = await jsonp('https://api.deezer.com/search/album?limit=12&output=jsonp&q=' + encodeURIComponent(q));
  return ((d && d.data) || []).filter(a => a.cover_xl || a.cover_big).map(a => ({
    src:'Deezer', dzId:a.id, nb:a.nb_tracks || 0, title:a.title, artist:(a.artist && a.artist.name) || '', type:dzType(a.record_type), year:null,
    cover:a.cover_xl || a.cover_big, thumb:a.cover_medium || a.cover_xl }));
}
// rok wydania - wyszukiwarka Deezera go nie podaje, trzeba dopytać o szczegóły albumu
async function deezerYear(r){
  if(!r || r.year || !r.dzId) return r;
  try { const d = await jsonp('https://api.deezer.com/album/' + r.dzId + '?output=jsonp', 8000);
    r.year = parseInt(String((d && d.release_date) || '').slice(0, 4)) || null; } catch(e){}
  return r;
}
let itNext = 0; // Apple: ok. 20 zapytań na minutę
async function itunesSearch(q){
  const wait = itNext - Date.now(); itNext = Math.max(Date.now(), itNext) + 3200; if(wait > 0) await sleep(wait);
  const d = await jsonp('https://itunes.apple.com/search?media=music&entity=album&country=PL&limit=12&term=' + encodeURIComponent(q));
  return ((d && d.results) || []).filter(a => a.artworkUrl100).map(a => ({
    src:'Apple Music', itId:a.collectionId, nb:a.trackCount || 0, title:String(a.collectionName || '').replace(/ - (EP|Single)$/i, ''), artist:a.artistName || '',
    type:/ - EP$/i.test(a.collectionName || '') ? 'EP' : / - Single$/i.test(a.collectionName || '') ? 'Singiel' : 'LP',
    year:parseInt(String(a.releaseDate || '').slice(0, 4)) || null,
    cover:a.artworkUrl100.replace(/\/\d+x\d+bb\./, '/600x600bb.'), thumb:a.artworkUrl100 }));
}
const cleanT = t => String(t || '').replace(/\s*[\(\[][^\)\]]*(deluxe|edition|remaster|version|expanded|bonus)[^\)\]]*[\)\]]/ig, '').replace(/ - (EP|Single)$/i, '');
const matches = (r, artist, title) => similar(cleanT(r.title), cleanT(title)) && similar(r.artist, artist);
// wynik: {status:'found', cover, ...} | {status:'none'} | {status:'retry'} (coś nie odpowiedziało - spróbuj ponownie)
async function mbFindCover(artist, title){
  let flaky = false;
  // 1. Deezer
  try {
    let r = (await deezerSearch(`artist:"${artist}" album:"${cleanT(title)}"`)).find(x => matches(x, artist, title));
    if(!r) r = (await deezerSearch(artist + ' ' + cleanT(title))).find(x => matches(x, artist, title));
    if(r){ await deezerYear(r); return {...r, status:'found'}; }
  } catch(e){ flaky = true; }
  // 2. MusicBrainz / Cover Art Archive
  let mbYear = null, mbId = null;
  try {
    let cands = (await mbSearch(`releasegroup:"${luc(title)}" AND artist:"${luc(artist)}"`)).filter(r => r.score >= 80);
    if(!cands.length) cands = (await mbSearch(luc(title) + ' ' + luc(artist))).filter(r => matches(r, artist, title));
    if(cands.length){ mbYear = cands[0].year; mbId = cands[0].id; }
    for(const r of cands.slice(0, 3)){
      for(let t = 0; t < 2; t++){
        if(await testImage(mbCover(r.id, 250))) return {...r, status:'found', cover:mbCover(r.id)};
        flaky = true;
      }
    }
  } catch(e){ flaky = true; }
  // 3. Apple Music
  try {
    const r = (await itunesSearch(artist + ' ' + cleanT(title))).find(x => matches(x, artist, title));
    if(r) return {...r, status:'found', year:r.year || mbYear, id:mbId};
  } catch(e){ flaky = true; }
  return {status:flaky ? 'retry' : 'none', year:mbYear, id:mbId};
}

/* ---------- covers upload ---------- */
function resizeImage(file, max = 700){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Nie udało się przetworzyć obrazka')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('To nie jest obrazek')); };
    img.src = url;
  });
}
function cropSquare(file, size = 320){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('Nie udało się przetworzyć zdjęcia')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('To nie jest obrazek')); };
    img.src = url;
  });
}
async function uploadCover(file){
  const blob = await resizeImage(file);
  const path = `${S.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { error } = await sb.storage.from('covers').upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(error) throw error;
  return sb.storage.from('covers').getPublicUrl(path).data.publicUrl;
}

let trackIdx = null, trackLoading = null;
function loadTrackIdx(){
  if(trackIdx) return Promise.resolve(trackIdx);
  if(S.allTr) return Promise.resolve(trackIdx = S.allTr.tracks);
  return trackLoading || (trackLoading = fetchAll('tracks').then(t => (trackIdx = t)).catch(() => (trackIdx = [])).finally(() => { trackLoading = null; }));
}
function searchMatch(q, hay){
  // każde słowo z zapytania musi wystąpić w tekście; wyżej: dokładnie / od początku
  const toks = norm(q).split(/\s+/).map(simp).filter(Boolean), h = simp(hay);
  if(!toks.length || !toks.every(t => h.includes(t))) return 0;
  const qq = toks.join(''); return h === qq ? 4 : h.startsWith(qq) ? 3 : norm(hay).split(/\s+/).some(w => simp(w).startsWith(toks[0])) ? 2 : 1;
}
function searchAll(q){
  const out = {artists:[], albums:[], songs:[], people:[]};
  if(simp(q).length < 1) return out;
  const arts = new Map();
  for(const a of S.albums.values()){
    const sc = Math.max(searchMatch(q, a.title) * 2, searchMatch(q, a.artist + ' ' + a.title));
    if(sc) out.albums.push({a, sc:sc + (visStats(a.id).n ? 0.5 : 0)});
    for(const p of artistParts(a.artist)){ const k = simp(p); if(!k) continue; const o = arts.get(k) || {name:p, n:0}; o.n++; arts.set(k, o); }
  }
  for(const o of arts.values()){ const sc = searchMatch(q, o.name); if(sc) out.artists.push({...o, sc:sc + Math.min(1, o.n / 10)}); }
  for(const t of trackIdx || []){ const a = S.albums.get(Number(t.album_id)); if(!a) continue;
    const sc = searchMatch(q, t.title); if(sc) out.songs.push({t, a, sc}); }
  for(const p of S.profiles.values()){ const sc = Math.max(searchMatch(q, p.display_name || ''), searchMatch(q, p.username || '')); if(sc) out.people.push({p, sc}); }
  const by = (x, y) => y.sc - x.sc;
  out.artists.sort((x, y) => by(x, y) || y.n - x.n); out.albums.sort((x, y) => by(x, y) || (y.a.year || 0) - (x.a.year || 0));
  out.songs.sort(by); out.people.sort(by);
  return out;
}
function searchHtml(q){
  if(!simp(q)) return `<div class="sempty">Wpisz nazwę albumu, wykonawcy, piosenki albo osoby.</div>`;
  const R = searchAll(q), mark = t => { const toks = norm(q).split(/\s+/).filter(Boolean); let h = esc(t);
    for(const tk of toks.sort((a, b) => b.length - a.length)){ const i = norm(t).indexOf(tk); if(i >= 0 && tk.length > 1){ const raw = esc(t.slice(i, i + tk.length)); h = h.replace(raw, '<mark>' + raw + '</mark>'); } } return h; };
  const sec = (title, items) => items.length ? `<div class="sgrp"><div class="sh">${title}</div>${items.join('')}</div>` : '';
  const html = sec('Wykonawcy', R.artists.slice(0, 4).map(o => `<a class="sit" href="${artistHref(o.name)}"><span class="sic">${esc(o.name.trim()[0] || '?').toUpperCase()}</span><span class="st"><b>${mark(o.name)}</b><small>${o.n} ${pl(o.n,'wydawnictwo','wydawnictwa','wydawnictw')}</small></span></a>`))
    + sec('Albumy', R.albums.slice(0, 7).map(({a}) => { const st = visStats(a.id), my = myRating(a.id);
        return `<a class="sit" href="#/album/${a.id}">${coverHtml(a, 'c40')}<span class="st"><b>${mark(a.title)}</b><small>${mark(a.artist)}${a.year ? ' · ' + a.year : ''}${isSingle(a) ? ' · singiel' : ''}${my ? ' · Twoja: ' + num(my.score) : ''}</small></span>${st.n ? badge(st.avg, 'sm') : ''}</a>`; }))
    + sec('Piosenki', R.songs.slice(0, 6).map(({t, a}) => `<a class="sit" href="#/album/${a.id}" data-song="${t.position}">${coverHtml(a, 'c40')}<span class="st"><b>${mark(t.title)}</b><small>${esc(a.artist)} · ${esc(a.title)}</small></span></a>`))
    + sec('Osoby', R.people.slice(0, 3).map(({p}) => `<a class="sit" href="#/osoba/${p.id}">${avatar(p.id, 40)}<span class="st"><b>${mark(p.display_name || p.username)}</b><small>${ocen((S.byUser.get(p.id) || []).length)}</small></span></a>`));
  return html || `<div class="sempty">Nic nie znaleziono dla „${esc(q)}”.<br><a class="link" href="#/dodaj">Dodaj album do bazy →</a></div>`
    + (!trackIdx ? '' : '');
}

function searchKeys(input, box){

function bindSearch(){

        ${t ? badge(t.st.avg, 'sm') : ''}</a>`;
    }).join('');
    app.innerHTML = `<h1>Rankingi roczne</h1><p class="sub">Najwyżej ${S.f.kind === 'singles' ? 'oceniony singiel' : 'oceniony album'} każdego roku. Kliknij rok, żeby zobaczyć pełny ranking.</p>
      ${rankTabs('lata')}${filtersHtml()}${blindNote()}<div class="years">${cards || '<div class="empty">Brak albumów z rokiem.</div>'}</div>`;
    bindFilters(); return;
  }
  const list = rankList({year:y}), mvs = rankMoves(list, t => rankList({year:y, at:t}));
  app.innerHTML = `<h1>Najlepsze ${S.f.kind === 'singles' ? 'single' : 'albumy'} ${y}</h1><p class="sub">${list.length} ${S.f.kind === 'singles' ? pl(list.length,'oceniony singiel','ocenione single','ocenionych singli') : pl(list.length,'oceniony album','ocenione albumy','ocenionych albumów')}</p>
    <div class="chips">${ys.map(yr => `<a class="chip ${yr === y ? 'on' : ''}" href="#/lata/${yr}">${yr} <small>${years.get(yr)}</small></a>`).join('')}${years.has(y) ? '' : `<span class="chip on">${y} <small>0</small></span>`}</div>
    ${filtersHtml()}${listHtml(list, mvs)}
    ${list.length ? `<p class="note">${moveNote()} Najedź na strzałkę, żeby zobaczyć szczegóły.</p>` : ''}`;
  bindFilters();
}

function viewAlbums(){
  const f = S.af;
  const cnt = [...S.albums.values()].filter(a => kindOk(a, f.kind)).length;
  app.innerHTML = `<h1>${f.kind === 'singles' ? 'Single' : 'Wszystkie albumy'}</h1><p class="sub">${cnt} ${f.kind === 'singles' ? pl(cnt,'singiel','single','singli') : pl(cnt,'album','albumy','albumów')} w bazie</p>
    <div class="filters">
      ${segHtml('akind', f.kind)}
      <label>Szukaj<input type="search" id="aq" value="${esc(f.q)}" placeholder="wykonawca lub tytuł"></label>
      <label>Pokaż<select id="af">${[['all','Wszystkie'],['unrated-me','Nieocenione przeze mnie'],['unrated','Bez żadnej oceny'],['nocover','Bez okładki']].map(([v, l]) => `<option value="${v}" ${f.f === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label>Sortuj<select id="as">${[['added','Ostatnio dodane'],['artist','Wykonawca A-Z'],['year','Rok (najnowsze)'],['avg','Średnia']].map(([v, l]) => `<option value="${v}" ${f.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    </div><div id="agrid"></div>`;
  const draw = () => {
    const q = norm(f.q);
    let l = [...S.albums.values()].filter(a => {
      if(!kindOk(a, f.kind)) return false;
      if(q && !(norm(a.artist).includes(q) || norm(a.title).includes(q))) return false;
      if(f.f === 'unrated-me') return !myRating(a.id);
      if(f.f === 'unrated') return !stats(a.id).n;
      if(f.f === 'nocover') return !safeUrl(a.cover_url);
      return true;
    });
    const cmp = {
      added:(x, y) => (y.created_at || '').localeCompare(x.created_at || '') || y.id - x.id,
      artist:(x, y) => x.artist.localeCompare(y.artist, 'pl') || (x.year || 0) - (y.year || 0),
      year:(x, y) => (y.year || 0) - (x.year || 0) || x.artist.localeCompare(y.artist, 'pl'),
      avg:(x, y) => (visStats(y.id).avg ?? -1) - (visStats(x.id).avg ?? -1),
    }[f.sort];
    l.sort(cmp);
    const shown = l.slice(0, f.limit);
    document.getElementById('agrid').innerHTML = l.length ? `<div class="grid">${shown.map(a => { const st = visStats(a.id), m = myRating(a.id), hd = hiddenAlbum(a.id);
      return `<a class="tile" href="#/album/${a.id}"><div class="cw">${coverHtml(a, 'cfull')}${hd && stats(a.id).n ? lockBadge('sm', a.id) : st.n ? badge(st.avg, 'sm') : ''}</div>
        <div><div class="t">${esc(a.title)}</div><div class="a">${esc(a.artist)}${a.year ? ' · ' + a.year : ''}</div>
        <div class="a">${st.n ? ocen(st.n) : 'brak ocen'}${m ? ' · Ty: ' + num(m.score) : ''}</div></div></a>`; }).join('')}</div>
      ${l.length > shown.length ? `<div style="text-align:center;margin-top:18px"><button id="more">Pokaż więcej (${l.length - shown.length})</button></div>` : ''}`
      : `<div class="list"><div class="empty">Nic nie znaleziono. <a class="link" href="#/dodaj">Dodaj album</a></div></div>`;
    const m = document.getElementById('more'); if(m) m.onclick = () => { f.limit += 240; draw(); };
  };
  bindSeg('akind', v => { f.kind = v; f.limit = 120; render(); });
  document.getElementById('aq').oninput = e => { f.q = e.target.value; f.limit = 120; draw(); };
  document.getElementById('af').onchange = e => { f.f = e.target.value; f.limit = 120; draw(); };
  document.getElementById('as').onchange = e => { f.sort = e.target.value; draw(); };
  draw();
}

      <div class="preview"><span id="fcp">${coverHtml(a, 'c64')}</span>
        <label style="flex:1">albo wgraj plik z komputera / telefonu<input type="file" id="ff" accept="image/*"></label></div>
      ${isNew ? `<label>Twoja ocena (opcjonalnie, 0-100)<input id="fs" inputmode="decimal" placeholder="np. 84"></label>` : ''}
      <input type="hidden" id="fmb" value="${esc(a.mbid || '')}">
      <div class="btns"><button class="btn-p" id="fsave">${isNew ? 'Dodaj album' : 'Zapisz zmiany'}</button>${isNew ? '' : `<a href="#/album/${a.id}"><button type="button">Anuluj</button></a>`}</div>

function bindAlbumForm(a, isNew){
  const $ = id => document.getElementById(id);
  const setPreview = () => { $('fcp').innerHTML = coverHtml({title:$('ft').value || '?', cover_url:$('fc').value.trim()}, 'c64'); };
  $('fc').oninput = setPreview; $('ft').oninput = setPreview;
  $('ff').onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    $('ferr').textContent = ''; $('fcp').innerHTML = '<span class="muted small">Wgrywanie…</span>';
    try { $('fc').value = await uploadCover(file); setPreview(); toast('Okładka wgrana'); }
    catch(err){ $('ferr').textContent = 'Nie udało się wgrać okładki: ' + errMsg(err); setPreview(); }
    e.target.value = '';
  };
  $('mbf').onsubmit = async e => {
    e.preventDefault(); const q = $('mbq').value.trim(); if(!q) return;
    $('mbst').textContent = 'Szukam…'; $('mbres').innerHTML = '';
    try {
      const [mb, dz, it] = await Promise.all([
        mbSearch(q).then(r => r.map(x => ({...x, src:'MusicBrainz', cover:null, thumb:mbCover(x.id, 250)}))).catch(() => []),
        deezerSearch(q).then(l => Promise.all(l.map(deezerYear))).catch(() => []), itunesSearch(q).catch(() => [])]);
      // przeplataj źródła, żeby na górze były najlepsze wyniki z każdego
      const res = []; for(let i = 0; i < 12; i++) for(const l of [dz, mb, it]) if(l[i]) res.push(l[i]);
      $('mbst').textContent = res.length ? 'Kliknij właściwy album:' : 'Nic nie znaleziono - wpisz dane ręcznie.';
      $('mbres').innerHTML = res.map((r, i) => `<button type="button" class="mbitem" data-i="${i}">
        ${coverHtml({title:r.title, cover_url:r.thumb}, 'c48')}
        <span><b>${esc(r.title)}</b><br><span>${esc(r.artist)}</span><br><small>${r.year ?? ''}${r.year ? ' · ' : ''}${esc(r.type)} · ${esc(r.src)}</small></span></button>`).join('');
      $('mbres').querySelectorAll('.mbitem').forEach(b => b.onclick = async () => {
        const r = res[+b.dataset.i];
        $('fa').value = r.artist; $('ft').value = r.title; if(r.year) $('fy').value = r.year; $('fty').value = r.type;
        if(r.src === 'MusicBrainz') $('fmb').value = r.id;
        $('fc').value = ''; $('fcp').innerHTML = '<span class="muted small">Szukam okładki…</span>';
        const u = r.cover || mbCover(r.id);
        if(await testImage(u)){ $('fc').value = u; } else toast('Brak okładki w tym źródle - wybierz inny wynik, wgraj plik lub wklej link', true);
        setPreview();
        const dup = isNew && findAlbum(r.artist, r.title);
        $('ferr').innerHTML = dup ? `Ten album już jest: <a class="link" href="#/album/${dup.id}">przejdź do niego</a>` : '';
      });
    } catch(err){ $('mbst').textContent = err.message; }
  };
  $('af2').onsubmit = async e => {
    e.preventDefault();
    const artist = $('fa').value.trim(), title = $('ft').value.trim();
    const yr = $('fy').value.trim(), year = yr ? parseInt(yr) : null;
    const cover = $('fc').value.trim();
    if(!artist || !title) return $('ferr').textContent = 'Podaj wykonawcę i tytuł.';
    if(yr && !(year >= 1900 && year <= 2100)) return $('ferr').textContent = 'Rok musi być między 1900 a 2100.';
    if(cover && !safeUrl(cover)) return $('ferr').textContent = 'Link do okładki musi zaczynać się od https://';
    let score = null;
    if(isNew && $('fs').value.trim()){ score = parseScore($('fs').value); if(score == null) return $('ferr').textContent = 'Ocena musi być liczbą od 0 do 100.'; }
    const dup = findAlbum(artist, title);
    if(dup && (isNew || dup.id !== a.id)) return $('ferr').innerHTML = `Taki album już jest: <a class="link" href="#/album/${dup.id}">przejdź do niego</a>`;
    const row = {artist, title, year, type:$('fty').value, cover_url:cover || null, mbid:$('fmb').value || null};
    $('fsave').disabled = true;
    const q = isNew ? sb.from('albums').insert(row) : sb.from('albums').update(row).eq('id', a.id);
    const { data, error } = await q.select().single();
    if(error){ $('fsave').disabled = false; return $('ferr').textContent = errMsg(error); }
    const saved = {...data, id:Number(data.id)}; S.albums.set(saved.id, saved);
    if(score != null){
      const r = await sb.from('ratings').upsert({album_id:saved.id, user_id:S.user.id, score}, {onConflict:'album_id,user_id'}).select().single();
      if(r.error) toast('Album dodany, ale ocena nie: ' + errMsg(r.error), true); else upsertLocalRating(r.data);
    }
    toast(isNew ? 'Dodano album' : 'Zapisano zmiany');
    location.hash = '#/album/' + saved.id;
  };
}
function viewAdd(arg){

const dzAlbum = (a, artistName) => ({dzId:a.id, title:a.title, artist:artistName || (a.artist && a.artist.name) || '',
  year:parseInt(String(a.release_date || '').slice(0, 4)) || null, type:dzType(a.record_type), cover:a.cover_xl || a.cover_big || '', thumb:a.cover_medium || a.cover_xl || ''});
// ta sama płyta w kilku wersjach (Deluxe, Remaster…) - zostaw najstarszą
function dedupeEditions(list){
  const m = new Map();
  for(const a of list){ const k = simp(a.artist) + '|' + simp(cleanT(a.title));
    const o = m.get(k); if(!o || (a.year && (!o.year || a.year < o.year)) || (a.year === o.year && a.title.length < o.title.length)) m.set(k, a); }
  return [...m.values()];
}

function bindBulk(box, items, opts, rerender){
  box.querySelectorAll('[data-show]').forEach(c => c.onchange = () => { opts.show[c.dataset.show] = c.checked; rerender(); });
  box.querySelectorAll('input[data-i]').forEach(c => c.onchange = () => { items[+c.dataset.i].checked = c.checked; const sel = items.filter(it => opts.show[it.type] !== false && it.checked && !it.exists).length;
    const b = document.getElementById('bAdd'); b.disabled = !sel; b.textContent = `Dodaj zaznaczone (${sel})`; });
  document.getElementById('bAll').onclick = () => { items.forEach(it => { if(opts.show[it.type] !== false) it.checked = true; }); rerender(); };
  document.getElementById('bNone').onclick = () => { items.forEach(it => it.checked = false); rerender(); };
  document.getElementById('bAdd').onclick = async () => {
    const b = document.getElementById('bAdd'), st = document.getElementById('bSt'); b.disabled = true;
    const todo = items.filter(it => opts.show[it.type] !== false && it.checked && !it.exists && !findAlbum(it.artist, it.title));
    try {
      for(let i = 0; i < todo.length; i++){ if(!todo[i].year){ st.textContent = `Sprawdzam lata wydania ${i + 1}/${todo.length}…`; await deezerYear(todo[i]); await sleep(130); } }
      let added = 0;
      for(let i = 0; i < todo.length; i += 50){
        st.textContent = `Dodaję ${Math.min(i + 50, todo.length)}/${todo.length}…`;
        const rows = todo.slice(i, i + 50).map(it => ({artist:it.artist, title:it.title, year:it.year, type:it.type, cover_url:safeUrl(it.cover) || null}));
        let { data, error } = await sb.from('albums').insert(rows).select();
        if(error){ data = []; for(const r of rows){ const x = await sb.from('albums').insert(r).select().single(); if(!x.error) data.push(x.data); } }
        data.forEach(d => S.albums.set(Number(d.id), {...d, id:Number(d.id)})); added += data.length;
      }
      items.forEach(it => { if(findAlbum(it.artist, it.title)){ if(!it.exists) it.added = true; it.exists = true; } });
      toast(`Dodano ${added} ${pl(added,'album','albumy','albumów')}`); rerender();

async function appleTop(genre){
  const r = await fetch(`https://itunes.apple.com/us/rss/topalbums/limit=100/genre=${genre}/json`);
  if(!r.ok) throw new Error('Apple ' + r.status);
  const j = await r.json(), e = (j.feed && j.feed.entry) || [];
  return (Array.isArray(e) ? e : [e]).map(x => {
    const raw = (x['im:name'] && x['im:name'].label) || '', imgs = x['im:image'] || [];
    const img = (imgs[imgs.length - 1] && imgs[imgs.length - 1].label) || '';
    return {title:raw.replace(/ - (EP|Single)$/i, ''), artist:(x['im:artist'] && x['im:artist'].label) || '',
      type:/ - EP$/i.test(raw) ? 'EP' : / - Single$/i.test(raw) ? 'Singiel' : 'LP',
      year:parseInt(String((x['im:releaseDate'] && x['im:releaseDate'].label) || '').slice(0, 4)) || null,
      cover:img.replace(/\/\d+x\d+bb\./, '/600x600bb.'), thumb:img,
      genre:(x.category && x.category.attributes && x.category.attributes.label) || ''};
  });
}

function histHtml(R, sel, who, hid = []){
  const buckets = [[100,100,'100'],[90,99.9,'90 - 99'],[80,89.9,'80 - 89'],[70,79.9,'70 - 79'],[60,69.9,'60 - 69'],[50,59.9,'50 - 59'],[40,49.9,'40 - 49'],[30,39.9,'30 - 39'],[20,29.9,'20 - 29'],[10,19.9,'10 - 19'],[0,9.9,'0 - 9']]
    .map(([lo, hi, l]) => ({l, lo, hi, mid:(lo + Math.min(hi, 99)) / 2, n:R.filter(r => r.score >= lo && r.score <= hi).length}));
  if(hid.length) buckets.push({l:'🔒', lock:true, n:hid.length});
  const bmax = Math.max(1, ...buckets.map(b => b.n)), selB = buckets.find(b => b.l === sel && b.n) || null;
  const inB = selB && selB.lock ? [...hid].sort((p, q) => S.albums.get(p.album_id).title.localeCompare(S.albums.get(q.album_id).title, 'pl'))

  return `<div class="hist">${buckets.map(b => `<button type="button" class="hrow ${selB === b ? 'on' : ''}" data-b="${b.l}" ${b.n ? '' : 'disabled'} aria-expanded="${selB === b}"><span class="lb">${b.l}</span><span class="ct">${b.n || ''}</span>
      ${b.n ? `<span class="br" style="width:${b.n / bmax * 100}%;background:${b.lock ? 'var(--none)' : col(b.mid)}"></span>` : '<span class="br z"></span>'}</button>`).join('')}</div>
    ${selB ? `<div class="hlist"><div class="shead" style="margin:14px 0 6px"><h2 style="font-size:15px;margin:0">${selB.lock ? '🔒 Ukryte - oceń, żeby zobaczyć' : selB.l}: ${ocen(inB.length)}</h2><button type="button" class="link small" data-hclose>Zwiń</button></div>

        return `<a class="hitem" href="#/album/${a.id}">${coverHtml(a, 'c40')}<span class="meta"><b>${esc(a.title)}</b><span>${esc(a.artist)}${a.year ? ' · ' + a.year : ''}</span></span>

}

function albumLen(T){
  const tr = (T && T.state === 'ok' && T.tracks) || []; if(!tr.length) return null;
  const known = tr.filter(t => t.duration > 0); if(known.length < tr.length * .8) return null;
  const sec = known.reduce((s2, t) => s2 + t.duration, 0), m = Math.round(sec / 60), h = Math.floor(m / 60);
  return {n:tr.length, sec, txt:h ? `${h} godz. ${m % 60} min` : `${m} min`, partial:known.length < tr.length};
}
function updAlbumLen(a){

const autoSkip = t => ({...t, skip:/\b(intro|interlude|skit|prelude|interludium)\b/i.test(t.title) || (t.duration != null && t.duration > 0 && t.duration < 60)});
async function loadTracks(id, force){
  const T = S.tr[id] || (S.tr[id] = {});
  if(T.state === 'ok' && !force) return T;
  const [x, y] = await Promise.all([sb.from('tracks').select('*').eq('album_id', id).order('position'), sb.from('track_ratings').select('*').eq('album_id', id)]);
  const e = x.error || y.error;
  if(e){ T.state = /tracks|track_ratings|relation|schema cache/i.test(e.message || '') ? 'missing' : 'error'; T.err = e; return T; }
  T.tracks = (x.data || []).map(t => ({...t, position:Number(t.position)})).sort((p, q) => p.position - q.position);
  T.ratings = (y.data || []).map(r => ({...r, position:Number(r.position), score:r.score == null ? null : Number(r.score)}));
  T.state = 'ok'; return T;
}
async function fetchTracklist(a){
  const wantSingle = a.type === 'Singiel', shortOk = wantSingle || ['EP','Mixtape','Inne'].includes(a.type);
  try { // 1. Deezer - wśród pasujących wybierz album/EP (nie singiel o tej samej nazwie), najlepiej z największą liczbą utworów
    const rank = x => x.type === 'Singiel' ? (wantSingle ? 3 : 0) : x.type === 'LP' ? 2 : 1;
    const exact = x => simp(x.title) === simp(a.title) ? 1 : 0; // podstawowa wersja przed Deluxe
    const pick = l => l.filter(x => matches(x, a.artist, a.title)).sort((p, q) => rank(q) - rank(p) || exact(q) - exact(p) || q.nb - p.nb)[0];
    let r = pick(await deezerSearch(`artist:"${a.artist}" album:"${cleanT(a.title)}"`));
    if(!r || (!wantSingle && r.type === 'Singiel')){ const r2 = pick(await deezerSearch(a.artist + ' ' + cleanT(a.title))); if(r2 && (!r || rank(r2) > rank(r))) r = r2; }
    if(r && r.dzId && (shortOk || r.type !== 'Singiel' || r.nb >= 4)){
      const d = await jsonp('https://api.deezer.com/album/' + r.dzId + '/tracks?limit=300&output=jsonp');
      const t = ((d && d.data) || []).sort((p, q) => ((p.disk_number || 1) - (q.disk_number || 1)) || ((p.track_position || 0) - (q.track_position || 0)));
      // 1-2 utwory przy albumie to prawie na pewno singiel - wtedy spróbuj MusicBrainz
      if(t.length && (shortOk || t.length > 2)) return {src:'Deezer', tracks:t.map(x => ({title:x.title_short || x.title, duration:x.duration || null}))};
    }
  } catch(e){ console.warn(e); }
  try { // 2. MusicBrainz
    let rg = a.mbid;
    if(!rg){ const res = (await mbSearch(`releasegroup:"${luc(a.title)}" AND artist:"${luc(a.artist)}"`)).filter(r => r.score >= 85); rg = res[0] && res[0].id; }
    if(rg){
      const j = await mbGet(`release?release-group=${rg}&inc=recordings&fmt=json&limit=15`);
      const rels = (j.releases || []).filter(r => r.media && r.media.some(m => (m.tracks || []).length))
        .sort((p, q) => (p.status === 'Official' ? 0 : 1) - (q.status === 'Official' ? 0 : 1) || (p.date || '9999').localeCompare(q.date || '9999'));
      const rel = wantSingle ? rels[0] : (rels.find(r => r.media.reduce((n, m) => n + (m.tracks || []).length, 0) > 2) || rels[0]);
      if(rel) return {src:'MusicBrainz', tracks:rel.media.flatMap(m => m.tracks || []).map(x => ({title:x.title, duration:x.length ? Math.round(x.length / 1000) : null}))};
    }
  } catch(e){ console.warn(e); }
  try { // 3. Apple Music
    const l = (await itunesSearch(a.artist + ' ' + cleanT(a.title))).filter(x => matches(x, a.artist, a.title) && x.itId)
      .sort((p, q) => (simp(q.title) === simp(a.title)) - (simp(p.title) === simp(a.title)) || q.nb - p.nb);
    const r = l.find(x => shortOk || x.nb > 2);
    if(r){
      const d = await jsonp('https://itunes.apple.com/lookup?entity=song&country=PL&limit=300&id=' + r.itId);
      const t = ((d && d.results) || []).filter(x => x.wrapperType === 'track').sort((p, q) => (p.discNumber || 1) - (q.discNumber || 1) || (p.trackNumber || 0) - (q.trackNumber || 0));
      if(t.length) return {src:'Apple Music', tracks:t.map(x => ({title:x.trackName, duration:x.trackTimeMillis ? Math.round(x.trackTimeMillis / 1000) : null}))};
    }
  } catch(e){ console.warn(e); }
  return null;
}
// zapisz tracklistę, zachowując oceny utworów na tych samych pozycjach
async function saveTracklist(id, list){
  const T = S.tr[id] || {tracks:[]}, old = new Map((T.tracks || []).map(t => [t.position, t]));
  const rows = list.map((t, i) => ({album_id:id, position:i + 1, title:String(t.title).trim().slice(0, 300), duration:t.duration || null, skip:!!t.skip}));
  const changed = rows.filter(r => { const o = old.get(r.position); return !o || o.title !== r.title || !!o.skip !== r.skip || (o.duration || null) !== r.duration; });
  if(changed.length){ const { error } = await sb.from('tracks').upsert(changed, {onConflict:'album_id,position'}); if(error) return error; }
  if(old.size > rows.length){ const { error } = await sb.from('tracks').delete().eq('album_id', id).gt('position', rows.length); if(error) return error; }
  return null;
}
async function initTracks(a){
