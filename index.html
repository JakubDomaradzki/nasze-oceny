}
function trackStats(a){
  const T = S.tr[a.id], hid = tracksHidden(a.id), uid = S.user.id;
  const by = new Map(T.tracks.map(t => [t.position, {n:0, sum:0, fav:0, mine:null, myFav:false, others:0, list:[]}]));
  for(const r of T.ratings){ const o = by.get(r.position); if(!o) continue;
    if(r.user_id === uid){ o.mine = r.score; o.myFav = r.fav; } else if(r.score != null) o.others++;
    if(hid) continue;
    if(r.score != null){ o.n++; o.sum += r.score; } if(r.fav) o.fav++; if(r.score != null || r.fav) o.list.push(r); }
  let best = null;
  for(const t of T.tracks){ const o = by.get(t.position); if(!t.skip && o.n >= 2 && (!best || o.sum / o.n > best.avg)) best = {pos:t.position, avg:o.sum / o.n}; }
  return {by, best:trackAvgHidden(a.id) ? null : best, hid, avgHid:trackAvgHidden(a.id)};
}
function mapB(x, c = 80){
  const A = [[0,0],[50,40],[60,50],[c-12,c-20],[c-6,c-12],[c-2,c-6],[c,c-3],[c+2,c+1],[c+4,c+6],[c+6,c+9],[c+8,c+11],[95,97],[100,100]];
  for(let i = 0; i < A.length - 1; i++) if(x <= A[i + 1][0]){ const [x0, y0] = A[i], [x1, y1] = A[i + 1]; return y0 + (x - x0) * (y1 - y0) / (x1 - x0); }
  return 100;
}
/* ----- kalkulator oceny (suwaki) ----- */
const CALC_DEF = {bonus:0.3, kara:0.15, frac:25, center:80, stretch:100, mode:'B'};
function calcCfg(){ if(!S.calc){ let v = {}; try { v = JSON.parse(localStorage.getItem('oceny_calc') || '{}') || {}; } catch(e){} S.calc = Object.assign({}, CALC_DEF, v); } return S.calc; }
function calcSave(){ try { localStorage.setItem('oceny_calc', JSON.stringify(S.calc)); } catch(e){} }
function calcAnchors(c, mode){
  if(mode === 'A') return [[0,0],[60,55],[c-12,c-16],[c-6,c-9],[c-2,c-4],[c,c],[c+2,c+4],[c+4,c+7],[c+6,c+9],[c+8,c+11],[95,97],[100,100]];
  return [[0,0],[50,40],[60,50],[c-12,c-20],[c-6,c-12],[c-2,c-6],[c,c-3],[c+2,c+1],[c+4,c+6],[c+6,c+9],[c+8,c+11],[95,97],[100,100]];
}
function calcMap(x){
  const C = calcCfg(), A = calcAnchors(C.center, C.mode); let y = 100;
  for(let i = 0; i < A.length - 1; i++) if(x <= A[i + 1][0]){ const [x0, y0] = A[i], [x1, y1] = A[i + 1]; y = y0 + (x - x0) * (y1 - y0) / (x1 - x0); break; }
  return x + (C.stretch / 100) * (y - x);
}
function calcCompute(vals){
  const C = calcCfg(), n = vals.length; if(!n) return null;
  const sorted = [...vals].sort((p, q) => q - p), k = Math.min(n, Math.max(2, Math.ceil(n * C.frac / 100)));
  const avg = l => l.reduce((s2, v) => s2 + v, 0) / l.length;
  const Sm = avg(vals), T = avg(sorted.slice(0, k)), D = avg(sorted.slice(n - k));
  const W = Math.max(0, Math.min(100, Sm + C.bonus * (T - Sm) - C.kara * (Sm - D)));
  return {n, k, S:Sm, T, D, W, F:calcMap(W), topThr:sorted[k - 1], botThr:sorted[n - k]};
}
// ręczne wpisywanie: spacje/enter; przecinek przed jedną cyfrą = ułamek; „x” = pomiń; wszystkie ≤ 10 → skala 0-10 (×10)
function calcParse(txt){
  const t = String(txt || '').replace(/(\d),(\d)(?!\d)/g, '$1.$2'), out = [];

async function trackData(a){ const T = S.tr[a.id]; return T && T.state === 'ok' && T.tracks ? T : loadTracks(a.id, true); }
// zapisy ocen piosenek i gwiazdek idą po kolei - inaczej „wpisz ocenę i od razu kliknij ★”
// wysyłało dwa zapisy naraz i późniejszy kasował ocenę
let trQ = Promise.resolve();
const trQueue = fn => { const p = trQ.then(fn, fn); trQ = p.catch(() => {}); return p; };
async function saveTrackScore(a, pos, inp){
  try { return await trQueue(() => saveTrackScore_(a, pos, inp)); }
  catch(e){ console.error(e); toast('Nie udało się zapisać oceny piosenki - sprawdź internet i spróbuj jeszcze raz', true); }
}
async function saveTrackScore_(a, pos, inp){
  const T = await trackData(a), uid = S.user.id, raw = inp.value.trim();
  if(!T || T.state !== 'ok') throw new Error('brak tracklisty');
  const cur = T.ratings.find(r => r.user_id === uid && r.position === pos);
  let score = null;
  if(raw){ score = parseScore(raw); if(score == null){ toast('Ocena piosenki: liczba od 0 do 100', true); inp.value = cur && cur.score != null ? num(cur.score) : ''; return; } }
  let error;
  if(score == null && !(cur && cur.fav)){
    if(!cur) return;
    ({ error } = await sb.from('track_ratings').delete().eq('user_id', uid).eq('album_id', a.id).eq('position', pos));
    if(!error) T.ratings = T.ratings.filter(r => r !== cur);
  } else {
    const row = {user_id:uid, album_id:a.id, position:pos, score, fav:!!(cur && cur.fav), updated_at:new Date().toISOString()};
    let data; ({ data, error } = await sb.from('track_ratings').upsert(row, {onConflict:'user_id,album_id,position'}).select().single());
    if(!error){ const nr = {...data, position:Number(data.position), score:data.score == null ? null : Number(data.score)}; T.ratings = T.ratings.filter(r => r !== cur).concat(nr);
      const lo = S.listening.get(uid); S.listening.set(uid, {album_id:a.id, at:Date.now(), n:lo && lo.album_id === a.id ? lo.n + 1 : 1}); fillListening(true); }
  }
  if(error) return toast(errMsg(error), true);
  if(score != null) inp.value = num(score);
  inp.classList.add('saved'); setTimeout(() => inp.classList.remove('saved'), 700);
  refreshTrackRow(a, pos);
}
async function toggleFavTrack(a, pos){
  try { return await trQueue(() => toggleFavTrack_(a, pos)); }
  catch(e){ console.error(e); toast('Nie udało się zapisać - sprawdź internet i spróbuj jeszcze raz', true); }
}
async function toggleFavTrack_(a, pos){
  const T = await trackData(a), uid = S.user.id; if(!T || T.state !== 'ok') throw new Error('brak tracklisty');
  const mine = T.ratings.filter(r => r.user_id === uid);
  const cur = mine.find(r => r.position === pos), on = !(cur && cur.fav);
  const rows = [];
  if(on) for(const r of mine) if(r.fav && r.position !== pos) rows.push({user_id:uid, album_id:a.id, position:r.position, score:r.score, fav:false});
  // ocena wpisana w tym wierszu, ale jeszcze niezapisana - zapisz ją razem z gwiazdką
  const inp = document.querySelector(`#trkBody .tin[data-pos="${pos}"]`), typed = inp && inp.value.trim() ? parseScore(inp.value) : null;
  rows.push({user_id:uid, album_id:a.id, position:pos, score:typed != null ? typed : cur ? cur.score : null, fav:on});
  const { data, error } = await sb.from('track_ratings').upsert(rows, {onConflict:'user_id,album_id,position'}).select();
  if(error) return toast(errMsg(error), true);
  for(const d of data){ const nr = {...d, position:Number(d.position), score:d.score == null ? null : Number(d.score)};
    T.ratings = T.ratings.filter(r => !(r.user_id === uid && r.position === nr.position)).concat(nr); }
  // wiersz tylko z gwiazdką (bez oceny) po odznaczeniu - usuń
  if(!on && cur && cur.score == null && typed == null){ await sb.from('track_ratings').delete().eq('user_id', uid).eq('album_id', a.id).eq('position', pos);
    T.ratings = T.ratings.filter(r => !(r.user_id === uid && r.position === pos)); }
  refreshTrackRow(a, pos);
  if(on) toast('Ulubiony utwór: ' + (T.tracks.find(t => t.position === pos) || {}).title);
}
function drawTrackEditor(a){
  const T = S.tr[a.id], body = document.getElementById('trkBody'), tools = document.getElementById('trkTools');
  tools.innerHTML = '';
  const text = (T.tracks || []).map(t => (t.skip ? '* ' : '') + t.title + (t.duration ? '  [' + fmtDur(t.duration) + ']' : '')).join('\n');
  body.innerHTML = `<div class="form tred">
    <label><span>Jeden utwór w wierszu, w kolejności. Gwiazdka <code>*</code> na początku = utwór pomijany w ocenie albumu (intro, skit). Długość w nawiasie <code>[3:21]</code> jest opcjonalna.</span>
      <textarea id="trTxt" placeholder="Green Light  [3:54]&#10;Sober  [3:17]&#10;* Interlude">${esc(text)}</textarea></label>
    <div class="btns"><button class="btn-p" id="trSave">Zapisz tracklistę</button><button id="trFetch">Pobierz z internetu</button><button id="trCancel">Anuluj</button><span class="small" id="trMsg"></span></div>
    <p class="note">Oceny piosenek są przypisane do numeru utworu. Zmiana tytułu ich nie usuwa; usunięcie utworu z końca listy usuwa jego oceny.</p></div>`;
  const parse = () => document.getElementById('trTxt').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const skip = l.startsWith('*'); l = l.replace(/^\*\s*/, '');
    let duration = null; const m = l.match(/\s*\[(\d+):(\d{2})\]\s*$/); if(m){ duration = +m[1] * 60 + +m[2]; l = l.slice(0, m.index); }
    l = l.replace(/^\d+[.)]\s+/, ''); return {title:l, duration, skip}; }).filter(t => t.title);
  document.getElementById('trCancel').onclick = () => { T.edit = false; drawTracks(a); };
  document.getElementById('trFetch').onclick = async () => {
    const msg = document.getElementById('trMsg'); msg.textContent = 'Szukam…';
    const r = await fetchTracklist(a);
    if(!r){ msg.textContent = 'Nie znaleziono.'; return; }
    document.getElementById('trTxt').value = r.tracks.map(autoSkip).map(t => (t.skip ? '* ' : '') + t.title + (t.duration ? '  [' + fmtDur(t.duration) + ']' : '')).join('\n');
    msg.textContent = `Pobrano z ${r.src} - sprawdź i kliknij „Zapisz tracklistę”.`; T.src = r.src;
  };
  const sv = document.getElementById('trSave');
  sv.onclick = async () => {
    const list = parse(), msg = document.getElementById('trMsg');
    if(!list.length){ msg.textContent = 'Wpisz co najmniej jeden utwór.'; return; }
    const lost = T.ratings.filter(r => r.position > list.length).length;
    if(lost && !sv.classList.contains('armed')){ sv.classList.add('armed', 'btn-d'); sv.classList.remove('btn-p'); sv.textContent = `Zapisz (usunie ${ocen(lost)} utworów z końca)`; return; }
    sv.disabled = true;
    const err = await saveTracklist(a.id, list);
    if(err){ sv.disabled = false; msg.innerHTML = `<span class="err">${esc(errMsg(err))}</span>`; return; }
    await loadTracks(a.id, true); T.edit = false; toast('Zapisano tracklistę'); drawTracks(a);
  };
}

  const l = all.filter(r => { const a = S.albums.get(r.album_id); return (!q || norm(a.artist).includes(q) || norm(a.title).includes(q)) && (O.sort !== 'changed' || scoreChain(r.album_id, uid)); });
  const cmp = {new:(x, y) => tsOf(y) - tsOf(x), high:(x, y) => y.score - x.score || tsOf(y) - tsOf(x), low:(x, y) => x.score - y.score || tsOf(y) - tsOf(x),
    year:(x, y) => (S.albums.get(y.album_id).year || 0) - (S.albums.get(x.album_id).year || 0) || tsOf(y) - tsOf(x),
    changed:(x, y) => tsOf(y) - tsOf(x)}[O.sort];
  l.sort(cmp);

      <label>Sortuj<select id="osort">${[['new','Najnowsze'],['high','Najwyżej ocenione'],['low','Najniżej ocenione'],['year','Rok wydania'],['changed','Zmienione oceny']].map(([v, t]) => `<option value="${v}" ${O.sort === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
    <div id="ogrid"></div>`;
  const draw = () => {
    const shown = l.slice(0, O.limit);
    document.getElementById('ogrid').innerHTML = l.length ? `<div class="grid">${shown.map(r => { const a = S.albums.get(r.album_id);

      : `<div class="card empty">${O.sort === 'changed' ? (S.hist ? 'Żadna ocena nie była jeszcze zmieniana.' : 'Historia zmian działa po uruchomieniu update4.sql w Supabase.') : 'Brak ocen.'}</div>`;
    const m = document.getElementById('omore'); if(m) m.onclick = () => { O.limit += 120; draw(); };
  };
  draw();
  bindSeg('okind', v => { O.kind = v; O.limit = 60; render(); });
  document.getElementById('osort').onchange = e => { O.sort = e.target.value; O.limit = 60; render(); };
  const qi = document.getElementById('oq'); qi.oninput = () => { O.q = qi.value; O.limit = 60; const pos = qi.selectionStart; render(); const q2 = document.getElementById('oq'); q2.focus(); q2.setSelectionRange(pos, pos); };
}

function updLgrid(){

function bindAotw(){
  const H = S.home;
  const e = document.getElementById('wedit'); if(e) e.onclick = () => { H.aotwEdit = true; render(); };
  const c = document.getElementById('wcancel'); if(c) c.onclick = () => { H.aotwEdit = false; render(); };
  if(document.getElementById('wpick')) bindPicker('wpick', async a => { if(await setWeekly(a.id)){ H.aotwEdit = false; toast('Album tygodnia: ' + a.title); render(); } }, a => isSingle(a));
  const r = document.getElementById('wrand'); if(r) r.onclick = async () => {
    const used = new Set(S.weekly.map(w => w.album_id)), half = S.profiles.size / 2;
    let pool = [...S.albums.values()].filter(a => !isSingle(a) && !used.has(a.id) && stats(a.id).n <= Math.max(1, half - 1));
    if(!pool.length) pool = [...S.albums.values()].filter(a => !isSingle(a) && !used.has(a.id));
    if(!pool.length) return toast('Brak albumów do wylosowania', true);
    const a = pool[Math.floor(Math.random() * pool.length)];
    if(await setWeekly(a.id)){ H.aotwEdit = false; toast('Wylosowano: ' + a.title); render(); }
  };
}

/* ----- losowanie ----- */
function randomPool(){
  const R = S.rand, uid = S.user.id, from = R.from ? +R.from : null, to = R.to ? +R.to : null;
  return [...S.albums.values()].filter(a => {
    if(!kindOk(a, R.kind)) return false;
    if(from != null && !(a.year && a.year >= from)) return false;
    if(to != null && !(a.year && a.year <= to)) return false;
    if(R.src === 'unrated') return !myRating(a.id);
    if(R.src === 'listen') return inListen(a.id);
    if(R.src === 'rec'){
      if(myRating(a.id)) return false;
      const o = (S.byAlbum.get(a.id) || []).filter(r => r.user_id !== uid && !isHidden(r));
      return o.length > 0 && o.reduce((s, r) => s + r.score, 0) / o.length >= R.min;

function hiddenRecs(){ try { return new Set(JSON.parse(localStorage.getItem('oceny_hide_' + S.user.id) || '[]')); } catch(e){ return new Set(); } }

// przewidywana ocena = Twoja średnia + o ile album podobał się innym ponad ICH średnią;
// głos osoby waży tym więcej, im bardziej zgodny macie gust (i im więcej wspólnych albumów)
function recommend(kind){
  const uid = S.user.id, mine = (S.byUser.get(uid) || []).map(r => r.score);
  if(mine.length < 5) return {few:true, items:[]};
  const myAvg = mine.reduce((s, x) => s + x, 0) / mine.length, mineSet = new Set((S.byUser.get(uid) || []).map(r => r.album_id));
  const W = new Map();
  for(const p of S.profiles.values()){
    if(p.id === uid) continue;
    const rs = (S.byUser.get(p.id) || []).filter(r => !aotwHidden(r.album_id)); if(rs.length < 3) continue;
    const c = compat(uid, p.id), base = c.pct == null ? 0.08 : Math.pow(Math.max(0, c.pct) / 100, 3);
    W.set(p.id, {w:base * Math.min(1, (c.n + 2) / 12), avg:rs.reduce((s, r) => s + r.score, 0) / rs.length, pct:c.pct});
  }
  const hide = hiddenRecs(), items = [];
  for(const a of S.albums.values()){
    if(mineSet.has(a.id) || aotwHidden(a.id) || hide.has(a.id) || !kindOk(a, kind)) continue;
    let sw = 0, sdv = 0; const fans = [];
    for(const r of S.byAlbum.get(a.id) || []){ const f = W.get(r.user_id); if(!f || !f.w) continue;
      sw += f.w; sdv += f.w * (r.score - f.avg); fans.push({u:r.user_id, s:r.score, k:f.w * (r.score - f.avg)}); }
    if(!fans.length) continue;
    items.push({a, pred:Math.max(0, Math.min(100, myAvg + sdv / (sw + 0.25))), fans:fans.sort((x, y) => y.k - x.k)});
  }
  return {myAvg, items:items.sort((x, y) => y.pred - x.pred || y.fans.length - x.fans.length)};
}

// --- nowości od wykonawców (Deezer) ---
let dzNext = 0; // Deezer: maks. 50 zapytań na 5 s - zostawiamy zapas
async function dzGet(url){ const wait = dzNext - Date.now(); dzNext = Math.max(Date.now(), dzNext) + 130; if(wait > 0) await sleep(wait); return jsonp(url, 10000); }
function newsArtists(scope){
  const m = new Map(), R = scope === 'me' ? (S.byUser.get(S.user.id) || []) : visRatings();
  for(const r of R){ const a = S.albums.get(r.album_id); if(!a) continue;
    for(const p of artistParts(a.artist)){ const k = simp(p); if(!k) continue; const o = m.get(k) || {name:p, k, n:0, sum:0, users:new Set()}; o.n++; o.sum += r.score; o.users.add(r.user_id); m.set(k, o); } }
  return [...m.values()].filter(o => o.sum / o.n >= 65 || o.n >= 3).sort((x, y) => y.n * (y.sum / y.n) - x.n * (x.sum / x.n)).slice(0, scope === 'me' ? 50 : 90);
}
const NEWS_DAYS = 200;
async function fetchNews(scope, onProg){
  let ids = {}; try { ids = JSON.parse(localStorage.getItem('oceny_dzart') || '{}'); } catch(e){}
  const arts = newsArtists(scope), out = [], cutoff = Date.now() - NEWS_DAYS * 864e5; let done = 0, fail = 0;
  const work = async o => {
    try {
      let id = ids[o.k];
      if(id === undefined){
        const d = await dzGet('https://api.deezer.com/search/artist?limit=5&output=jsonp&q=' + encodeURIComponent(o.name));
        const hit = ((d && d.data) || []).find(x => simp(x.name) === o.k); id = hit ? hit.id : 0; ids[o.k] = id;
      }
      if(id){
        const d = await dzGet('https://api.deezer.com/artist/' + id + '/albums?limit=60&output=jsonp');
        for(const x of (d && d.data) || []){ const t = Date.parse(x.release_date || ''); if(!t || t < cutoff) continue;
          out.push({...dzAlbum(x, o.name), date:x.release_date, ts:t, fans:[...o.users]}); }
      }
    } catch(e){ fail++; }
    done++; onProg(done, arts.length);
  };
  const q = [...arts]; await Promise.all([0, 1, 2, 3].map(async () => { while(q.length) await work(q.shift()); }));
  try { localStorage.setItem('oceny_dzart', JSON.stringify(ids)); } catch(e){}
  // ta sama płyta u kilku wykonawców (współpraca) albo w kilku wersjach - zostaw jedną
  const seen = new Map();
  for(const it of out){ const k = simp(cleanT(it.title)) + '|' + it.date.slice(0, 7); const o = seen.get(k);
    if(!o) seen.set(k, it); else o.fans = [...new Set([...o.fans, ...it.fans])]; }
  return {items:[...seen.values()].sort((a, b) => b.ts - a.ts), artists:arts.length, fail};
}
function newsWhen(ts){
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  const d = Math.round((new Date(ts).setHours(0, 0, 0, 0) - d0) / 864e5);
  return d > 1 ? `premiera za ${d} dni` : d === 1 ? 'premiera jutro' : d === 0 ? 'dziś' : d === -1 ? 'wczoraj' : -d < 14 ? `${-d} dni temu` : -d < 60 ? `${Math.round(-d / 7)} tyg. temu` : `${Math.round(-d / 30)} mies. temu`;
}

const daysTo = ts => { const d0 = new Date(); d0.setHours(0, 0, 0, 0); return Math.max(0, Math.round((new Date(ts).setHours(0, 0, 0, 0) - d0) / 864e5)); };
// karta na stronie głównej: najbliższe premiery z ostatniego sprawdzenia nowości (nic nie pobiera sama)
function upcomingHtml(){

  if(!c || Date.now() - c.at > 14 * 864e5) return '';

    .filter(it => { const a = findAlbum(it.artist, it.title); return !(a && myRating(a.id)); }).sort((x, y) => x.ts - y.ts).slice(0, 5);
  if(!list.length) return '';

      return `<a class="arch" href="${href}">${a ? coverHtml(a, 'c40') : coverHtml({title:it.title, cover_url:it.thumb}, 'c40')}<div><span><b>${esc(it.title)}</b></span><span class="muted">${esc(it.artist)}</span></div>
        <span class="upd ${soon ? 'soon' : ''}">${soon ? (daysTo(it.ts) === 0 ? 'dziś' : daysTo(it.ts) === 1 ? 'jutro' : 'za ' + daysTo(it.ts) + ' dni') : 'nowość'}</span></a>`; }).join('')}</section>`;
}

const TYPE_MAP = {lp:'LP', album:'LP', soundtrack:'Inne', other:'Inne', inne:'Inne', ep:'EP', mixtape:'Mixtape', compilation:'Kompilacja', kompilacja:'Kompilacja', live:'Live', single:'Singiel', singiel:'Singiel', reissue:'LP'};
function parseImport(text){
  const lines = text.replace(/^\ufeff/, '').split(/\r?\n/).filter(l => l.trim());
  if(!lines.length) return [];
  // wykryj separator (tabulator, średnik, przecinek) poza cudzysłowami
  const count = (l, d) => { let n = 0, q = false; for(const ch of l){ if(ch === '"') q = !q; else if(!q && ch === d) n++; } return n; };
  const first = lines[0];
  const delim = count(first, '\t') ? '\t' : count(first, ';') >= count(first, ',') && count(first, ';') ? ';' : count(first, ',') ? ',' : ';';
  const split = l => { const out = []; let cur = '', q = false;
    for(let i = 0; i < l.length; i++){ const ch = l[i];
      if(q){ if(ch === '"'){ if(l[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
      else if(ch === '"') q = true; else if(ch === delim){ out.push(cur.trim()); cur = ''; } else cur += ch; }
    out.push(cur.trim()); return out; };
  let idx = null;
  const head = split(lines[0]).map(norm);
  const find = names => head.findIndex(h => names.includes(h));
  if(find(['artist','wykonawca','artysta']) >= 0 && find(['album','tytuł','tytul','title']) >= 0){
    idx = {artist:find(['artist','wykonawca','artysta']), title:find(['album','tytuł','tytul','title']), year:find(['year','rok']),
           type:find(['type','typ']), score:find(['rating','ocena','score'])};
    lines.shift();
  }
  return lines.map((l, n) => {
    const c = split(l);
    let artist, title, year = null, type = 'LP', score = null;
    if(idx){
      artist = c[idx.artist]; title = c[idx.title];
      if(idx.year >= 0) year = parseInt(c[idx.year]) || null;
      if(idx.type >= 0 && c[idx.type]) type = TYPE_MAP[norm(c[idx.type])] || 'Inne';
      if(idx.score >= 0) score = parseScore(c[idx.score]);
    } else {
      artist = c[0]; title = c[1];
      for(let i = 2; i < c.length; i++){
        const v = c[i];
        if(year == null && /^(19|20)\d\d$/.test(v)){ year = +v; continue; }
        if(TYPE_MAP[norm(v)]){ type = TYPE_MAP[norm(v)]; continue; }
        if(score == null && /^\d{1,3}([.,]\d)?$/.test(v) && parseScore(v) != null){ score = parseScore(v); }
      }
    }
    const ok = artist && title && score != null;
    const ex = ok ? findAlbum(artist, title) : null;
    return {n:n + 1, artist, title, year, type, score, ok, ex};
  });
}

async function runImport(rows, btn){
  const st = document.getElementById('ist'), overwrite = document.getElementById('iov').checked;
  btn.disabled = true;
  try {
    st.textContent = 'Odświeżam dane…'; await loadData();
    // 1. nowe albumy
    const need = new Map();
    for(const r of rows){ const k = keyOf(r.artist, r.title); if(!findAlbum(r.artist, r.title) && !need.has(k)) need.set(k, {artist:r.artist, title:r.title, year:r.year, type:r.type}); }
    const toAdd = [...need.values()];
    for(let i = 0; i < toAdd.length; i += 100){
      st.textContent = `Dodaję albumy ${Math.min(i + 100, toAdd.length)}/${toAdd.length}…`;
      const chunk = toAdd.slice(i, i + 100);
      const { data, error } = await sb.from('albums').insert(chunk).select();
      if(!error){ data.forEach(d => S.albums.set(Number(d.id), {...d, id:Number(d.id)})); continue; }
      for(const one of chunk){ // ktoś mógł dodać w międzyczasie - po jednym
        const r = await sb.from('albums').insert(one).select().single();
        if(!r.error) S.albums.set(Number(r.data.id), {...r.data, id:Number(r.data.id)});
      }
      await loadData();
    }
    // 2. oceny
    const ratings = new Map();
    for(const r of rows){ const a = findAlbum(r.artist, r.title); if(!a) continue;
      if(!overwrite && myRating(a.id)) continue;
      ratings.set(a.id, {album_id:a.id, user_id:S.user.id, score:r.score}); }
    const list = [...ratings.values()];
    let saved = 0;
    for(let i = 0; i < list.length; i += 200){
      st.textContent = `Zapisuję oceny ${Math.min(i + 200, list.length)}/${list.length}…`;
      const { data, error } = await sb.from('ratings').upsert(list.slice(i, i + 200), {onConflict:'album_id,user_id'}).select();
      if(error) throw error;
      saved += data.length;
    }
    await loadData();
    st.innerHTML = `<span class="ok">Gotowe: ${toAdd.length} ${pl(toAdd.length,'nowy album','nowe albumy','nowych albumów')}, ${saved} ${pl(saved,'zapisana ocena','zapisane oceny','zapisanych ocen')}.</span>`;
    toast('Import zakończony');
  } catch(e){ st.innerHTML = `<span class="err">Błąd: ${esc(errMsg(e))}</span>`; btn.disabled = false; }
}

      <div class="form"><label>Wgraj zdjęcie<input type="file" id="avf" accept="image/*"></label>
      ${safeUrl(p.avatar_url) ? '<div><button class="btn-d" id="avdel">Usuń avatar</button></div>' : ''}<div id="avm"></div></div></div></div>
  <div class="card" style="margin-bottom:18px"><h2>Last.fm</h2>
    <form class="form" id="lff"><label>Nazwa użytkownika na Last.fm<input id="lfu" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="np. kuba_123" value="${esc(p.lastfm || '')}"></label>
      <div class="btns"><button class="btn-p">Zapisz</button>${p.lastfm ? '<button type="button" id="lfdel">Odepnij</button>' : ''}</div><div id="lfm_"></div></form>
    <p class="note">Na Twoim profilu pojawi się link do Last.fm${CONFIG.LASTFM_KEY ? ' i to, czego właśnie słuchasz (albo ostatni utwór)' : ''}. Wpisz samą nazwę - tę z adresu last.fm/user/<b>nazwa</b>.</p></div>
  <div class="cols" style="margin-top:0">
    <div class="card"><h2>Nazwa widoczna dla innych</h2>
      <form class="form" id="nf"><input id="nn" maxlength="40" required value="${esc(p.display_name || '')}">
      <div class="btns"><button class="btn-p">Zapisz</button></div><div id="nm"></div></form></div>
    <div class="card"><h2>Zmiana hasła</h2>
      <form class="form" id="pf"><label>Nowe hasło<input type="password" id="p1" minlength="6" autocomplete="new-password" required></label>
      <label>Powtórz hasło<input type="password" id="p2" minlength="6" autocomplete="new-password" required></label>
      <div class="btns"><button class="btn-p">Zmień hasło</button></div><div id="pm"></div></form></div>
  </div>
  <div class="card" style="margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0">Wylogowanie</h2><p class="muted small" style="margin:4px 0 0">Na tym urządzeniu trzeba będzie zalogować się ponownie.</p></div><button class="btn-d" id="acclogout">Wyloguj</button></div>`;
  document.getElementById('acclogout').onclick = logout;
  const saveLfm = async v => { const m = document.getElementById('lfm_');
    if(v && !/^[A-Za-z][A-Za-z0-9_-]{1,14}$/.test(v)){ m.className = 'err'; m.textContent = 'Nazwa na Last.fm ma 2-15 znaków: litery, cyfry, _ i -, na początku litera.'; return; }
    const { error } = await sb.from('profiles').update({lastfm:v || null}).eq('id', S.user.id);
    if(error){ m.className = 'err'; m.textContent = /lastfm/.test(error.message || '') ? 'Najpierw uruchom update8.sql w Supabase.' : errMsg(error); return; }
    const pr = S.profiles.get(S.user.id); if(pr) pr.lastfm = v || null; LFM.clear();
    toast(v ? 'Podpięto Last.fm: ' + v : 'Odpięto Last.fm'); render(); };
  document.getElementById('lff').onsubmit = e => { e.preventDefault(); saveLfm(document.getElementById('lfu').value.trim().replace(/^.*last\.fm\/(?:[a-z]{2}\/)?user\//i, '').replace(/\/.*$/, '')); };
  const lfd = document.getElementById('lfdel'); if(lfd) lfd.onclick = () => saveLfm(null);
  document.getElementById('nf').onsubmit = async e => {
    e.preventDefault(); const v = document.getElementById('nn').value.trim(), m = document.getElementById('nm'); if(!v) return;
    const { error } = await sb.from('profiles').update({display_name:v}).eq('id', S.user.id);
    if(error){ m.className = 'err'; m.textContent = errMsg(error); return; }
    const pr = S.profiles.get(S.user.id); if(pr) pr.display_name = v;
    m.className = 'ok'; m.textContent = 'Zapisano.'; renderNav(null);
  };
  const setAvatar = async url => {
    const m = document.getElementById('avm');
    const { error } = await sb.from('profiles').update({avatar_url:url}).eq('id', S.user.id);
    if(error){ m.className = 'err'; m.textContent = /avatar_url/.test(error.message || '') ? 'Najpierw uruchom update.sql w Supabase.' : errMsg(error); return; }
    const pr = S.profiles.get(S.user.id); if(pr) pr.avatar_url = url;
    toast(url ? 'Avatar zapisany' : 'Avatar usunięty'); render();
  };
  document.getElementById('avf').onchange = async e => {
    const file = e.target.files[0]; if(!file) return; const m = document.getElementById('avm');
    m.className = 'muted small'; m.textContent = 'Wgrywanie…';
    try {
      const blob = await cropSquare(file, 320);
      const path = `avatars/${S.user.id}/${Date.now()}.jpg`;
      const { error } = await sb.storage.from('covers').upload(path, blob, {contentType:'image/jpeg', upsert:false});
      if(error) throw error;
      await setAvatar(sb.storage.from('covers').getPublicUrl(path).data.publicUrl);
    } catch(err){ m.className = 'err'; m.textContent = 'Nie udało się wgrać: ' + errMsg(err); }
  };
  bindSeg('mvseg', v => { try { localStorage.setItem('oceny_mv_' + S.user.id, v); } catch(e){} toast(v === 'day' ? 'Strzałki: ostatnie 24 h' : 'Strzałki: ostatnia ocena'); render(); });
  bindSeg('blseg', v => { setBlind(v); toast({off:'Nic nie jest ukrywane', songs:'🔒 Średnie piosenek ukryte do Twojej oceny', all:'🔒 Wszystkie oceny ukryte do Twojej oceny'}[v]); render(); });
  bindSeg('thseg', v => { setTheme(v); render(); });
  const ad = document.getElementById('avdel'); if(ad) ad.onclick = () => setAvatar(null);
  document.getElementById('pf').onsubmit = async e => {
    e.preventDefault(); const a = document.getElementById('p1').value, b = document.getElementById('p2').value, m = document.getElementById('pm');
    if(a !== b){ m.className = 'err'; m.textContent = 'Hasła się różnią.'; return; }
    const { error } = await sb.auth.updateUser({password:a});
    if(error){ m.className = 'err'; m.textContent = errMsg(error); return; }
    m.className = 'ok'; m.textContent = 'Hasło zmienione.'; e.target.reset();
  };
}

/* ---------- start ---------- */
async function init(){
  if(!window.supabase || CONFIG.SUPABASE_URL.includes('TWOJ-PROJEKT')){
    app.innerHTML = `<div class="card login"><h1>Prawie gotowe</h1><p>Brakuje pliku <code>config.js</code> obok <code>index.html</code> albo nie ma w nim adresu i klucza Supabase.</p></div>`;
    return;
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
    auth:{persistSession:true, autoRefreshToken:true, lock:async (name, timeout, fn) => fn()}  // bez blokady przeglądarki - nie zawiesza zapytań po powrocie do karty
  });
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ S.user = session.user; app.innerHTML = '<div class="loading">Ładowanie ocen…</div>'; await safeLoad(); initSeen(); }
  render();
  sb.auth.onAuthStateChange((ev, session) => { if(ev === 'SIGNED_OUT' && S.user){ S.user = null; render(); } });
  window.addEventListener('hashchange', () => { closePop(); closeSearch(); render(); });
  // klik w ocenę na okładce -> okienko z ocenami piosenek (nie przechodzi do albumu)
  const tpOpen = e => { const t = e.target.closest && e.target.closest('[data-tp]'); if(!t) return false;
    e.preventDefault(); e.stopPropagation(); const a = S.albums.get(Number(t.dataset.tp)); if(a) showUserTracksPop(a, t.dataset.tu, t); return true; };
  document.addEventListener('click', tpOpen, true);
  document.addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-tp]')) tpOpen(e); if(e.key === 'Escape') closePop(); });
  // po powrocie do karty odśwież dane (tylko na stronach bez formularzy)
  document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState !== 'visible' || !S.user || Date.now() - S.loadedAt < 120000) return;
    const p = route().page; await safeLoad();
    if(['start','aktywnosc','ranking','lata','osoby','osoba','statystyki','wykonawca'].includes(p) && route().page === p) render();
    if(p === 'album' && route().page === 'album'){ const a = S.albums.get(Number(route().arg));
      if(a && S.tr[a.id] && S.tr[a.id].state === 'ok' && !S.tr[a.id].edit){ await loadTracks(a.id, true); refreshTrackRow(a, 0); } }
  });
}
init();
</script>
